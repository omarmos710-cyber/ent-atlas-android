<!doctype html><html><head><meta charset="utf-8"><title>{TITLE}</title>
<style>
@font-face{font-family:Caveat;src:url(fonts/Caveat.ttf)}
@font-face{font-family:Hand;src:url(fonts/PatrickHand.ttf)}
@font-face{font-family:Kalam;src:url(fonts/KalamBold.ttf)}
:root{--ink:#1d2330;--blue:#1f5fbf;--red:#d33a2c;--green:#1f8a4c;--orange:#e07b1a;--purple:#7b44b8;--teal:#138a8a;--hl:rgba(255,226,74,.65)}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1760px;background:#fbfbf7;color:var(--ink);font:17px/1.32 Hand,sans-serif;padding:22px 16px 26px;
 background-image:radial-gradient(rgba(0,0,0,.035) 1px,transparent 1px);background-size:18px 18px}
h1{font:700 52px/1 Caveat;text-align:center;letter-spacing:.5px}
.sub{text-align:center;font:22px Caveat;color:#555;margin:4px 0 14px}
.hl{background:linear-gradient(transparent 45%,var(--hl) 45%,var(--hl) 88%,transparent 88%);padding:0 2px}
b{font-family:Kalam;font-weight:700;font-size:.95em}
.card{position:relative;border:2.4px solid var(--c,var(--ink));border-radius:255px 18px 225px 16px/16px 225px 18px 255px;padding:12px 14px 12px;margin:20px 0 0;background:#fff}
.card h2{font:700 30px/1 Caveat;color:var(--c);display:flex;align-items:center;gap:8px;margin-bottom:6px}
.n{display:inline-grid;place-items:center;width:34px;height:34px;border:2.4px solid var(--c);border-radius:50% 46% 52% 48%;font:700 22px Kalam;color:var(--c);flex:none}
.row{display:flex;gap:10px;align-items:flex-start}
.col{flex:1;min-width:0}
ul{list-style:none;margin:2px 0}
li{position:relative;padding-left:16px;margin:3px 0}
li:before{content:"";position:absolute;left:2px;top:.55em;width:7px;height:7px;border-radius:50%;background:var(--c,var(--ink))}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:4px 2px;margin:6px 0}
.chip{border:2px solid var(--c);border-radius:12px 6px 14px 7px;padding:1px 7px;background:#fff;font-size:15.5px}
.ar{font:700 22px Caveat;color:var(--c);padding:0 2px}
.note{font:23px/1.05 Caveat;color:var(--red)}
.warn{border:2.4px dashed var(--red);border-radius:14px 8px 16px 9px;padding:6px 10px;margin:8px 0 2px;background:#fff5f3}
.warn b{color:var(--red)}
.mini{font-size:15px;color:#333}
table{border-collapse:collapse;width:100%;font-size:15px;margin-top:4px}
td,th{border-bottom:1.6px solid #d9d6cc;padding:3px 4px;text-align:left;vertical-align:top}
th{font:700 15px Kalam;color:var(--c)}
.tag{display:inline-block;font:700 13px Kalam;color:#fff;background:var(--c);border-radius:8px 4px 9px 5px;padding:0 6px;margin-right:3px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.box{border:2px solid var(--c);border-radius:16px 8px 18px 9px;padding:6px 8px;background:#fff}
.box h3{font:700 22px/1 Caveat;color:var(--c);margin-bottom:2px}
.foot{text-align:center;font:20px Caveat;color:#777;margin-top:18px}
.grid{display:grid;grid-template-columns:1.05fr 1fr 1fr 1fr;gap:18px;align-items:start}
.gcol>.card:first-child{margin-top:4px}
h1{font-size:64px}
</style></head><body>
{BODY}
</body></html>

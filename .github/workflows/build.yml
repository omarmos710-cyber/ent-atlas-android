name: Verify and release ENT Companion

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          gradle-version: '8.9'
      - name: Run regression checks
        run: |
          node tools/test_smart.js
          node tools/test_answer.js
          node --test tools/test_release.js
          python3 tools/build_public.py web dist
      - name: Build Android for verification
        run: gradle :app:assembleDebug --no-daemon
      - name: Package web build
        run: zip -q -r "$RUNNER_TEMP/ENT-Companion-Web.zip" .
        working-directory: dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ENT-Companion-Web
          path: ${{ runner.temp }}/ENT-Companion-Web.zip
          if-no-files-found: error

  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: android-production-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          gradle-version: '8.9'
          cache-disabled: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ENT-Companion-Web
          path: release
      - name: Build and verify signed Android release
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -eu
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "::error::Set ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD in the repository's Actions secrets."
            exit 1
          fi
          umask 077
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/ent-companion.p12"
          trap 'rm -f "$ANDROID_KEYSTORE_FILE"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_FILE"
          unset ANDROID_KEYSTORE_BASE64
          gradle :app:assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk release/ENT-Companion.apk
          sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          apksigner=$(find "$sdk_root/build-tools" -name apksigner | sort -V | tail -1)
          "$apksigner" verify release/ENT-Companion.apk
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="v2.0.$GITHUB_RUN_NUMBER"
          gh release create "$tag" release/ENT-Companion.apk release/ENT-Companion-Web.zip \
            --target "$GITHUB_SHA" --title "The ENT Companion ${tag#v}" \
            --notes-file .github/release-notes.md

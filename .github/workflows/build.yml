name: Build APK

on:
  push:
    branches: [main]
    # a refreshed offline list (web/sw.js) changes only the web app, not the APK
    paths-ignore: ['web/sw.js']
  # pull requests get a test build (not published) so a broken change is caught before it reaches main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Signing. The first key (signing/ent-atlas.jks) leaked with its old password in the public history, so the app
      # moves to a new key with Android's key rotation: the APK carries a "lineage" saying the old key handed over to
      # the new one, so phones accept the update without a reinstall, and (Android 9+) refuse anything later signed
      # with the old key alone. The new key is created here once, from the NEW_SIGNING_PASSWORD secret, and committed
      # (password-protected); no password is ever stored in the repository.
      - name: Build APK
        run: |
          # the PDFs are downloaded by the app when first opened, so they are left out of the APK
          rm -rf app/src/main/assets/www/pdf
          gradle :app:assembleRelease --no-daemon

      - name: Sign APK
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          NEW_SIGNING_PASSWORD: ${{ secrets.NEW_SIGNING_PASSWORD }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          if [ -z "$SIGNING_PASSWORD" ]; then
            if [ "${{ github.event_name }}" = "pull_request" ]; then cp aligned.apk ENT-Atlas.apk; echo "test build: unsigned"; exit 0; fi
            echo "::error::Add the repository secret SIGNING_PASSWORD to sign the app."; exit 1
          fi
          LINEAGE=signing/lineage.bin NEWKS=signing/ent-companion-2.p12
          # The app moved to the new key (1.0.339). From now on every published APK must carry the hand-over,
          # otherwise phones refuse the update; so a missing key file or password stops the build instead.
          if [ "${{ github.event_name }}" != "pull_request" ] && { [ ! -f "$LINEAGE" ] || [ ! -f "$NEWKS" ] || [ -z "$NEW_SIGNING_PASSWORD" ]; }; then
            echo "::error::signing/lineage.bin, signing/ent-companion-2.p12 and the NEW_SIGNING_PASSWORD secret are all required. Never create a new key here."; exit 1
          fi
          if [ ! -f "$LINEAGE" ] && [ -n "$NEW_SIGNING_PASSWORD" ] && [ "${{ github.event_name }}" = "pull_request" ]; then
            # test builds try the whole rotation with a throw-away key, so a mistake shows up before it reaches main
            LINEAGE=$RUNNER_TEMP/lineage.bin NEWKS=$RUNNER_TEMP/test.p12
            keytool -genkeypair -keystore "$NEWKS" -storetype PKCS12 -alias entcompanion -keyalg RSA -keysize 2048 \
              -validity 100 -dname "CN=test" -storepass:env NEW_SIGNING_PASSWORD -keypass:env NEW_SIGNING_PASSWORD
            "$BT/apksigner" rotate --out "$LINEAGE" \
              --old-signer --ks signing/ent-atlas.jks --ks-key-alias entatlas --ks-pass env:SIGNING_PASSWORD --set-rollback false \
              --new-signer --ks "$NEWKS" --ks-key-alias entcompanion --ks-pass env:NEW_SIGNING_PASSWORD
          fi
          if [ -f "$LINEAGE" ]; then
            "$BT/apksigner" sign --ks signing/ent-atlas.jks --ks-key-alias entatlas --ks-pass env:SIGNING_PASSWORD \
              --next-signer --ks "$NEWKS" --ks-key-alias entcompanion --ks-pass env:NEW_SIGNING_PASSWORD \
              --lineage "$LINEAGE" --rotation-min-sdk-version 28 --out ENT-Atlas.apk aligned.apk
          else
            "$BT/apksigner" sign --ks signing/ent-atlas.jks --ks-key-alias entatlas --ks-pass env:SIGNING_PASSWORD \
              --out ENT-Atlas.apk aligned.apk
          fi
          "$BT/apksigner" verify --print-certs ENT-Atlas.apk | grep -E "Signer|certificate SHA-256" || true
          if [ -f "$LINEAGE" ]; then "$BT/apksigner" lineage --in ENT-Atlas.apk --print-certs | grep -q "Signer #2" || { echo "::error::the APK has no key hand-over"; exit 1; }; fi
          "$BT/apksigner" verify --verbose ENT-Atlas.apk | grep -E "Verifies|scheme" 
          ls -l ENT-Atlas.apk

      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: The ENT Companion 1.0.${{ github.run_number }}
          body: Download ENT-Atlas.apk below and open it on your Android phone to install or update.
          files: ENT-Atlas.apk

      # Keep only the three newest releases; every release holds a full copy of the APK.
      - name: Remove old releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[3:] | .[].tagName' |
          while read -r tag; do
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          done

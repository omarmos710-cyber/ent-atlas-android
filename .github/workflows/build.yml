name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build signed APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk ENT-Atlas.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ENT-Atlas-apk
          path: ENT-Atlas.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: ENT Atlas 1.0.${{ github.run_number }}
          body: Download ENT-Atlas.apk below and open it on your Android phone to install or update.
          files: ENT-Atlas.apk

name: Checks

# Runs the app's own tests and checks on every pull request (and on main), so a change that breaks search,
# a board, a mind map or the offline file list is caught before it is published.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Smart search tests
        run: |
          node tools/test_smart.js
          node tools/test_deep.js
          node tools/test_answer.js

      - name: Offline file list is up to date
        run: python3 tools/build_sw.py --check

      - name: Install a browser for the layout checks
        run: |
          pip install playwright
          python3 -m playwright install --with-deps chromium

      - name: Boards and mind maps
        run: |
          python3 tools/check_boards.py
          python3 tools/check_board_layout.py
          python3 tools/check_maps.py

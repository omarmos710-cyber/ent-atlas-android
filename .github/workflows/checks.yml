name: Checks

# Runs the app's own tests and checks on every pull request (and on main), so a change that breaks search,
# a board, a mind map or the offline file list is caught before it is published.
# Called by build.yml (on pull requests and on main), which only builds and publishes the APK if these pass.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Smart search tests
        run: |
          node tools/test_smart.js
          node tools/test_deep.js
          node tools/test_answer.js

      - name: Sync between devices
        run: node tools/test_sync.js

      - name: Offline file list is up to date
        run: python3 tools/build_sw.py --check

      # Pixel-level layout checks (check_board_layout.py, check_maps.py without --no-layout) depend on the exact
      # browser build, so they run locally before committing, not here.
      - name: Boards and mind maps (content)
        run: |
          python3 tools/check_boards.py
          python3 tools/check_maps.py --no-layout

name: Drill OCR (temporary)
on:
  push:
    branches: [drill-ocr]
permissions:
  contents: write
jobs:
  ocr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install rapidocr_onnxruntime pillow
      - run: python tools/ocr_figs.py
      - run: |
          git config user.name ocr-bot
          git config user.email ocr-bot@users.noreply.github.com
          git add -f ocr_rapid.json
          git commit -m "OCR results"
          git push

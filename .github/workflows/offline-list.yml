name: Refresh offline file list

# The web app's offline worker (web/sw.js) lists every file with a fingerprint of its content, so a release
# downloads only what changed. If a push changed app files without regenerating it, regenerate it here.
on:
  push:
    branches: [main]
    paths-ignore: ['web/sw.js']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate branded web icons
        run: |
          python3 -m pip install cairosvg
          python3 tools/generate_brand_icons.py
      - name: Regenerate web/sw.js
        run: python3 tools/build_sw.py
      - name: Commit if it changed
        run: |
          if git diff --quiet web/sw.js web/icons; then echo "web assets are up to date"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898900+github-actions[bot]@users.noreply.github.com"
          git add web/sw.js web/icons
          git commit -m "Refresh offline list and branded web icons"
          git push

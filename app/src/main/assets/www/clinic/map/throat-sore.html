cer."}],"cells":{"bottom-3":"stack"},"ride":{"row":"bottom","zone":3,"text":["Zones run outwards from the pharyngeal wall to the deep neck spaces.","Orange spreads, blue settles, purple is chronic, red is the airway. Rings are decisions."]},"checks":{"row":"bottom","zone":2,"q":[{"art":"ap_sore","q":"FeverPAIN 5, drinking, no allergy.","o":["no antibiotic","penicillin V","amoxicillin"],"a":1},{"art":"pharyngitis","q":"Exudate, posterior nodes, spleen.","o":["amoxicillin","Monospot, no amoxicillin"],"a":1},{"art":"tonsil","q":"Trismus, uvula pushed across.","o":["tonsillitis","quinsy"],"a":1},{"art":"deepneck","q":"Parapharyngeal abscess: drain via?","o":["the mouth","the neck, below the angle"],"a":1}]},"abbr":{"CT":"computed tomography","EBV":"Epstein–Barr virus","FBC":"full blood count","FeverPAIN":"fever, purulence, attend rapidly, inflamed tonsils, no cough or coryza","HPV":"human papillomavirus","IJV":"internal jugular vein","IV":"intravenous","NICE":"National Institute for Health and Care Excellence","SIGN":"Scottish Intercollegiate Guidelines Network","TB":"tuberculosis","IX–XII":"glossopharyngeal to hypoglossal nerves"},"pdf":{"map":{"id":"mm_throat-sore","b":375237,"p":1},"all":{"id":"mmall_throat-sore","b":3056976,"p":97}}};</script><script src="route.js"></script>

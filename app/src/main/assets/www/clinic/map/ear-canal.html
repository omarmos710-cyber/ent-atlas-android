,"c":"purple","stops":["bull","grm"]},{"name":"Tumour line","c":"red","stops":["pca","scc","t4"]},{"c":"red","w":1.6,"stops":["gran","@254,42","scc"]}],"segs":[["wax","aoe","lost wax lets it in",7,-3.5],["aoe","furu","one hair follicle",-8,-1.5],["aoe","myco","drops fail: fungus",8,-1.5],["aoe","gran","fails after a week",-2,-2.2],["gran","noe","into the skull base",25,-2.2],["noe","cn","VII, then IX–XII",10,9],["wax","exo","impacts behind bone",8,5.5],["wax","kp","not wax: keratin",10,-2.2],["kp","ko","fills it all round",-15,0.5],["kp","cc","focal erosion",-6,-3],["pca","scc","10% arise in the canal",-80,-2.2],["scc","t4","facial palsy = T4",0,-2.2],["gran","scc","biopsy: carcinoma",10,0.5]],"cards":[{"st":"furu","art":"oe","c":"orange","row":"top","zone":1,"t":"Furuncle","why":"A staphylococcal infection of a hair follicle, so only in the outer cartilaginous canal.","see":["pain worse on chewing · may mimic mastoiditis"],"do":["flucloxacillin 500 mg four times a day, 7 days","incise when it points"]},{"st":"fb","art":"canal","c":"blue","row":"top","zone":1,"t":"Foreign bodies","why":"Forceps push a smooth round object past the isthmus, about 6 mm from the drum.","do":["button battery: same day, no drops, no water","live insect: kill it first with oil","bead, pea: hook from behind, never forceps","GA after a failed attempt"]},{"st":"wax","art":"canal","c":"blue","row":"bottom","zone":1,"t":"Wax","tag":"interchange","why":"Acidic, water-repellent and antibacterial; the canal clears it by epithelial migration.","see":["blocked ear · cough via Arnold's nerve"],"do":["remove only if symptoms or drum must be seen","any drops beat none","irrigate along the posterosuperior wall"],"warn":"Never irrigate: perforation, grommet, only hearing ear, vegetable matter, button battery."},{"st":"aoe","art":"oe","c":"orange","row":"top","zone":2,"w":1.6,"t":"Acute otitis externa","tag":"interchange","why":"Moisture, scratching or loss of wax break the canal's defences and let infection in.","see":["Pseudomonas aeruginosa, S. aureus","pain on moving the tragus or pinna","red, swollen canal with debris","drum mobile, unlike otitis media"],"do":["clean under vision: look in the anteroinferior recess","wick if the canal is swollen shut","antibiotic-steroid drops, a week to ten days","quinolones safe with a perforation or grommet","no oral antibiotics unless spreading, diabetic","check glucose: diabetic or recurrent"],"warn":"Drops fail: think neomycin allergy, fungal superinfection, or necrotising infection."},{"st":"myco","art":"oe","c":"orange","row":"top","zone":2,"t":"Otomycosis","why":"Repeated antibiotic drops, humidity and swimming predispose.","see":["intense itch · wet newspaper mass","A. niger black · Candida creamy white"],"do":["meticulous cleaning","clotrimazole 1%: ≥ 14 days after clearing","stop antibiotic drops, keep dry"]},{"st":"bull","art":"myring","c":"purple","row":"top","zone":3,"t":"Bullous myringitis","why":"A variant of AOM: the same organisms, S. pneumoniae first, are in the middle ear fluid.","see":["after a cold · sudden intense pain","settles in three or four days","blood blisters: drum + deep canal"],"do":["analgesia · lance the blebs","treat AOM if present","always check hearing: SNHL"],"warn":"Mycoplasma: the classic link, rarely responsible."},{"st":"noe","art":"oe","c":"orange","row":"top","zone":4,"t":"Necrotising otitis externa","why":"Spreads from the canal floor through the fissures of Santorini into the skull base: osteomyelitis.","see":["older diabetic · ~1 in 10 not immunosuppressed","severe night pain, out of proportion","granulation at the bony-cartilaginous junction","VII first, then IX, X, XI and XII"],"do":["biopsy granulation: exclude SCC","CT normal until ~30% demineralised","IV antipseudomonal now · ≥ six weeks in total"],"warn":"Mortality around 5–20%."},{"st":"pca","art":"extca","c":"red","row":"bottom","zone":0,"t":"Pinna cancer","why":"Sun-exposed skin: about 85% of ear cancers arise here.","see

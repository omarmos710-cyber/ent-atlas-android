nge","w":1.6,"dash":true,"stops":["batt","@92,5","rhin"]}],"segs":[["bleed","src","pinch, then look",0,-2.2],["src","caut","point seen",0,-2.2],["caut","pack","not seen, or fails",0,-2.2],["pack","still","persists despite packing",0,-2.2],["still","spa","below middle turbinate",0,-2.2],["spa","ethm","fails: ethmoidal?",2,12],["still","embol","unfit for anaesthesia",-24,-2],["hht","laser","lesion by lesion",0,5],["laser","young","transfusion-dependent",0,5],["inj","eye","airway, spine first",0,-2.2],["eye","sept","then septum",0,-2.2],["sept","nasal","then the shape",0,-2.2],["nasal","midface","beyond the nose: CT",0,-2.2],["midface","csf","Le Fort II, III",0,-2.2],["child","batt","one-sided, foul",0,-2.2],["batt","remove","battery: remove now",22,-2.2],["batt","rhin","adult, years later",15,1.6]],"cards":[{"st":"child","art":"nfb","c":"orange","row":"top","zone":0,"t":"Child, one nostril","why":"One-sided, foul, sometimes bloodstained discharge in a child is a foreign body until proven otherwise.","see":["beads, toys: silent for a long time","seeds, peas: swell and inflame early","excoriated nostril"]},{"st":"bleed","art":"epistaxis","c":"red","row":"top","zone":0,"t":"Nosebleed: first aid","why":"Leaning forward stops blood being swallowed and shows how much is lost.","do":["sit up, lean forward (Trotter)","pinch the soft nose ≥ five minutes","pulse, pressure, IV access, bloods"],"warn":"A posterior bleed runs down the throat: loss is easy to underestimate."},{"st":"inj","art":"facefx","c":"blue","row":"bottom","zone":0,"t":"Facial injury","tag":"interchange","why":"The order never changes: airway, breathing, circulation and cervical spine; then eye and CSF; then septum; then shape.","do":["a midface fracture can block the airway","thin-slice CT + 3D: all but nasal"]},{"st":"batt","art":"nfb","c":"orange","row":"top","zone":1,"t":"Button battery","tag":"emergency","why":"Leaks alkali and makes electrical currents that destroy mucosa within hours.","see":["double ring on the radiograph","paired magnets: also urgent"],"do":["remove immediately","no drops, no water"],"warn":"Check afterwards for septal necrosis and perforation."},{"st":"rhin","art":"nfb","c":"orange","row":"top","zone":1,"t":"Rhinolith · myiasis","why":"Salts build up over years around a nucleus: a forgotten foreign body, clot or dried secretions.","see":["adult: one-sided, foul, stony mass","myiasis: flies drawn to atrophic rhinitis"],"do":["rhinolith: remove under GA, in pieces","maggots: pick out, chloroform water, ivermectin"]},{"st":"src","art":"epistaxis","c":"red","row":"bottom","zone":1,"t":"Find the source","tag":"interchange","why":"Four arteries meet in Little's area, where inspired air dries the mucosa and a fingernail reaches.","see":["anterior ~90%: Little's area","posterior: usually over 40","sphenopalatine dominant in ~85%","recurrent bilateral: think HHT"],"do":["suction, vasoconstrict, look","endoscopy: recurrent or not localised"],"warn":"Teenage boy, one-sided bleed and block: angiofibroma. No biopsy."},{"st":"eye","art":"facefx","c":"blue","row":"bottom","zone":0,"t":"Eye and CSF leak","why":"A blow from something larger than the orbit raises orbital pressure; the thin floor gives way.","see":["blow-out: diplopia on upgaze, enophthalmos","forced duction test = entrapment","clear fluid: beta-2 transferrin"],"do":["retrobulbar bleed: canthotomy in minutes","white-eyed child: release in 24–48 h"]},{"st":"remove","art":"nfb","c":"orange","row":"top","zone":2,"t":"Removal","why":"Forceps push a round object deeper; pass a hook beyond it and draw it forwards.","do":["mother's kiss first: ~60%","soft objects: forceps","round: blunt hook, never forceps","GA: cuffed tube + postnasal pack","then check both nostrils and ears","synechiae: divide, silastic splint"]},{"st":"hht","art":"hht","c":"purple","row":"top","zone":2,"t":"HHT","tag":"recurrent","why":"Autosomal dominant. Vessel walls lack elastic tissue and muscle, so they cannot contract after minor trauma.","see":["Curaçao: three = definite, two = possible","bubble echo for lung AVMs (~30%)","MRI brain for cerebral AVMs"],"do":["moisturise · oral tranexamic acid · iron","if packing: resorbable only"],"warn":"Repeated packing and wide cautery make it worse."},{"st":"caut","art":"epistaxis","c":"red","row":"bottom","zone":2,"t":"Cautery","why":"Works when you can see what you are treating. Anaesthetise first; treat only the bleeding point.","do":["silver nitrate: ring first, then vessel","bipolar fails less than silver nitrate"],"warn":"Never both sides of the septum at once: perforation."},{"st":"pack","art":"epistaxis","c":"red","row":"bottom","zone":2,"t":"Packing","tag":"interchange","why":"Anterior first; block the choana when blood still runs back into the pharynx.","do":["anticoagulated: resorbable pack","Foley 12–14 F, saline not air","posterior pack: admit, fails in a third","bilateral packs: oxygen"],"warn":"Control locally before stopping anticoagulants."},{"st":"nasal","art":"facefx","c":"blue","row":"bottom","zone":2,"t":"Nasal fracture","why":"The projecting nose is the most often fractured bone of the face.","see":["clinical: X-rays add nothing"],"do":["reduce at 5–7 days, before two weeks","Walsham's and Asch's forceps"],"warn":"Missed septal haematoma → abscess → saddle nose."},{"st":"still","art":"epistaxis","c":"red","row":"top","zone":3,"t":"Still bleeding","tag":"interchange","why":"Two carotid systems supply the nose. Below the middle turbinate the source is sphenopalatine; above it, ethmoidal.","see":["TESPAL: control 95–98%","crista ethmoidalis = landmark","embolisation ~88%: unfit, tumours"],"do":["source seen: endoscopic cautery","above middle turbinate: ethmoidal ligation","24-12-6 rule to the optic canal"],"warn":"Embolisation cannot reach the ethmoidal arteries."},{"st":"laser","art":"hht","c":"purple","row":"top","zone":3,"t":"Laser → Young's","why":"Benefit lasts months after laser, years after septodermoplasty, and permanently after nasal closure.","do":["KTP or argon laser to each lesion","septodermoplasty halves laser sessions","severe: IV bevacizumab","Young's: close the nostrils"],"warn":"Topical bevacizumab spray does not work."},{"st":"midface","art":"facefx","c":"blue","row":"bottom","zone":3,"t":"Midface fractures","why":"Le Fort I moves the teeth, II the nose and maxilla, III the whole midface.","see":["tripod: flat cheek, step, numb cheek","NOE: telecanthus","Le Fort II, III: CSF rhinorrhoea"],"do":["airway · occlusion · plates","CSF: no prophylactic antibiotics"]}],"cells":{"top-0":"stack","top-1":"stack","bottom-0":"stack"},"ride":{"row":"bottom","zone":3,"text":["Zones follow the order of work: first minutes → look inside → department → theatre.","Each line is one emergency; segment labels say why you go up a rung.","Ringed stations are interchanges: decisions happen there."]},"checks":{"row":"bottom","zone":3,"q":[{"art":"epistaxis","q":"Bleeding above the middle turbinate despite packing.","o":["embolisation","ethmoidal ligation","more packing"],"a":1},{"art":"nfb","q":"Child, button battery in the nose.","o":["saline drops first","remove immediately","clinic next week"],"a":1},{"art":"hht","q":"Recurrent bleeds, lip telangiectasias, father the same.","o":["repeated cautery","HHT: bubble echo, MRI brain"],"a":1},{"art":"facefx","q":"Nasal fracture, swollen, day 2.","o":["X-ray","reduce at 5–7 days","reduce at four weeks"],"a":1}]},"abbr":{"CSF":"cerebrospinal fluid","CT":"computed tomography","GA":"general anaesthesia","HHT":"hereditary haemorrhagic telangiectasia","IV":"intravenous","KTP":"potassium titanyl phosphate (laser)","MRI":"magnetic resonance imaging","NOE":"naso-orbito-ethmoid","TESPAL":"transnasal endoscopic sphenopalatine artery ligation","AVMs":"arteriovenous malformation(s)"},"pdf":{"map":{"id":"mm_nose-emergency","b":362444,"p":1},"all":{"id":"mmall_nose-emergency","b":2165538,"p":72}}};</script><script src="route.js"></script>

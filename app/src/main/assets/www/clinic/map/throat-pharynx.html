vel",0,5],["l2","l3","night to night",0,5],["l3","psg","partner's history",0,5],["psg","cpap","moderate–severe",0,5],["cpap","mad","declines CPAP",0,5],["cpap","dise","fails CPAP",-9,0],["surg","trach","last resort",-14,0],["adn","kid","snoring, pauses, gasping",0,-2.2],["kid","atx","first line",0,-2.2],["ome","adx","with grommets (NICE)",0,-2.2],["ros","pal","closes in swallowing",0,-2.2],["pal","piri","food channel",0,-2.2]],"cards":[{"st":"skull","art":"pharanat","c":"teal","row":"top","zone":0,"t":"The corridor","why":"A shared corridor: air passes through it to the larynx, food to the oesophagus.","see":["12–14 cm, skull base → cricoid at C6","3.5 cm wide above, 1.5 cm at the bottom","naso C1 · oro C2–C3 · hypo C3–C6","Waldeyer: adenoid, palatine, lingual, tubal"],"warn":"The narrowest point, at the oesophagus, is where swallowed foreign bodies lodge."},{"st":"ros","art":"pharanat","c":"teal","row":"top","zone":0,"t":"Nasopharynx","why":"Behind the torus tubarius lies the fossa of Rosenmüller.","see":["Rosenmüller: commonest NPC site","tube opening ~1.25 cm behind inferior turbinate","Thornwaldt: abscess or cyst of the bursa","drains to Rouvière's node, often both sides"]},{"st":"pal","art":"pharanat","c":"teal","row":"top","zone":1,"t":"Soft palate","why":"Rising, it seals the nasopharynx; falling against the tongue, it seals the mouth, so we chew and breathe together.","see":["all vagus, except tensor veli palatini (V3)","tensor opens the Eustachian tube","vagal palsy: uvula pulled to the healthy side","hyponasal if blocked · hypernasal in VPI"]},{"st":"piri","art":"pharanat","c":"teal","row":"top","zone":2,"t":"Piriform fossa","why":"The internal laryngeal nerve runs under its mucosa, so a piriform cancer refers pain to the ear.","see":["lateral food channel: fish bones lodge","rich lymph: neck nodes early","postcricoid: Plummer–Vinson cancer","valleculae belong to the oropharynx"],"do":["otalgia: IX via Jacobson's, X via Arnold's"]},{"st":"kill","art":"pharanat","c":"teal","row":"top","zone":2,"t":"Killian's dehiscence","why":"A weak triangle between thyropharyngeus above and cricopharyngeus below.","see":["mucosa herniates → pharyngeal pouch","a scope can perforate: 'gateway of tears'","muscles: X, except stylopharyngeus (IX), tensor (V3)"]},{"st":"tone","art":"osa","c":"purple","row":"bottom","zone":0,"t":"Why it closes","why":"No bony support between palate and larynx: patency depends on muscle tone, which falls most in REM sleep.","see":["each apnoea ends with an arousal","obesity, collar over 42 cm (men)","alcohol, sedatives relax it further"]},{"st":"adn","art":"adenoid","c":"orange","row":"bottom","zone":0,"t":"Adenoids","tag":"interchange","why":"Size is relative: a modest adenoid in a small nasopharynx can block it completely.","see":["no crypts, no capsule","largest at six to seven, gone by twenty","mouth breathing · hyponasal voice","OME: fluctuating hearing loss"],"do":["flexible nasendoscopy: best view","lateral X-ray: crying exaggerates size","steroid spray trial 6 to 12 weeks"],"warn":"Adult nasopharyngeal mass: biopsy for NPC."},{"st":"l2","art":"osa","c":"purple","row":"bottom","zone":1,"t":"Three levels","why":"Obstruction may be at more than one level, and may differ from night to night.","see":["I: nose and nasopharynx, adenoids","II: long palate, large tonsils, lateral walls","III: tongue base, retrognathia, epiglottis"],"do":["Friedman: palate graded, tongue in the mouth","not Mallampati (tongue protruded)"]},{"st":"psg","art":"osa","c":"purple","row":"top","zone":3,"t":"Sleep study","tag":"interchange","why":"The bed partner gives the history; the sleep study gives the diagnosis and its severity.","see":["apnoea: no airflow ≥ 10 s","AHI 5–14 mild · 15–29 moderate · ≥ 30 severe","Epworth over 10 = sleepy"],"do":["polysomnography = gold standard","home polygraphy first line (NICE)","oximetry alone is insufficient"]},{"st":"kid","art":"osa","c":"orange","row":"bottom","zone":3,"t":"Child OSA","why":"Adenotonsillar hypertrophy is the commonest cause; children are hyperactive and inattentive rather than sleepy.","see":["10 to 15% snore · 1 to 4% have OSA","AHI above 1 is abnormal"],"do":["adenotonsillectomy first line","monitor overnight: under 3, severe"],"warn":"Trial, age five to nine, non-severe OSA: 46% of the watchful-waiting group normalised."},{"st":"cpap","art":"osa","c":"purple","row":"top","zone":4,"t":"CPAP","tag":"interchange","why":"A pneumatic splint that holds the airway open.","see":["first line: moderate and severe","only about half use it ≥ 4 h a night","splint: mild–moderate, or CPAP declined"],"do":["weight loss · no evening alcohol","side-sleeping if supine-dependent"]},{"st":"surg","art":"osa","c":"purple","row":"top","zone":4,"t":"Surgery by level","why":"Surgery is matched to the site of collapse on drug-induced sleep endoscopy.","see":["DISE: VOTE pattern of collapse","UPPP ~50%, over 80% if well selected","nose surgery seldom cures, eases CPAP"],"do":["maxillomandibular: best bar tracheostomy","tracheostomy: the only reliable cure"]},{"st":"adx","art":"adenoid","c":"orange","row":"bottom","zone":4,"t":"Adenoidectomy","why":"In a cleft, the adenoid helps close the velopharynx: removing it causes VPI.","see":["OME: consider with grommets (NICE)","OSA with small tonsils: alone"],"do":["feel the palate: bifid uvula, notch, zona pellucida","never hyperextend: Down 10–20% unstable","bleed: rising pulse, dark vomit"],"warn":"Grisel syndrome: torticollis from atlantoaxial subluxation."}],"cells":{"top-2":"stack"},"ride":{"row":"bottom","zone":1,"text":["Zones run down the corridor, naso → oro → hypopharynx, then into the night: sleep lab and treatment.","Teal is anatomy, purple the adult airway, orange the child. Rings are decisions."]},"checks":{"row":"bottom","zone":2,"q":[{"art":"pharanat","q":"Which pharyngeal muscle does IX supply?","o":["palatoglossus","stylopharyngeus","tensor veli palatini"],"a":1},{"art":"adenoid","q":"Adenoidectomy

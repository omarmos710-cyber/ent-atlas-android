ted",0,5],["absc","saddle","cartilage dies",0,5],["saddle","rhpl","augment",0,5],["blow","dev","cartilage dislocates",0,-2.2],["dev","crook","external deformity",0,-2.2],["crook","rhpl","septorhinoplasty",22,-4.5],["rhpl","revis","wait a year",0,5],["rhph","skca","occult carcinoma",0,-2.2],["mass","dura","may reach the dura",0,-2.2],["pyri","atres","a mimic: CT tells apart",0,-2.2]],"cards":[{"st":"furu","art":"extnose","c":"red","row":"top","zone":0,"t":"Furuncle","tag":"danger area","why":"Veins of the lip and nose drain to the cavernous sinus without valves.","see":["S. aureus in a hair follicle","tender red swelling in the vestibule"],"do":["warm compresses, analgesia","flucloxacillin 500 mg to 1 g four times a day","incise only when fluctuant","recurrent: glucose, S. aureus carriage"],"warn":"Never squeeze: it can spread to the cavernous sinus."},{"st":"rhph","art":"extnose","c":"grey","row":"bottom","zone":0,"t":"Rhinophyma","why":"Sebaceous glands and connective tissue overgrow on the tip and alae in long-standing acne rosacea.","see":["men past middle age · the potato nose"],"do":["shave: scalpel, dermabrasion or laser","doxycycline for the rosacea","send tissue for histology"]},{"st":"skca","art":"extnose","c":"grey","row":"bottom","zone":0,"t":"Skin cancer","why":"Skin cancers favour the sun-exposed tip and ala.","see":["BCC ~87%: 40 to 60 years, tip and ala","pearly nodule or rodent ulcer","SCC ~11%: everted edges · nodes in ~20%"],"do":["BCC: excise, 3 to 5 mm margins","Mohs: high-risk sites, recurrences","SCC: neck dissection for nodes"],"warn":"Biopsy any lesion that does not heal."},{"st":"dev","art":"septum","c":"purple","row":"top","zone":1,"w":1.5,"t":"Deviated septum","why":"High deviations block more than low ones, because the main airflow passes through the upper nose.","see":["lateral blow, or unequal growth","C-shaped, S-shaped, spur, caudal dislocation","wider side: compensatory turbinate","Cottle's test: is the valve involved?"],"do":["treat coexisting rhinitis first","CT not routine","septoplasty: remove only the worst parts","beats medical treatment in two trials","children if severe obstruction: growth kept"],"warn":"Do not operate when rhinitis is the real cause of the obstruction."},{"st":"haem","art":"septum","c":"blue","row":"bottom","zone":1,"t":"Septal haematoma","tag":"emergency","why":"A blow that leaves the mucosa intact traps blood under the perichondrium.","see":["bilateral obstruction after a blow","smooth, soft swelling in both nostrils"],"do":["drain the same day","incise, excise a strip of mucosa","pack both sides · antibiotics","review in 24 to 48 hours"],"warn":"Never send home a swollen septum: a missed one in a child may show years later as a saddle nose."},{"st":"absc","art":"septum","c":"blue","row":"bottom","zone":1,"t":"Septal abscess","tag":"interchange","why":"Usually an infected haematoma; occasionally after a furuncle of the nose or lip.","see":["fever, pain over the bridge","fluctuant septal swelling","tender submandibular nodes"],"do":["drain urgently, most dependent point","remove pus and dead cartilage","antibiotics by culture ≥ ten days"],"warn":"Rare but serious: meningitis and cavernous sinus thrombosis."},{"st":"perf","art":"septum","c":"blue","row":"bottom","zone":2,"t":"Perforation","why":"Lupus, TB, leprosy perforate the cartilaginous septum; syphilis the bony.","see":["small anterior: whistles","larger: crusts and bleeding","ask about cocaine at any age"],"do":["ANCA, ACE, syphilis serology","biopsy the posterosuperior edge","treat the cause, then close","flaps best under about 2 cm"],"warn":"A button can enlarge the perforation."},{"st":"crook","art":"extnose","c":"purple","row":"top","zone":2,"t":"Crooked or deviated nose","why":"Both usually follow injury, often in childhood.","see":["crooked: dorsum C- or S-shaped","deviated: dorsum straight, to one side"],"do":["septorhinoplasty: appearance and airway"]},{"st":"saddle","art":"extnose","c":"blue","row":"top","zone":2,"t":"Saddle nose","why":"A depressed dorsum: bony, cartilaginous or both.","see":["depressed fracture (commonest)","excess septal cartilage removed","septal haematoma or abscess","GPA, cocaine, TB, syphilis, leprosy"],"do":["augmentation rhinoplasty","septal, auricular or rib cartilage","bone if bony and cartilaginous loss"],"warn":"Autografts are preferred: synthetic implants tend to extrude."},{"st":"rhpl","art":"facplast","c":"pink","row":"top","zone":3,"w":1.6,"t":"Rhinoplasty","tag":"interchange","why":"Tip support rests on the lower laterals, the footplates on the caudal septum and the scroll; whatever surgery disrupts must be compensated.","see":["thirds in height, fifths in width","nasofrontal 115 to 130°","nasolabial 90 to 95° men, 95 to 110° women","Goode ratio 0.55 to 0.6","screen for body dysmorphic disorder"],"do":["open: best exposure, columellar scar","hump off → osteotomies + spreader grafts","septal cartilage: first-choice graft","keep a 10 to 15 mm L-strut","preserve and conserve, not resect and regret"]},{"st":"revis","art":"facplast","c":"pink","row":"bottom","zone":2,"t":"Revision","why":"Each named deformity has a mechanism and a remedy.","see":["pollybeak: supratip fullness","inverted V: upper laterals collapse","open roof: osteotomies omitted","rocker: osteotomy carried too high"],"do":["5 to 15% are revised","wait about a year"]},{"st":"mass","art":"congnose","c":"green","row":"top","zone":0,"t":"Midline mass","why":"If a dural projection through the foramen caecum does not regress: dermoid, glioma or encephalocele.","see":["dermoid: commonest · midline pit ± hair","glioma: 15 to 20% stalk to the dura","encephalocele: pulsatile, Furstenberg +"],"do":["MRI (with CT for bone) first","excise the tract · neurosurgery if dural"],"warn":"Never biopsy first: CSF leak and meningitis."},{"st":"atres","art":"congnose","c":"green","row":"bottom","zone":3,"t":"Choanal atresia","why":"The bucconasal membrane persists. Newborns breathe preferentially through the nose, so bilateral atresia is an emergency.","see":["blue at rest, pink when crying","catheter stops at about 3 cm","axial CT = definitive","CHARGE: about half bilateral","pyriform stenosis: same, at the front"],"do":["oral airway or McGovern nipple","endoscopic transnasal drill repair","stents: 65% vs 64% success"],"warn":"Unilateral: one-sided discharge, often found in later childhood."}],"abbr":{"ACE":"angiotensin-converting enzyme","ANCA":"anti-neutrophil cytoplasmic antibody","BCC":"basal cell carcinoma","CHARGE":"coloboma, heart defects, choanal atresia, retarded growth and development, genital and ear anomalies","CSF":"cerebrospinal fluid","CT":"computed tomography","GPA":"granulomatosis with polyangiitis","MRI":"magnetic resonance imaging","SCC":"squamous cell carcinoma","TB":"tuberculosis"},"cells":{"top-2":"stack"},"ride":{"row":"top","zone":1,"text":["Left to right: skin → septum, which holds up the dorsum and tip → the shape → the back of the nose and skull.","Infection and midline masses reach inwards; septal damage shows outside as the shape.","Ringed stations are interchanges: decisions happen there."]},"checks":{"row":"bottom","zone":2,"q":[{"art":"septum","q":"Boggy septum in both nostrils after a blow.","o":["review in a week","drain today, pack both sides","steroid spray"],"a":1},{"art":"congnose","q":"Newborn: blue at rest, pink when crying. First step?","o":["oral airway","CT first","biopsy"],"a":0},{"art":"congnose","q":"Child, midline nasal pit with a hair. Next?","o":["biopsy","MRI","excise at once"],"a":1}]}};</script><script src="route.js"></script>

<script>window.MAP={"id":"mouth","title":"The mouth","sec":"mouth","order":2,"sub":"Ulcers, patches, lumps and clefts, from the lips back to the velum. Most lines end where a biopsy or a repair is due.","branches":[{"id":"oralanat","name":"Oral anatomy"},{"id":"ap_ulcer","name":"Mouth ulcer approach"},{"id":"oraldis","name":"Oral disease"},{"id":"oralbenign","name":"Lumps & patches"},{"id":"cleft","name":"Cleft lip & palate"},{"id":"syndr","name":"Syndromes"}],"zones":[["First look",54],["Lips & cheeks",80],["Tongue & floor",90],["Palate",76],["Velum & syndromes",100]],"st":{"ulcer":{"t":"Mouth ulcer","x":14,"y":33,"lab":"a","ix":true},"aph":{"t":"Aphthous","x":66,"y":17,"lab":"a"},"trauma":{"t":"Sharp tooth","x":96,"y":33,"lab":"a"},"ca":{"t":"Cancer","x":196,"y":33,"lab":"a","ix":true,"dx":-6},"nodes":{"t":"Neck nodes","x":222,"y":5,"lab":"r"},"wp":{"t":"White patch","x":26,"y":48,"lab":"a","ix":true},"thrush":{"t":"Thrush","x":26,"y":58,"lab":"r"},"leuk":{"t":"Leukoplakia","x":110,"y":48,"lab":"a"},"ery":{"t":"Erythroplakia","x":160,"y":48,"lab":"a"},"muc":{"t":"Mucocele","x":82,"y":58,"lab":"a"},"ranula":{"t":"Ranula","x":196,"y":58,"lab":"b"},"palatal":{"t":"Palatal lump","x":262,"y":58,"lab":"b"},"clip":{"t":"Cleft lip","x":110,"y":17,"lab":"a"},"cpal":{"t":"Cleft palate","x":262,"y":17,"lab":"a","ix":true},"sub":{"t":"Submucous cleft","x":316,"y":17,"lab":"a"},"vpi":{"t":"VPI","x":372,"y":17,"lab":"a"},"robin":{"t":"Robin","x":316,"y":33,"lab":"a"},"tc":{"t":"Treacher Collins","x":386,"y":33,"lab":"a","dx":-10},"down":{"t":"Down","x":386,"y":48,"lab":"b"}},"lines":[{"name":"Ulcer line","c":"orange","stops":["ulcer","trauma","ca"]},{"c":"orange","w":1.6,"stops":["ulcer","@40,33","@56,17","aph"]},{"name":"Patch line","c":"red","stops":["wp","leuk","ery","@181,48","ca"]},{"c":"grey","w":1.6,"dash":true,"stops":["wp","thrush"]},{"name":"Lymph spur","c":"blue","w":1.6,"stops":["ca","@196,25","@216,5","nodes"]},{"name":"Lump line","c":"green","stops":["muc","ranula","palatal"]},{"name":"Cleft line","c":"purple","stops":["clip","cpal","sub","vpi"]},{"name":"Syndrome line","c":"pink","stops":["cpal","@262,25","@270,33","robin","tc"]},{"c":"pink","w":1.6,"dash":true,"stops":["robin","@331,48","down"]}],"segs":[["ulcer","trauma","single, one cause",0,5],["trauma","ca","not healed at review",0,5],["ulcer","aph","recurrent, multiple",-16,-5],["wp","leuk","won't wipe off",-16,5],["leuk","ery","red is worse",0,5],["muc","ranula","floor of mouth",10,-2.2],["ranula","palatal","the palate",0,-2.2],["clip","cpal","palate fails to fuse",-36,-2.2],["cpal","sub","mucosa intact",-2,-2.2],["sub","vpi","separated muscles",0,-2.2],["robin","tc","small mandible",0,-2.2],["robin","down","difficult airway too",-8,4]],"cards":[{"st":"ulcer","art":"ap_ulcer","c":"orange","row":"top","zone":0,"t":"Mouth ulcer","tag":"interchange","why":"Most are traumatic or aphthous and heal within two weeks; the pattern points to the cause.","see":["recurrent, multiple, healing → aphthous","+ genital ulcers, uveitis → Behçet's","blisters, desquamative gums → bullous","drugs: nicorandil, NSAIDs, methotrexate"],"do":["recurrent: FBC, ferritin, B12, folate, coeliac","blisters: perilesional immunofluorescence"],"warn":"A single ulcer not healed in three weeks is biopsied."},{"st":"aph","art":"oraldis","c":"orange","row":"top","zone":1,"t":"Aphthous ulcers","why":"The commonest non-traumatic ulcers, on movable mucosa; unlike viral ulcers they recur, without fever or nodes.","see":["minor 2–10 mm, heal in about two weeks","major over 1 cm, six weeks or more, scar","spare hard palate and attached gingiva"],"do":["topical steroid · chlorhexidine","correct B12, folate, iron"]},{"st":"clip","art":"cleft","c":"purple","row":"top","zone":1,"t":"Cleft lip","why":"The maxillary and medial nasal prominences fail to fuse, in weeks four to seven.","see":["lip ± palate: 1 in 700 to 1000, boys","isolated palate: 1 in 1500 to 2000, girls","syndromes: up to ~30% vs ~50%"],"do":["repair at about 3 months (rule of 10s)","Millard: medial side rotates, lateral advances"]},{"st":"ca","art":"ap_ulcer","c":"red","row":"top","zone":2,"t":"Cancer clues","tag":"interchange","why":"Oral squamous cell carcinoma presents as a non-healing ulcer, often painless at first.","see":["induration, raised everted edge, fixed","tongue and floor of mouth: highest risk","smoking, alcohol, betel quid"],"do":["biopsy the edge with normal tissue, not the centre","NG12: urgent referral after three weeks"],"warn":"No repeated steroid for a single persistent ulcer."},{"st":"nodes","art":"oralanat","c":"blue","row":"top","zone":2,"t":"Lymph and nerves","why":"The lymph routes explain the neck nodes, and the shared nerves the earache with a normal ear, of oral cancer.","see":["lateral tongue may skip to level IV","lower lip, anterior floor cross the midline","tongue base drains to both sides","oral tongue: lingual (V3) + chorda (VII)","base of tongue: IX, touch and taste","earache via V3 and IX (Jacobson's)"]},{"st":"cpal","art":"cleft","c":"purple","row":"top","zone":3,"t":"Cleft palate","tag":"interchange","why":"The tensor and levator insert abnormally, so the Eustachian tube cannot open.","see":["OME in over 90%","tensor: the only palatal muscle on V3"],"do":["repair 6–12 months, before 18","rebuild the levator sling","alveolar bone graft at 8 to 11 years"],"warn":"In a trial in isolated cleft palate, repair at 6 months left less VPI at age five than at 12."},{"st":"sub","art":"cleft","c":"purple","row":"top","zone":4,"t":"Submucous cleft","why":"The mucosa is intact but the muscles are separated beneath it.","see":["Calnan: bifid uvula, zona pellucida, notch","occult: seen only on nasendoscopy"],"do":["repair only for VPI, feeding or ears"],"warn":"Check the palate before adenoidectomy: a full one can unmask VPI."},{"st":"vpi","art":"cleft","c":"purple","row":"top","zone":4,"t":"Velopharyngeal insufficiency","why":"A structural deficit: a palate too short or scarred, a cleft, or tissue lost.","see":["hypernasal; /m/, /n/, /ng/ normal","nasal air emission on p, b, t, d, s"],"do":["nasendoscopy + videofluoroscopy","large central gap: pharyngeal flap","circular gap, poor lateral walls: sphincter pharyngoplasty","22q11.2: image the carotids first"],"warn":"Pharyngeal surgery risks OSA."},{"st":"wp","art":"oralbenign","c":"grey","row":"bottom","zone":0,"t":"White patch","tag":"interchange","why":"Does it wipe off? Leukoplakia is a diagnosis of exclusion.","see":["thrush: wipes off, red base","leukoedema: vanishes on stretching","lichen planus: Wickham striae","hairy leukoplakia: tongue edge, HIV"]},{"st":"thrush","art":"oraldis","c":"grey","row":"bottom","zone":0,"t":"Candida","see":["thrush wipes off → raw red base","hyperplastic won't wipe off → biopsy"],"do":["miconazole gel · fluconazole if extensive"]},{"st":"leuk","art":"oralbenign","c":"red","row":"bottom","zone":1,"t":"Leukoplakia","why":"A clinical term, not histology: a white patch that cannot be called any other disease.","see":["speckled, erosive, verrucous: highest risk","transforms ~9.5% · verrucous ~50%"],"do":["stop tobacco, areca, alcohol","biopsy the reddest, most nodular area"],"warn":"Erythroplakia transforms in ~33%: red is worse than white."},{"st":"muc","art":"oralbenign","c":"green","row":"bottom","zone":1,"t":"Mucocele and other lumps","why":"Most lumps are benign; any that grows, ulcerates or is fixed is biopsied.","see":["mucocele: lower lip, after a bite","fibroma: on the bite line","pyogenic granuloma: bleeds on touch"],"do":["mucocele: excise with the gland"]},{"st":"ranula","art":"oralbenign","c":"green","row":"bottom","zone":2,"t":"Ranula","why":"Obstruction of the ducts of the sublingual gland.","see":["bluish, translucent, beside the frenulum","plunging: into the neck","dermoid: white, opaque, midline"],"do":["excise with the sublingual gland"],"warn":"Marsupialisation alone often recurs."},{"st":"palatal","art":"oralbenign","c":"green","row":"bottom","zone":3,"t":"Palatal lump","why":"A large proportion of minor salivary gland tumours are malignant.","see":["torus: midline, bony, harmless","pleomorphic adenoma: commonest benign"],"do":["biopsy every palatal lump","adenoma: wide excision"]},{"st":"robin","art":"syndr","c":"pink","row":"bottom","zone":4,"t":"Robin & the arch syndromes","why":"A small mandible lets the tongue fall back, which stops the palatal shelves fusing and obstructs the airway.","see":["Stickler: myopia, retinal detachment","Treacher Collins: bilateral, lower lid","Goldenhar: one-sided, upper lid, dermoid"],"do":["prone, nasopharyngeal airway","distraction or tracheostomy if severe","eye examination for every child"]},{"st":"down","art":"syndr","c":"pink","row":"bottom","zone":4,"t":"Down syndrome","why":"Tube dysfunction makes OME almost universal; midface, tongue and low tone narrow the airway.","see":["OSA in about 60%","atlantoaxial instability 10 to 20%","tube half a size smaller"],"do":["hearing aids often first","sleep study before adenotonsillectomy"]}],"cells":{"bottom-0":"stack"},"ride":{"row":"bottom","zone":2,"text":["Zones run from the lips back to the velum; each line is one kind of problem.","Orange, red and green end in a biopsy; purple in a repair; pink branches to the syndromes. Rings are decisions."]},"checks":{"row":"bottom","zone":3,"q":[{"art":"ap_ulcer","q":"Indurated tongue ulcer, five weeks.","o":["topical steroid","biopsy the edge"],"a":1},{"art":"oralbenign","q":"Speckled leukoplakia: biopsy where?","o":["the white","the red, nodular"],"a":1},{"art":"cleft","q":"Millard repair: which side rotates?","o":["medial","lateral"],"a":0},{"art":"syndr","q":"Bilateral microtia, lower lid colobomas.","o":["Goldenhar","Treacher Collins"],"a":1}]},"abbr":{"FBC":"full blood count","HIV":"human immunodeficiency virus","NG12":"NICE suggested-cancer guidance","NSAIDs":"non-steroidal anti-inflammatory drugs","OME":"otitis media with effusion","OSA":"obstructive sleep apnoea","VPI":"velopharyngeal insufficiency","V3, VII, IX":"mandibular, facial, glossopharyngeal nerves"},"pdf":{"map":{"id":"mm_mouth","b":326600,"p":1},"all":{"id":"mmall_mouth","b":3358593,"p":98}}};</script><script src="route.js"></script>

 dopamine inhibition, so stalk compression raises it modestly.","see":["micro < 10 mm · macro ≥ 10 mm","prolactinoma: commonest functioning","stalk effect: usually under about 200 ng/ml","MRI with gadolinium is the key test"],"do":["GH, ACTH, TSH adenomas: surgery","endoscopic endonasal, two surgeons"],"warn":"Apoplexy: IV hydrocortisone at once."},{"st":"chiasm","art":"pituitary","c":"purple","row":"top","zone":3,"t":"Chiasm","why":"The chiasm lies just above the sella; a growing tumour presses on the crossing nasal fibres.","see":["bitemporal hemianopia"],"do":["acuity, colour vision, formal perimetry"]},{"st":"cav","art":"skullbase","c":"brown","row":"top","zone":3,"t":"Cavernous sinus","tag":"interchange","why":"III, IV, V1 and V2 run in the lateral wall; VI runs free beside the carotid, so it is often the first to fail.","see":["VI palsy: think of a clivus chordoma","chondrosarcoma: off the midline","unresectable: both cavernous sinuses"]},{"st":"ppm","art":"skullbase","c":"brown","row":"bottom","zone":0,"t":"Parapharyngeal mass","why":"The styloid and its fascia divide the space into prestyloid and poststyloid compartments.","see":["prestyloid: pleomorphic adenoma","poststyloid: schwannoma, paraganglioma","tonsil and soft palate pushed medially","about 80% benign"],"do":["MRI with CT · metanephrines","transcervical approach"],"warn":"Never biopsy through the mouth."},{"st":"prl","art":"pituitary","c":"purple","row":"bottom","zone":2,"t":"Prolactinoma","why":"A dopamine agonist shrinks the tumour and restores fertility in most.","see":["amenorrhoea, galactorrhoea, low libido"],"do":["cabergoline first, even with field loss","surgery: intolerance, resistance, choice"]},{"st":"flap","art":"skullbase","c":"teal","row":"bottom","zone":3,"t":"Multilayer repair","tag":"interchange","why":"A durable barrier between the nose and the intradural space prevents CSF leak, pneumocephalus and meningitis.","see":["inlay 5 to 10 mm under the dura","onlay: preferably a vascularised flap","nasoseptal flap: leaks over 20% → about 5%"],"do":["plan the flap before the sphenoidotomy","no nose blowing or straining"]},{"st":"flap","art":"pituitary","c":"purple","row":"bottom","zone":2,"t":"After pituitary surgery","see":["DI: dilute urine, sodium above 145","SIADH: low sodium about a week later"],"do":["steroid cover if ACTH deficient","check sodium after discharge"]},{"st":"leak","art":"csf","c":"blue","row":"bottom","zone":4,"t":"CSF leak","tag":"interchange","why":"CSF passes into the nose through a defect in the dura and bone: an open door to meningitis.","see":["clear, one-sided, on bending forward","cannot be sniffed back","beta-2 transferrin proves it","HRCT first, then T2 MRI"],"do":["bed rest head up · acetazolamide","no prophylactic antibiotics: vaccinate","endoscopic repair: over 90% first time"],"warn":"Spontaneous leak: treat the raised pressure, or it recurs."},{"st":"trauma","art":"csf","c":"blue","row":"bottom","zone":4,"t":"Causes","why":"Most traumatic leaks close within one to two weeks.","see":["trauma: about 80%","surgery: the lateral lamella","spontaneous: IIH, empty sella"]}],"cells":{"top-1":"stack","top-3":"stack"},"ride":{"row":"top","zone":4,"text":["Left to right, deeper into the skull: nose → pterygopalatine fossa → sphenoid and sella → cavernous sinus → dura.","The CSF line runs back: from the dura out into the nose.","Ringed stations are interchanges: decisions happen there."]},"checks":{"row":"bottom","zone":1,"q":[{"art":"juv","q":"Teenage boy, recurrent epistaxis, mass at the back of the nose.","o":["biopsy in clinic","contrast CT"],"a":1},{"art":"pituitary","q":"Macroprolactinoma with field loss.","o":["surgery now","cabergoline"],"a":1},{"art":"csf","q":"Clear one-sided drip after head injury: confirm with?","o":["glucose strip","beta-2 transferrin","halo sign"],"a":1},{"art":"skullbase","q":"Tonsil pushed medially, normal mucosa.","o":["transoral biopsy","MRI + CT"],"a":1}]},"abbr":{"ACTH":"adrenocorticotropic hormone","CSF":"cerebrospinal fluid","CT":"computed tomography","DI":"diabetes insipidus","GH":"growth hormone","HRCT":"high-resolution CT","IIH":"idiopathic intracranial hypertension","IV":"intravenous","MRI":"magnetic resonance imaging","SIADH":"syndrome of inappropriate antidiuretic hormone secretion","T2":"T2-weighted MRI","TSH":"thyroid-stimulating hormone","V1, V2, V3":"ophthalmic, maxillary, mandibular divisions of the trigeminal nerve"}};</script><script src="route.js"></script>

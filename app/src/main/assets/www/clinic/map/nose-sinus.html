ing"],"do":["≤ 10 days: no antibiotic","beyond ten days: steroid spray","NICE: phenoxymethylpenicillin, 5 days","frontal worse despite 48 hours: trephine"],"warn":"Early antibiotics do not prevent complications."},{"st":"crs","art":"crs","c":"green","row":"top","zone":1,"w":1.5,"t":"Chronic rhinosinusitis","tag":"interchange","why":"Ostial obstruction brings stasis and infection; inflammation then blocks the ostium more.","see":["12 weeks or more · two cardinal symptoms","one is blockage or discharge","+ endoscopy or CT evidence"],"do":["saline + steroid spray, technique","MACRO: clarithromycin no better than placebo","polyps: oral steroid, 1 or 2 courses a year max"],"warn":"One-sided polyp: histology. Polyps in a child: sweat test."},{"st":"pott","art":"abs","c":"orange","row":"top","zone":2,"t":"Pott's puffy tumour","why":"The frontal sinus borders the anterior cranial fossa.","see":["frontal osteomyelitis, adults","doughy forehead swelling","extradural abscess beneath"],"do":["antibiotics, drainage, trephination"]},{"st":"pres","art":"abs","c":"red","row":"top","zone":3,"t":"Chandler's stages","why":"Most come from the ethmoids, through the lamina papyracea or ethmoidal veins.","see":["I preseptal: vision, movement normal","II orbital cellulitis","III subperiosteal abscess","IV orbital abscess","V cavernous sinus: both eyes"],"warn":"Check vision and movement before calling it preseptal."},{"st":"orbabs","art":"orbit","c":"red","row":"top","zone":3,"t":"Child's abscess: drain?","why":"Most children are treated medically first.","see":["drain: nine years or older","frontal sinus · gas · dental source","large or non-medial abscess","any visual loss · RAPD","no better in 24 to 48 hours"],"do":["IV ceftriaxone + metronidazole","eye checks every few hours"]},{"st":"cst","art":"abs","c":"red","row":"top","zone":4,"t":"Cavernous sinus thrombosis","why":"Infection spreads through the valveless ophthalmic veins.","see":["abrupt, rigors · both eyes","III, IV, VI palsies","fixed dilated pupil"],"do":["contrast CT or MRI","IV ceftriaxone 2 g twice daily + metronidazole"]},{"st":"fung","art":"afs","c":"brown","row":"bottom","zone":1,"t":"Fungus: invading or not?","tag":"interchange","why":"The first question is always whether the fungus is invading tissue.","see":["Mucor: broad, rarely septate, right angles","Aspergillus: septate, about 45 degrees","ball: one maxillary sinus, no erosion"],"do":["ball: removal, no antifungal"]},{"st":"afrs","art":"afs","c":"brown","row":"bottom","zone":1,"t":"Allergic fungal","why":"Hypersensitivity to fungi in the mucin, without invasion.","see":["peanut-butter eosinophilic mucin","CT double density · dark on T2"],"do":["endoscopic clearance","oral steroids around surgery","recurrence is common"]},{"st":"inv","art":"afs","c":"brown","row":"bottom","zone":1,"t":"Acute invasive fungal","why":"Hyphae invade arteries: thrombosis, necrosis, rapid spread.","see":["ketoacidosis, neutropenia, steroids","black eschar on the turbinate"],"do":["urgent biopsy + frozen section","liposomal amphotericin B 5 mg/kg/day","debride to bleeding tissue"],"warn":"Do not wait for culture."},{"st":"ess","art":"sinussurg","c":"teal","row":"bottom","zone":1,"w":1.3,"t":"Endoscopic sinus surgery","tag":"interchange","why":"Enlarges the natural ostia so ventilation and clearance recover.","see":["Lund-Mackay ≥ 1 · eight weeks treated","SNOT-22 of 20 or more after it"],"do":["review the CT: CLOSE","uncinectomy → antrostomy → bulla →","posterior ethmoid → frontal → sphenoid"],"warn":"Miss the natural ostium and mucus recirculates."},{"st":"muco","art":"abs","c":"green","row":"bottom","zone":2,"t":"Mucocele","why":"Long-standing ostial obstruction: the sinus expands and thins its walls.","see":["frontal commonest","above the medial canthus (90%)"],"do":["endoscopic marsupialisation"]},{"st":"propt","art":"orbit","c":"purple","row":"bottom","zone":3,"t":"Proptosis","tag":"interchange","why":"Direction, speed and sidedness point to the

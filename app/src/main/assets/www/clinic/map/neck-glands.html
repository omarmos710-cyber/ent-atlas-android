sion if unreachable"],"warn":"Protect the lingual nerve at duct surgery."},{"st":"sjog","art":"salivary","c":"green","row":"top","zone":1,"t":"Sjögren syndrome","why":"Autoimmune lymphocytic destruction of the salivary and lacrimal glands, mostly in women.","see":["dry eyes + dry mouth + parotid swelling","anti-Ro, anti-La · lip biopsy"],"do":["saliva substitutes, sialogogues, dental care"],"warn":"A new firm or enlarging mass: biopsy for MALT lymphoma."},{"st":"usfna","art":"ap_saliv","c":"orange","row":"top","zone":2,"t":"Ultrasound + FNA","tag":"interchange","why":"Ultrasound is first line for almost every salivary swelling, and it guides the needle.","see":["cytology in the Milan system","core biopsy: inconclusive cytology or lymphoma","MRI: extent, deep lobe, perineural spread"],"warn":"No open biopsy of a parotid lump: it seeds tumour and risks the facial nerve."},{"st":"pleo","art":"saltum","c":"orange","row":"top","zone":3,"t":"Pleomorphic adenoma","why":"A mixed tumour in an incomplete capsule with finger-like pseudopodia.","see":["parotid ~80% benign · submandibular 50–60%","minor and sublingual: mostly malignant","Warthin: tail of parotid, older male smokers","old lump grows fast or palsy → carcinoma ex"],"do":["superficial parotidectomy with a cuff"],"warn":"Enucleation leaves pseudopodia behind: recurrence."},{"st":"parot","art":"saltum","c":"orange","row":"top","zone":3,"t":"Parotidectomy","why":"Find the facial nerve trunk, then follow its branches forwards, lifting the superficial lobe off them.","see":["mucoepidermoid: commonest malignancy","adenoid cystic: perineural spread, lungs"],"do":["trunk: tragal pointer, tympanomastoid suture, digastric","keep a working nerve; resect if paralysed or encased","postop radiotherapy: high grade, margins, perineural"]},{"st":"frey","art":"saltum","c":"orange","row":"top","zone":4,"t":"After parotidectomy","see":["VII weakness: temporary in a fifth to a third","permanent ~1–2% (benign, superficial)","Frey: gustatory sweating ~20%"],"do":["Minor starch–iodine test","botulinum toxin into the skin"]},{"st":"hica","art":"para","c":"purple","row":"bottom","zone":0,"t":"High calcium","why":"Usually one gland: about 85% are a single adenoma.","see":["high calcium + raised or unsuppressed PTH","FHH: low urinary calcium, ratio < 0.01"],"warn":"FHH: surgery does not help."},{"st":"tsh","art":"thyroid","c":"red","row":"bottom","zone":1,"t":"TSH, then ultrasound","why":"If TSH is low a scan follows, and a hot nodule is almost never malignant.","see":["concern: age < 20–30 or > 60, male","hard, fixed, > 4 cm, nodes, cord palsy"],"do":["hot nodule: no FNA","ultrasound U1–U5; aspirate U3–U5","laryngoscopy in every thyroid patient"]},{"st":"localise","art":"para","c":"purple","row":"bottom","zone":1,"t":"Localise, then operate","why":"Localisation does not make the diagnosis; it plans a focused operation.","see":["superior: pouch IV, deep to the RLN","inferior: pouch III, superficial, more variable"],"do":["concordant ultrasound + sestamibi → focused","discordant → bilateral exploration","intraop PTH: > 50% fall into normal range = cure"]},{"st":"fna","art":"thyroid","c":"red","row":"bottom","zone":2,"t":"FNA: Bethesda I–VI","tag":"interchange","why":"Cytology sets the risk; Thy3 and above go to the thyroid multidisciplinary team.","see":["I non-diagnostic (Thy1) · II benign (Thy2)","III AUS (Thy3a) · IV follicular neoplasm (Thy3f)","V suspicious (Thy4) · VI malignant (Thy5)","average risk: 13, 4, 22, 30, 74, 97%"],"do":["IV: molecular testing or diagnostic lobectomy"],"warn":"Follicular carcinoma needs capsular or vascular invasion: an aspirate cannot show it."},{"st":"surg","art":"thyroid","c":"red","row":"bottom","zone":3,"w":1.5,"t":"Which thyroidectomy?","see":["papillary 70–85%: lymphatic spread","follicular: blood → lung, bone","medullary: C cells, calcitonin, RET","anaplastic: median ~six months"],"do":["lobectomy: low risk, up to 4 cm, no nodes","total: > 4 cm, extension, nodes, metastases","radioiodine: high risk; often omitted in low","medullary: exclude phaeochromocytoma first"],"warn":"Anaplastic: enough tissue to exclude lymphoma, which is curable."},{"st":"comp","art":"thyroid","c":"red","row":"bottom","zone":4,"t":"After thyroidectomy","see":["RLN: temporary up to 5–10%, permanent ~1%","bilateral RLN: stridor on extubation","Berry's ligament: commonest injury site"],"warn":"Haematoma: open skin and straps at the bedside first."},{"st":"hypocal","art":"para","c":"purple","row":"bottom","zone":4,"t":"Hypocalcaemia","tag":"interchange","why":"Both lines end here, when the glands are removed or devascularised.","see":["24–72 h: perioral, fingertip tingling","Chvostek (5–10% of normals), Trousseau"],"do":["severe: intravenous 10% calcium gluconate","mild: oral calcium + calcitriol"],"warn":"Beyond six months = permanent."}],"cells":{"bottom-0":"stack","bottom-4":"stack"},"ride":{"row":"bottom","zone":0,"text":["Zones run from the first symptom to after surgery.","Top: the salivary lines. Bottom: thyroid and parathyroid.","Both bottom lines end at Hypocalcaemia."]},"checks":{"row":"top","zone":4,"q":[{"art":"ap_saliv","q":"Parotid lump with facial weakness.","o":["pleomorphic adenoma","malignancy until proven otherwise"],"a":1},{"art":"thyroid","q":"Nodule, low TSH, scan shows a hot nodule.","o":["FNA","no FNA","total thyroidectomy"],"a":1},{"art":"thyroid","q":"FNA reported Bethesda IV (Thy3f).","o":["discharge","molecular testing or diagnostic lobectomy","radioiodine"],"a":1},{"art":"para","q":"High calcium, unsuppressed PTH, urine ratio < 0.01.","o":["focused parathyroidectomy","FHH: no surgery"],"a":1}]},"abbr":{"AUS":"atypia of undetermined significance","FHH":"familial hypocalciuric hypercalcaemia","FNA":"fine-needle aspiration","MALT":"mucosa-associated lymphoid tissue","MRI":"magnetic resonance imaging","PTH":"parathyroid hormone","RET":"RET proto-oncogene","RLN":"recurrent laryngeal nerve","TSH":"thyroid-stimulating hormone","US":"

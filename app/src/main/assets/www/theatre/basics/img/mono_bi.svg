<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 430" font-family="Helvetica, Arial, sans-serif">
<rect width="600" height="430" fill="#FBFAF7"/>
<text x="20" y="34" font-size="22" font-weight="700" fill="#1F2A33">Where the current goes</text>
<!-- monopolar -->
<text x="150" y="72" font-size="17" font-weight="700" text-anchor="middle" fill="#B5454D">Monopolar</text>
<rect x="40" y="190" width="220" height="150" rx="18" fill="#F1D9C4" stroke="#B9967A"/>
<text x="196" y="326" font-size="14" text-anchor="middle" fill="#7A5A40">patient</text>
<path d="M150 96 L150 186" stroke="#1F2A33" stroke-width="6" stroke-linecap="round"/>
<polygon points="144,186 156,186 150,200" fill="#1F2A33"/>
<path d="M150 204 C 120 240, 90 290, 80 330 M150 204 C 150 250, 150 300, 150 330 M150 204 C 180 240, 210 290, 220 330" fill="none" stroke="#B5454D" stroke-width="2.5" stroke-dasharray="6 5"/>
<rect x="60" y="340" width="180" height="20" rx="4" fill="#9AA8B4"/>
<text x="150" y="384" font-size="14" text-anchor="middle" fill="#1F2A33">return plate (large area)</text>
<text x="150" y="404" font-size="13.5" text-anchor="middle" fill="#5B6670">current crosses the body</text>
<!-- bipolar -->
<text x="450" y="72" font-size="17" font-weight="700" text-anchor="middle" fill="#2F6F98">Bipolar</text>
<rect x="340" y="190" width="220" height="150" rx="18" fill="#F1D9C4" stroke="#B9967A"/>
<text x="450" y="320" font-size="14" text-anchor="middle" fill="#7A5A40">patient</text>
<path d="M430 96 L440 196 M470 96 L460 196" stroke="#1F2A33" stroke-width="6" stroke-linecap="round"/>
<path d="M441 200 Q450 212 459 200" fill="none" stroke="#2F6F98" stroke-width="3"/>
<text x="450" y="236" font-size="13.5" text-anchor="middle" fill="#2F6F98">only the tissue</text>
<text x="450" y="254" font-size="13.5" text-anchor="middle" fill="#2F6F98">between the tips</text>
<text x="450" y="384" font-size="14" text-anchor="middle" fill="#1F2A33">no plate needed</text>
<text x="450" y="404" font-size="13.5" text-anchor="middle" fill="#5B6670">safer near nerves and devices</text>
</svg>

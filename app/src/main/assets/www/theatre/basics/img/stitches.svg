<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 490" font-family="Helvetica, Arial, sans-serif"><rect width="600" height="490" fill="#FBFAF7"/><text x="20" y="34" font-size="22" font-weight="700" fill="#1F2A33">Four stitches, seen in cross-section</text><rect x="20" y="70" width="115" height="70" fill="#F1D9C4" stroke="#B9967A"/><rect x="145" y="70" width="115" height="70" fill="#F1D9C4" stroke="#B9967A"/><rect x="20" y="70" width="115" height="16" fill="#E8C4A6"/><rect x="145" y="70" width="115" height="16" fill="#E8C4A6"/><path d="M75 80 C 70 150, 175 150, 170 80" fill="none" stroke="#2F6F98" stroke-width="3"/><path d="M75 80 Q122 66 170 80" fill="none" stroke="#2F6F98" stroke-width="3"/><text x="20" y="170" font-size="16" font-weight="700" fill="#1F2A33">Simple interrupted</text><text x="20" y="190" font-size="14.5" fill="#1F2A33">the default; bites equal depth and</text><text x="20" y="208" font-size="14.5" fill="#1F2A33">distance from the edge</text><rect x="310" y="70" width="115" height="70" fill="#F1D9C4" stroke="#B9967A"/><rect x="435" y="70" width="115" height="70" fill="#F1D9C4" stroke="#B9967A"/><rect x="310" y="70" width="115" height="16" fill="#E8C4A6"/><rect x="435" y="70" width="115" height="16" fill="#E8C4A6"/><path d="M345 80 C 340 175, 485 175, 480 80" fill="none" stroke="#2F6F98" stroke-width="3"/><path d="M380 80 C 378 110, 447 110, 445 80" fill="none" stroke="#B5454D" stroke-width="3"/><path d="M345 80 Q 360 64 380 80 M445 80 Q 465 64 480 80" fill="none" stroke="#5B6670" stroke-width="2" stroke-dasharray="4 3"/><text x="310" y="170" font-size="16" font-weight="700" fill="#1F2A33">Vertical mattress</text><text x="310" y="190" font-size="14.5" fill="#1F2A33">far-far, near-near: everts the</text><text x="310" y="208" font-size="14.5" fill="#1F2A33">edges; tense or thin skin</text><rect x="20" y="270" width="115" height="70" fill="#F1D9C4" stroke="#B9967A"/><rect x="145" y="270" width="115" height="70" fill="#F1D9C4" stroke="#B9967A"/><rect x="20" y="270" width="115" height="16" fill="#E8C4A6"/><rect x="145" y="270" width="115" height="16" fill="#E8C4A6"/><path d="M60 280 C 55 355, 190 355, 185 280" fill="none" stroke="#2F6F98" stroke-width="3"/><path d="M60 280 C 55 355, 190 355, 185 280" fill="none" stroke="#B5454D" stroke-width="2" stroke-dasharray="6 5" transform="translate(6 -8)"/><text x="20" y="370" font-size="16" font-weight="700" fill="#1F2A33">Horizontal mattress</text><text x="20" y="390" font-size="14.5" fill="#1F2A33">spreads tension; haemostasis;</text><text x="20" y="408" font-size="14.5" fill="#1F2A33">fragile skin, flaps</text><rect x="310" y="270" width="115" height="70" fill="#F1D9C4" stroke="#B9967A"/><rect x="435" y="270" width="115" height="70" fill="#F1D9C4" stroke="#B9967A"/><rect x="310" y="270" width="115" height="16" fill="#E8C4A6"/><rect x="435" y="270" width="115" height="16" fill="#E8C4A6"/><path d="M330 305 Q 360 315 380 302 Q 400 290 420 302 Q 440 315 460 302 Q 480 290 520 300" fill="none" stroke="#2F6F98" stroke-width="3"/><text x="310" y="370" font-size="16" font-weight="700" fill="#1F2A33">Subcuticular</text><text x="310" y="390" font-size="14.5" fill="#1F2A33">in the dermis, side to side;</text><text x="310" y="408" font-size="14.5" fill="#1F2A33">no stitch marks; neck incisions</text><text x="20" y="474" font-size="14.5" fill="#5B6670">Aim for slight eversion: flat edges sink into a depressed scar as they heal.</text></svg>
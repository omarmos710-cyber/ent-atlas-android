  "**Sphenoethmoidal recess:** above the superior turbinate; the **sphenoid ostium** opens here, about 1–1.5 cm above the upper margin of the choana, close to the septum."],
  "Sinuses that drain in front of the basal lamella (anterior group) send mucus along the lateral pharyngeal wall; posterior group mucus runs over the posterior pharyngeal wall."),
 S("Nasal septum",["s103_39","s105_43","s104_41"],[
  "Three parts: **columellar septum** (medial crura of alar cartilages), **membranous septum** (double layer of skin only) and **septum proper**.",
  "**Septum proper:** **quadrilateral septal cartilage**, perpendicular plate of the ethmoid, and the **vomer**. Small contributions: nasal spine of frontal, crests of nasal, maxillary and palatine bones, anterior nasal spine, rostrum of sphenoid.",
  "The cartilage's lower edge sits in the vomerine groove and on the anterior nasal spine. Dislocation from the spine gives **caudal deviation**; from the vomerine groove gives a **septal spur**."],
  "Preserve an L-strut of at least 1 cm dorsal and caudal cartilage at septoplasty to prevent saddle nose and tip collapse."),
 S("Middle meatus and osteomeatal complex",["s109_53","s109_55","s113_66","s114_68","s110_57"],[
  "**OMC** = middle turbinate, uncinate process, bulla ethmoidalis and ethmoidal infundibulum, with the ostia of the frontal, maxillary and anterior ethmoid sinuses.",
  "**Middle turbinate basal (ground) lamella:** anterior third vertical to the **lateral edge of the cribriform plate**; middle third frontal to the **lamina papyracea**; posterior third horizontal to the lateral nasal wall.",
  "**Uncinate process:** sickle-shaped ethmoid lamina; free posterosuperior edge parallel to the bulla. Upper end inserts on the **lamina papyracea, skull base or middle turbinate**, which decides where the frontal sinus drains.",
  "**Hiatus semilunaris:** 2D gap between the uncinate and the bulla, leading into the **ethmoidal infundibulum** (3D space).",
  "**Bulla ethmoidalis:** largest anterior ethmoid cell; spaces above and behind it form the **lateral sinus (of Grünwald)**.",
  "**Fontanelles:** bone-free areas above and below the uncinate's lower end; an accessory maxillary ostium (about 30%) opens here.",
  "**Paradoxical middle turbinate** curves laterally; **concha bullosa** is a pneumatised middle turbinate; both can narrow the middle meatus."],
  "Mucus ignores an accessory ostium and returns to the natural ostium; failing to join the two at antrostomy causes recirculation."),
 S("Lining of the nose",["s118_74"],[
  "**Vestibule:** stratified squamous skin with vibrissae and sebaceous glands.",
  "**Olfactory region:** roof, upper septum and above the superior turbinate; paler.",
  "**Respiratory mucosa:** pseudostratified ciliated columnar with goblet cells, seromucous glands and **erectile venous sinusoids** (thickest on the turbinates).",
  "Sympathetic stimulation constricts (decongests); parasympathetic dilates and produces watery secretions."],""),
 S("Blood supply",["s119_77","s119_78","d108_40"],[
  "**ICA via ophthalmic:** anterior and posterior ethmoidal arteries (upper part).",
  "**ECA:** **sphenopalatine** (main supply, through the sphenopalatine foramen behind the middle turbinate), greater palatine, superior labial (facial).",
  "**Little's area (Kiesselbach's plexus)** on the anterior septum: anterior ethmoidal, sphenopalatine (septal branch), greater palatine and superior labial arteries. Most common site of epistaxis.",
  "**Woodruff's plexus:** posterior inferior lateral wall below the inferior turbinate; source of posterior bleeds in older patients."],
  "Refractory posterior epistaxis: endoscopic sphenopalatine artery ligation. Bleeding from above the middle turbinate suggests the ethmoidal arteries."),
 S("Nerve supply and lymphatics",["s122_81","s122_82","d108_41"],[
  "**Olfactory nerves:** 12–20 bundles through the cribriform plate to the olfactory bulb.",
  "**General sensation:** anterior ethmoidal nerve (V1) to the front and upper part; branches of the pterygopalatine ganglion (V2) to the back two-thirds; infraorbital to the vestibule.",
  "Block points for anaesthesia: **sphenopalatine foramen** (posterior end of middle turbinate) and **anterior ethmoidal nerve** high under the nasal bones.",
  "**Vidian nerve** = greater petrosal (parasympathetic from VII) + deep petrosal (sympathetic from the ICA plexus) → pterygopalatine ganglion. Only the parasympathetic fibres relay.",
  "**Lymphatics:** front of the nose → submandibular nodes; back → retropharyngeal and upper deep cervical nodes. Upper lymphatics connect to the subarachnoid space along the olfactory nerves."],
  "Vidian neurectomy reduces watery rhinorrhoea in vasomotor rhinitis but also dries the eye on that side (lacrimal fibres travel the same way).")
]);

R("sinus","Paranasal sinuses","Maxillary, frontal, ethmoid and sphenoid sinuses: development, walls, drainage, the cells and variants that matter on CT, and the danger zones in FESS.",[
 S("Overview and development",["s127_1","d109_43"],[
  "Four paired sinuses named after their bones. **Anterior group** (maxillary, frontal, anterior ethmoid) drains in front of the basal lamella into the **middle meatus**. **Posterior group**: posterior ethmoid (superior meatus) and sphenoid (sphenoethmoidal recess).",
  "**Maxillary:** first to develop, present at birth; full size around 15 mL after the third molar erupts. Largest sinus.",
  "**Ethmoid:** present at birth.",
  "**Sphenoid:** absent at birth, recognisable around 3–6 years.",
  "**Frontal:** absent at birth, develops as an upward extension of the frontal recess; last to finish, often asymmetric or absent."],
  "Frontal sinusitis is unusual before about 10 years; orbital complications in young children come from the ethmoids."),
 S("Maxillary sinus",["s130_3","s132_7","s133_9"],[
  "Pyramid: **base** = lateral nasal wall; **apex** into the zygomatic process.",
  "**Anterior wall:** canine fossa (Caldwell–Luc approach). **Posterior wall:** infratemporal and pterygopalatine fossae. **Roof:** orbital floor with the **infraorbital nerve** in its canal.",
  "**Floor:** alveolar process, about **1 cm below the nasal floor** in adults. Roots of the **molars and second premolar** lie close to or in it.",
  "**Ostium:** high on the medial wall, just below the roof, opening into the lowest part of the ethmoidal infundibulum, so drainage relies on cilia, not gravity.",
  "Accessory ostium in about 30%, in the posterior fontanelle."],
  "Dental extraction of an upper molar can leave an oroantral fistula; odontogenic infection causes unilateral maxillary sinusitis."),
 S("Frontal sinus and frontal recess",["s137_17","s139_18","s139_19","s145_35"],[
  "Between the inner and outer tables above the orbit. **Anterior wall** thick (forehead); **floor** thinnest (orbital roof); **posterior wall** against the dura and frontal lobe.",
  "Drains through its floor into the **frontal recess**, then into the infundibulum or medial to the uncinate into the middle meatus.",
  "**Agger nasi cell:** most anterior ethmoid cell, in front of the middle turbinate attachment; it forms the anterior boundary of the frontal recess.",
  "**Frontal cells (Bent–Kuhn):** type I single cell above the agger nasi; type II tier of cells; type III single cell extending into the frontal sinus; type IV isolated cell within the sinus."],
  "Pott's puffy tumour: frontal osteomyelitis with subperiosteal abscess; infection through the thin posterior wall gives epidural or brain abscess."),
 S("Ethmoid bone and sinuses",["s141_26","s143_29","s140_24","s146_38"],[
  "3–18 thin-walled cells between the upper lateral nasal wall and the medial orbital wall.",
  "**Lateral wall:** **lamina papyracea** (paper-thin) with the orbit beyond. **Roof:** **fovea ethmoidalis** of the frontal bone.",
  "**Basal lamella of the middle turbinate** divides **anterior cells** (open into the middle meatus) from **posterior cells** (open into the superior meatus).",
  "**Anterior ethmoidal artery** crosses the roof just behind the frontal recess, often in a bony canal or a mesentery below the skull base. It passes through orbit, ethmoid and anterior cranial fossa.",
  "**Supraorbital ethmoid cells** pneumatise over the orbit and can be mistaken for the frontal sinus."],
  "Cutting the anterior ethmoidal artery lets it retract into the orbit and causes a rapidly expanding orbital haematoma. Lateral canthotomy is the emergency treatment."),
 S("Skull base dangers: Keros",["s140_22","s144_31"],[
  "The **lateral lamella of the cribriform plate** is the thinnest bone of the skull base and the commonest site of CSF leak in FESS.",
  "**Keros classification** (depth of the olfactory fossa below the fovea): **type I 1–3 mm, type II 4–7 mm, type III 8–16 mm**.",
  "Type III has the tallest, thinnest lateral lamella and the highest risk; asymmetry between sides adds risk."],
  "Always read the coronal CT for Keros type and asymmetry before ethmoidectomy."),
 S("Haller and Onodi cells",["s147_41","s147_43"],[
  "**Haller (infraorbital ethmoid) cell:** extends along the orbital floor above the maxillary ostium; reported in roughly 10–45% depending on the series. It can narrow the infundibulum and cause recurrent maxillary sinusitis.",
  "**Onodi (sphenoethmoidal) cell:** posterior ethmoid cell that pneumatises lateral or above the sphenoid sinus; the **optic nerve** (and sometimes the ICA) can lie in its wall."],
  "If you think you are in the sphenoid but see the optic nerve bulge in the lateral wall, you may be in an Onodi cell."),
 S("Sphenoid bone and sinus",["s148_46","s149_47","s154_60","s155_61","s156_63","s157_66"],[
  "Sinuses in the body of the sphenoid, separated by an often **oblique, off-midline septum**.",
  "**Pneumatisation:** **sellar** (most common, about 80%), **presellar** (about 17%), **conchal** (about 3%; makes transsphenoidal surgery hard).",
  "**Lateral wall:** **optic nerve** above, **ICA** below it (opticocarotid recess between them), **cavernous sinus** with III, IV, V1, V2, VI; maxillary nerve lower down. These may be **dehiscent**.",
  "**Roof:** sella turcica and pituitary; optic chiasm and olfactory tract in front.",
  "**Floor:** **vidian nerve** in the pterygoid canal.",
  "**Ostium:** upper anterior wall into the **sphenoethmoidal recess**, about 1–1.5 cm above the choana, medial to the superior turbinate."],
  "The intersinus septum often inserts onto the ICA canal; twisting it off can tear the carotid."),
 S("Mucosa, drainage and supply",[],[
  "Ciliated pseudostratified columnar epithelium with goblet cells; thinner and less vascular than nasal mucosa. Mucus has a serous sol layer and a viscous gel layer.",
  "Cilia move mucus toward the **natural ostium** in set patterns: in the maxillary sinus a stellate pattern from the floor up to the ostium; in the frontal sinus up the medial side and out along the floor.",
  "**Arteries:** ECA (sphenopalatine, facial) and ICA (anterior and posterior ethmoidal).",
  "**Nerves:** V1 (supraorbital, supratrochlear, ethmoidal) and V2 (infraorbital, greater palatine, posterolateral nasal). Lymph to the retropharyngeal and upper deep cervical nodes."],""),
 S("Pterygopalatine fossa",["s161_71","s161_72","s162_74"],[
  "Behind the maxillary sinus. Roof: sphenoid body; front: maxilla; back: pterygoid plates; medial: perpendicular plate of palatine.",
  "Contains the **maxillary artery (3rd part)**, **V2** and the **pterygopalatine ganglion**.",
  "Opens to the orbit, middle cranial fossa, foramen lacerum, nasopharynx, nasal cavity (**sphenopalatine foramen**), infratemporal fossa (**pterygomaxillary fissure**) and the mouth (palatine canals)."],
  "Endoscopic access to the fossa is through the posterior wall of the maxillary sinus after a wide antrostomy.")
]);

/* ===== ORAL CAVITY, SALIVARY GLANDS, PHARYNX ===== */
R("oral","Oral cavity & tongue","Boundaries and cancer subsites of the oral cavity, lips, floor of mouth, retromolar trigone, palate and tongue with its muscles, nerves and lymphatics.",[
 S("Boundaries and subsites",["s165_8","s166_10","s166_11","s173_27"],[
  "From the **lips** to the junction of the **hard and soft palate** above and the **circumvallate papillae** below. Divided into the **vestibule** and the **oral cavity proper**.",
  "**Cancer subsites:** lip, buccal mucosa, upper and lower alveolus and gingiva, retromolar trigone, floor of mouth, oral tongue (anterior two-thirds), hard palate.",
  "The soft palate and tongue base belong to the **oropharynx**."],
  "Tumours of the oral cavity and oropharynx are staged differently, so place the tumour precisely relative to the circumvallate papillae and hard–soft palate junction."),
 S("Lips",["s167_13","s169_18"],[
  "**Vermilion:** non-keratinised, transparent epithelium without hair or glands, so blood colour shows through. The dry vermilion meets skin at the vermilion border (Cupid's bow above).",
  "Mucosa is only about 2 mm from the orbicularis oris.",
  "**Blood:** superior and inferior labial arteries (facial).",
  "**Lymph:** central lower lip → **submental (IA)**; lateral lower lip and upper lip → **submandibular (IB)**; upper lip also to preauricular and infraparotid nodes."],
  "Lower lip cancer near the midline can drain to both sides."),
 S("Floor of mouth, buccal mucosa, retromolar trigone, palate",["s170_19","d125_84","s169_16","s172_22"],[
  "**Floor of mouth:** crescent between the lower gum and the tongue's undersurface; **frenulum**, **sublingual papillae** (submandibular duct openings) and sublingual folds. Anterior floor lymphatics **cross the midline** to IA/IB; posterior floor to levels II–III.",
  "**Buccal mucosa:** lines the cheeks between the gingivobuccal sulci, back to the **pterygomandibular raphe**; the parotid duct opens opposite the **upper second molar**.",
  "**Pterygomandibular raphe:** from the pterygoid hamulus to the mylohyoid line; origin of **buccinator** in front and **superior constrictor** behind. Landmark for the inferior alveolar nerve block.",
  "**Retromolar trigone:** mucosa over the front of the ramus behind the last molar; tumours here reach bone, the pterygoid muscles and the lingual and inferior alveolar nerves early.",
  "**Hard palate:** many minor salivary glands; anterior part drains to submandibular nodes, posterior to retropharyngeal and upper deep cervical nodes."],
  "The hard palate is the commonest site for minor salivary gland tumours."),
 S("Tongue: parts and papillae",["s174_30","d181_1"],[
  "**Oral tongue** (anterior two-thirds: tip, borders, dorsum, ventral surface) in front of the **sulcus terminalis**; **base** (posterior third) faces the oropharynx with the **lingual tonsil**.",
  "**Foramen caecum** at the apex of the sulcus terminalis: origin of the thyroglossal duct.",
  "**Papillae:** circumvallate (8–12, in front of the sulcus, most taste buds), foliate (lateral borders), fungiform (tip and borders), filiform (most numerous, no taste buds).",
  "Undersurface: frenulum, deep lingual veins and fimbriated folds."],""),
 S("Muscles of the tongue",["d183_4"],[
  "**Intrinsic:** longitudinal, transverse and vertical fibres change the shape of the tongue.",
  "**Extrinsic:** **genioglossus** (protrudes; the safety muscle that keeps the tongue off the airway), **hyoglossus** (depresses), **styloglossus** (retracts and elevates), **palatoglossus** (elevates the back).",
  "All supplied by the **hypoglossal nerve (XII)** except **palatoglossus (vagus via the pharyngeal plexus)**."],
  "Unilateral XII palsy: the tongue deviates toward the weak side on protrusion (the healthy genioglossus pushes it over)."),
 S("Nerves, taste and lymphatics of the tongue",["s175_33"],[
  "**Anterior two-thirds:** general sensation by the **lingual nerve (V3)**; taste by the **chorda tympani (VII)**.",
  "**Posterior third:** general sensation and taste by **glossopharyngeal (IX)**.",
  "**Vallecula and epiglottis:** internal laryngeal nerve (X).",
  "**Lymph:** tip → **submental**; lateral borders → **submandibular** and deep cervical (can skip to **level III–IV**, the jugulo-omohyoid node); central part and base → **both sides** of the neck."],
  "Lateral tongue cancer can metastasise straight to level III–IV, so selective neck dissection for oral tongue includes levels I–IV."),
 S("Soft palate",["d185_5"],[
  "Palatine aponeurosis plus five muscles: **tensor veli palatini (V3)**, **levator veli palatini**, palatoglossus, palatopharyngeus and musculus uvulae (all **vagus via the pharyngeal plexus**).",
  "**Tensor** hooks round the pterygoid hamulus and opens the ET; **levator** lifts the palate to close the nasopharynx."],
  "Cleft palate disrupts the tensor's pull on the ET, which is why most children with cleft palate have otitis media with effusion.")
]);

R("salivary","Salivary glands","Parotid, submandibular and sublingual glands: capsules, lobes, ducts, relations, nerves and the facial nerve landmarks.",[
 S("Overview and structure",["s177_35","s194_69"],[
  "**Major glands:** parotid, submandibular, sublingual. **Minor glands:** about 450 (ENT Steps) to 600–1000 (most textbooks) in the lips, cheeks, palate (most), floor of mouth, retromolar area, also in the sinuses, pharynx and larynx.",
  "Acini drain through **intercalated → striated → excretory ducts**; myoepithelial cells squeeze acini and intercalated ducts.",
  "**Parotid:** mainly serous. **Submandibular:** mixed. **Sublingual and minor glands:** mainly mucous.",
  "At rest the **submandibular gland gives most saliva** (about 70%); on stimulation the **parotid** takes over."],
  "The smaller the gland, the more likely a tumour in it is malignant (parotid about 20%, submandibular about 50%, minor glands about 70–80%)."),
 S("Parotid: position, capsule and shape",["s182_43","d76_0","s183_45"],[
  "Largest gland (about 25 g), in the space bounded by the **ramus, the EAC and the mastoid**; reaches the styloid process medially.",
  "**True capsule** from the gland's own stroma; **false capsule (parotid fascia)** from the investing layer of deep cervical fascia: thick superficial lamina to the zygomatic arch, thin deep lamina to the styloid and tympanic plate, forming the **stylomandibular ligament**.",
  "Shape: inverted three-sided pyramid. Apex below over the posterior belly of digastric; base above against the EAC and TMJ. Surfaces: superficial, anteromedial, posteromedial.",
  "The **facial nerve plane** divides it into a large **superficial lobe** and a **deep lobe**; an accessory lobe may lie on the masseter."],
  "Parotitis is very painful because the unyielding fascia is innervated by the great auricular nerve; pain worsens at meals."),
 S("Structures inside and around the parotid",["d77_2","d78_3","s182_44"],[
  "**Within the gland, superficial to deep:** facial nerve and branches, **retromandibular vein**, **external carotid artery**, which gives the posterior auricular artery and divides into its two terminal branches, the superficial temporal and maxillary arteries. Also intraparotid lymph nodes.",
  "**Posteromedial surface:** mastoid, SCM, posterior belly of digastric, the styloid and its muscles; the styloid separates the gland from the ICA, IJV and IX–XII.",
  "**Anteromedial surface:** ramus, masseter, medial pterygoid, TMJ.",
  "**At the anterior border, top to bottom:** zygomatic branch, transverse facial artery, upper buccal branch, **parotid duct**, lower buccal branch, marginal mandibular branch.",
  "**At the apex:** cervical branch and the divisions of the retromandibular vein. **At the base:** temporal branch, superficial temporal vessels, auriculotemporal nerve."],
  "The parotid is the only salivary gland with lymph nodes inside its capsule, because it encapsulates late in development."),
 S("Parotid duct and nerves",["d79_6","s54_20","s189_61"],[
  "**Stensen's duct:** about 5 cm long, leaves the anterior border a finger-breadth below the zygomatic arch, crosses the masseter, then pierces the **buccal fat, buccopharyngeal fascia and buccinator** to open opposite the **upper second molar**.",
  "Surface marking: middle third of a line from the tragus to the midpoint of the upper lip.",
  "**Secretomotor:** inferior salivatory nucleus → IX → tympanic (Jacobson's) nerve → lesser petrosal → otic ganglion → **auriculotemporal nerve**.",
  "**Sensory:** great auricular nerve (capsule), auriculotemporal nerve."],
  "Frey syndrome: after parotidectomy, cut secretomotor fibres regrow into the sweat glands of the skin, so the cheek sweats and flushes when eating."),
 S("Facial nerve landmarks at parotidectomy",["s184_47","s186_50","s187_52","s188_56"],[
  "Trunk leaves the stylomastoid foramen, enters the posteromedial surface and divides into **temporofacial** and **cervicofacial** divisions.",
  "**Tragal pointer:** nerve 1–1.5 cm deep and anteroinferior.",
  "**Tympanomastoid suture:** nerve 6–8 mm deep to it.",
  "**Posterior belly of digastric:** nerve just above its upper border at the mastoid.",
  "**Peripheral branches:** temporal branch crosses the zygomatic arch about halfway between the tragus and lateral canthus; buccal branch about 1 cm above the duct; marginal mandibular branch superficial to the facial vessels."],""),
 S("Submandibular gland",["s190_62","s191_64","s191_66","d124_79"],[
  "Fills the submandibular triangle. **Superficial part** (larger) on the mylohyoid; **deep part** on the hyoglossus; the two are continuous round the **posterior border of mylohyoid**.",
  "Capsule from the investing layer of deep cervical fascia. **Facial vein** runs over the gland; the **facial artery** grooves its deep and upper surfaces.",
  "**Wharton's duct** (about 5 cm) leaves the deep part, runs forward on the hyoglossus between the **lingual nerve above** and **hypoglossal nerve below**, and opens at the **sublingual papilla** beside the frenulum.",
  "The **lingual nerve hooks under the duct** (lateral, then below, then medial)."],
  "Excision: the **marginal mandibular nerve** lies superficial to the facial vessels just below the mandible. Hayes Martin manoeuvre: divide the facial vein low and lift it up to protect the nerve. Then look out for the lingual and hypoglossal nerves deep to the gland."),
 S("Sublingual and minor glands",["s192_67","d125_83"],[
  "**Sublingual gland:** almond-shaped, in the front of the floor of the mouth between the mucosa, mylohyoid and mandible. Drains through about 10–20 **ducts of Rivinus** into the floor of the mouth, and some through **Bartholin's duct** into Wharton's duct.",
  "**Secretomotor to submandibular and sublingual:** superior salivatory nucleus → nervus intermedius → **chorda tympani** → lingual nerve → **submandibular ganglion**.",
  "Minor glands are mucous and contribute about 7–10% of saliva."],
  "Ranula is a mucous extravasation cyst from the sublingual gland; a plunging ranula passes through or behind the mylohyoid into the neck.")
]);

R("pharynx","Pharynx, tonsils & oesophagus","The pharyngeal wall and spaces, nasopharynx, oropharynx with the tonsil, hypopharynx, and the cervical oesophagus.",[
 S("General features and wall",["s195_0","s198_4","d172_73"],[
  "Fibromuscular tube **12–14 cm** long from the skull base to the **lower border of the cricoid (C6)**, where it becomes the oesophagus. The pharyngo-oesophageal junction is the narrowest part of the gut apart from the appendix.",
  "**Four layers:** mucosa, **pharyngobasilar fascia** (thick near the skull base), muscle, **buccopharyngeal fascia**.",
  "Epithelium: ciliated columnar in the nasopharynx, stratified squamous elsewhere."],""),
 S("Muscles of the pharynx",["s198_3","d170_69","s205_17","d171_72"],[
  "**Outer circular layer:** superior, middle and inferior constrictors. The inferior constrictor has **thyropharyngeus** (oblique) and **cricopharyngeus** (transverse, the upper oesophageal sphincter).",
  "**Inner longitudinal layer:** stylopharyngeus, salpingopharyngeus, palatopharyngeus.",
  "**Nerve supply:** all by the **pharyngeal plexus (X)** except **stylopharyngeus (IX)**.",
  "**Gaps:** above the superior constrictor (**sinus of Morgagni**): ET, levator veli palatini, ascending palatine artery. Between superior and middle: stylopharyngeus, IX, stylohyoid ligament. Between middle and inferior: internal laryngeal nerve and superior laryngeal vessels. Below the inferior: recurrent laryngeal nerve and inferior laryngeal vessels."],""),
 S("Killian's dehiscence and the oesophageal triangles",["s199_7","s226_54"],[
  "**Killian's dehiscence:** weak area between thyropharyngeus and cricopharyngeus, posteriorly.",
  "**Laimer's triangle:** below cricopharyngeus, between it and the oesophageal longitudinal muscle.",
  "**Killian–Jamieson area:** lateral, below cricopharyngeus."],
  "Zenker's (pharyngeal pouch) herniates through Killian's dehiscence when cricopharyngeus fails to relax. The same spot is the commonest site of perforation at rigid oesophagoscopy ('gateway of tears')."),
 S("Pharyngeal spaces",["s199_5","s278_76"],[
  "**Parapharyngeal space:** inverted pyramid from the skull base to the hyoid. Divided by the styloid and tensor-vascular-styloid fascia into **prestyloid** (deep lobe of parotid, fat, minor salivary glands) and **poststyloid** (ICA, IJV, IX–XII, sympathetic chain, nodes).",
  "**Retropharyngeal space:** between the buccopharyngeal fascia and the alar fascia, from the skull base to about T2; contains the retropharyngeal nodes (lateral = **Rouvière's** node).",
  "**Danger space:** between the alar and prevertebral fascia, from the skull base to the diaphragm."],
  "Prestyloid masses are mostly pleomorphic adenomas; poststyloid masses are mostly paragangliomas and schwannomas. Retropharyngeal nodes regress after about 5 years, so retropharyngeal abscess is a disease of young children."),
 S("Waldeyer's ring",["s200_8","s209_23"],[
  "Ring of mucosa-associated lymphoid tissue at the entrance of the aerodigestive tract: **adenoids, tubal tonsils, lateral pharyngeal bands, palatine tonsils, posterior wall nodules, lingual tonsil**.",
  "Produce IgA and IgG; crypts increase the surface exposed to antigens. Most active between 4 and 10 years, then involute.",
  "**Adenoids vs palatine tonsils:** adenoid is single, in the nasopharynx, with folds but no true crypts, **no capsule**, respiratory epithelium, usually gone by adulthood. Tonsils are paired, with crypts, a **capsule** and squamous epithelium."],""),
 S("Nasopharynx",["s201_10","s204_14","s204_15","s206_20","s208_22"],[
  "Behind the choanae, from the skull base to the soft palate (level of the hard palate and atlas).",
  "**Roof and back wall:** basisphenoid, basiocciput and atlas, with the **adenoids** at their junction (largest up to about 6 years). The **pharyngeal bursa** marks the notochord attachment; **Rathke's pouch** remnant lies above.",
  "**Lateral wall:** **ET orifice** about 1.25 cm behind the inferior turbinate, **torus tubarius**, **salpingopharyngeal fold**, tubal tonsil and the **fossa of Rosenmüller** behind and above the torus.",
  "**Floor:** soft palate; the nasopharyngeal isthmus closes against **Passavant's ridge** (palatopharyngeus) in swallowing and speech.",
  "**Lymph:** retropharyngeal (Rouvière) and upper deep cervical nodes, spinal accessory chain, **often both sides**."],
  "The fossa of Rosenmüller is the commonest site of nasopharyngeal carcinoma. A unilateral middle ear effusion in an adult needs a nasopharyngeal look."),
 S("Oropharynx",["s211_28","s211_27"],[
  "From the soft palate to the level of the **hyoid (tip of epiglottis)**; opens forward into the mouth at the **oropharyngeal isthmus**.",
  "**Subsites:** soft palate and uvula, **tonsillar region** (tonsil, pillars), **base of tongue** with lingual tonsil and **valleculae**, posterior wall.",
  "Valleculae lie between the tongue base and epiglottis, divided by the median glossoepiglottic fold; the lateral glossoepiglottic folds (sometimes called pharyngoepiglottic folds) bound them laterally.",
  "**Lymph:** upper jugular chain, especially the **jugulodigastric (tonsillar) node**, plus retropharyngeal and parapharyngeal nodes."],
  "Tongue base lymphatics drain to both sides, so base of tongue cancer often presents with bilateral nodes."),
 S("Palatine tonsil",["s215_34","s216_38","s218_41","s219_42"],[
  "In the tonsillar fossa between the **palatoglossal (anterior) and palatopharyngeal (posterior) arches**. Supratonsillar fossa above it.",
  "**12–15 crypts**; the large **crypta magna** (intratonsillar cleft) near the upper pole is a remnant of the 2nd pouch.",
  "**Capsule** on the lateral surface, separated from the bed by loose areolar tissue: the plane for tonsillectomy and the site of **peritonsillar abscess (quinsy)**.",
  "**Bed:** superior constrictor, and lateral to it the facial artery, submandibular gland, posterior belly of digastric, medial pterygoid, angle of mandible; **glossopharyngeal nerve** and styloglossus.",
  "**Arteries (ECA):** **tonsillar branch of facial (main)**, ascending palatine, ascending pharyngeal, dorsal lingual, descending palatine.",
  "**Veins:** the **paratonsillar (external palatine) vein** on the lateral surface drains to the common facial vein and pharyngeal plexus.",
  "**Nerves:** IX and lesser palatine nerves (V2). **Lymph:** jugulodigastric node."],
  "Primary bleeding at tonsillectomy is usually venous from the paratonsillar vein; secondary bleeding (days 5–10) follows infection of the tonsillar fossa. Post-operative ear pain is referred via IX. The ICA lies about 2.5 cm behind and lateral to the tonsil."),
 S("Hypopharynx",["s221_43","s222_44","s222_46","s241_18"],[
  "From the hyoid to the **lower border of the cricoid (C3–C6)**, behind and beside the larynx.",
  "**Three subsites:** **piriform sinus**, **postcricoid region**, **posterior pharyngeal wall**.",
  "**Piriform sinus:** lateral = thyrohyoid membrane and thyroid lamina; medial = aryepiglottic fold, arytenoid and cricoid; above = pharyngoepiglottic fold. Foreign bodies lodge here.",
  "The **internal laryngeal nerve** runs under the mucosa of the piriform sinus (local anaesthesia site).",
  "**Lymph:** piriform sinus through the thyrohyoid membrane to the upper jugular chain; postcricoid to paratracheal and supraclavicular nodes."],
  "Piriform sinus cancer causes referred otalgia through the internal laryngeal nerve (X). Postcricoid carcinoma is associated with Plummer–Vinson syndrome in women."),
 S("Cervical oesophagus",["s227_55","s228_59"],[
  "About **25 cm** from the cricoid (C6) to the cardia (T11); about **40 cm** from the upper incisors.",
  "**Constrictions** (from the upper incisors): cricopharyngeus **15 cm** (C6, the narrowest), aortic arch **22 cm** (T4), left main bronchus **25 cm** (T5), diaphragm **40 cm** (T10).",
  "Layers: squamous mucosa, submucosa, inner circular and outer longitudinal muscle, adventitia (no serosa). Upper third striated, lower third smooth.",
  "**Upper oesophageal sphincter:** a high-pressure zone about 2.5–4.5 cm long (cricopharyngeus, about 1 cm wide, plus adjacent muscle); closed at rest.",
  "**Lymph:** cervical part to deep cervical and paratracheal nodes."],
  "Swallowed coins in children most often stick at cricopharyngeus.")
]);

/* ===== LARYNX, NECK, VESSELS & NERVES, THYROID ===== */
R("larynx","Larynx & trachea","Framework, joints, membranes, compartments and spaces, the vocal fold, muscles, nerves, the paediatric larynx and the trachea.",[
 S("Site and relations",["dl_site","dl_relations"],[
  "In the front of the neck from the root of the tongue to the trachea, opposite **C3 to C6**.",
  "Moves up and forward in swallowing and phonation; passive side-to-side movement gives normal **laryngeal crepitus**.",
  "**In front:** skin, fascia, infrahyoid muscles, pyramidal lobe. **On each side:** thyroid lobe and carotid sheath. **Behind:** the laryngopharynx and piriform fossae."],
  "Loss of laryngeal crepitus suggests a postcricoid or retropharyngeal mass."),
 S("Cartilages",["dl_views","dl_epiglottis","dl_thyroid","dl_cricoid","dl_arytenoid"],[
  "**Unpaired:** thyroid, cricoid, epiglottis. **Paired:** arytenoid, corniculate (Santorini), cuneiform (Wrisberg).",
  "**Hyaline** (ossify, starting in the thyroid at about 25 years): thyroid, cricoid, arytenoid body. **Elastic** (never ossify): epiglottis, corniculate, cuneiform, tip and vocal process of arytenoid.",
  "**Thyroid:** largest; two laminae meeting at **90° in men, 120° in women**. Superior notch, oblique line, superior and inferior horns. The vocal cords attach at the middle of the thyroid angle.",
  "**Cricoid:** the only **complete ring**; narrow arch in front, tall lamina behind. Lower border at **C6**.",
  "**Epiglottis:** leaf-shaped; the **petiole** attaches to the thyroid angle; the **hyoepiglottic ligament** divides it into suprahyoid and infrahyoid parts.",
  "**Arytenoid:** pyramid with a base on the cricoid, **vocal process** in front (vocal ligament), **muscular process** laterally (PCA, LCA), apex carrying the corniculate."],
  "Ossified cartilage can look like tumour invasion on CT; the epiglottis never ossifies."),
 S("Joints",["s235_6"],[
  "**Cricoarytenoid joint:** synovial, between the arytenoid base and a facet on the upper border of the cricoid lamina. **Rotation** about a vertical axis abducts and adducts the cords; **gliding** opens and closes the back of the glottis.",
  "**Cricothyroid joint:** synovial, between the inferior horn of the thyroid and the side of the cricoid. Rocking tilts the thyroid forward to lengthen the cords."],
  "Rheumatoid arthritis and intubation trauma can fix the cricoarytenoid joint; it looks like palsy, but the arytenoid does not move passively on palpation."),
 S("Membranes and ligaments",["dl_thyrohyoid","dl_membranes","s238_11","s237_9"],[
  "**Extrinsic:** **thyrohyoid membrane** (pierced by the **internal laryngeal nerve and superior laryngeal vessels**), hyoepiglottic ligament, **cricotracheal membrane**.",
  "**Quadrangular membrane:** from the epiglottis to the arytenoid; upper edge in the aryepiglottic fold, **lower free edge = vestibular ligament** (false cord).",
  "**Cricovocal membrane (conus elasticus):** from the cricoid arch up to its **free upper edge = vocal ligament**, between the thyroid angle and vocal process. Its thick anterior part is the **median cricothyroid ligament**.",
  "The conus elasticus funnels into the subglottis, where small foreign bodies can impact."],
  "Cricothyroidotomy goes through the median cricothyroid ligament, below the vocal cords, bypassing any obstruction above them."),
 S("Laryngeal inlet and cavity",["dl_inlet","dl_cavity","s239_14","s240_16","s242_24"],[
  "**Inlet:** oblique; bounded by the free edge of the **epiglottis** in front, **aryepiglottic folds** at the sides and the **interarytenoid fold** behind. Closes in swallowing.",
  "The vestibular and vocal folds divide the cavity into the **vestibule** (inlet to false cords), **ventricle** (between false and true cords) and **infraglottic cavity** (down to the lower cricoid).",
  "**Saccule:** pouch from the front of the ventricle rising between the false cord and thyroid lamina; its glands lubricate the cords.",
  "**Rima glottidis:** narrowest part of the adult larynx. Anterior two-thirds membranous (cords), posterior third cartilaginous (vocal processes). Length about **24 mm in men, 16 mm in women**."],
  "A laryngocele is an air-filled dilated saccule; internal ones bulge the false cord, external ones push through the thyrohyoid membrane into the neck."),
 S("Subsites, mucosa and lymphatics",["s240_17"],[
  "**Supraglottis:** epiglottis, aryepiglottic folds, arytenoids, false cords, ventricle. **Glottis:** true cords and anterior/posterior commissures, down to a plane 1 cm below the apex of the ventricle. **Subglottis:** down to the lower border of the cricoid.",
  "Epithelium is ciliated columnar except **squamous over the true cords**, upper epiglottis and aryepiglottic folds. No glands on the free edge of the cords.",
  "**Supraglottis:** rich, bilateral lymphatics through the thyrohyoid membrane to the **upper deep cervical (II–III)** nodes.",
  "**Glottis:** very sparse lymphatics.",
  "**Subglottis:** through the cricothyroid membrane to the **prelaryngeal (Delphian)** and pretracheal nodes, and through the cricotracheal membrane to paratracheal and lower deep cervical nodes."],
  "Early glottic cancer rarely spreads to nodes, so T1 glottic tumours do not need neck treatment. Supraglottic cancer often has bilateral nodes."),
 S("Spaces of the larynx",["s244_25","s245_26"],[
  "**Pre-epiglottic space (Boyer):** fat-filled. Front: thyrohyoid membrane and upper thyroid cartilage. Above: hyoepiglottic ligament. Behind: infrahyoid epiglottis. Below: thyroepiglottic ligament. Continuous laterally with the paraglottic space.",
  "**Paraglottic space:** between the thyroid lamina and cricothyroid membrane laterally and the conus elasticus, ventricle and quadrangular membrane medially; behind it is the mucosa of the piriform fossa.",
  "**Reinke's space:** superficial lamina propria of the cord, between the epithelium and vocal ligament, limited by the arcuate lines above and below."],
  "Invasion of the pre-epiglottic or paraglottic space makes a laryngeal cancer T3. Paraglottic spread is how tumours become transglottic and how piriform sinus cancer reaches the larynx."),
 S("The vocal fold",["s247_29"],[
  "**Layers:** squamous epithelium → **superficial lamina propria (Reinke's space)** → intermediate and deep lamina propria (**vocal ligament**) → **vocalis (thyroarytenoid)**.",
  "**Body–cover model:** cover = epithelium + superficial lamina propria (vibrates as the mucosal wave); transition = vocal ligament; body = muscle.",
  "**Phase differences:** the lower edges part before the upper edges (vertical), and the front parts before the back (horizontal).",
  "High pitch stretches and stiffens the cover; low pitch slackens it."],
  "Phonosurgery stays superficial to the vocal ligament to protect the mucosal wave. Reinke's oedema is fluid in the superficial lamina propria, strongly linked to smoking."),
 S("Intrinsic muscles",["s250_31","dl_pca","dl_adductors","dl_closers","dl_cricothyroid","dl_thyroarytenoid","s250_33"],[
  "**Abductor:** **posterior cricoarytenoid (PCA) only**.",
  "**Adductors:** lateral cricoarytenoid, **interarytenoid** (the transverse arytenoid is the only unpaired intrinsic muscle; the oblique arytenoids are paired), external thyroarytenoid.",
  "**Tensor:** **cricothyroid** (tilts the thyroid forward, raising pitch). Vocalis fine-tunes tension.",
  "**Relaxer:** thyroarytenoid (internal part).",
  "**Inlet:** opened by thyroepiglottic part of thyroarytenoid; closed by the aryepiglottic and oblique arytenoid muscles.",
  "**Extrinsic elevators:** thyrohyoid, stylopharyngeus, salpingopharyngeus, palatopharyngeus and the suprahyoids. **Depressors:** sternohyoid, sternothyroid, omohyoid."],
  "\"Abduct to breathe, adduct to speak.\" Bilateral PCA paralysis leaves both cords near the midline: good voice but stridor."),
 S("Nerve supply",["dl_nerves","s252_34","d139_13"],[
  "All from the **vagus** (motor neurones in the nucleus ambiguus).",
  "**Superior laryngeal nerve** (from the inferior ganglion) runs behind the ICA and divides at the level of the hyoid's greater horn: **internal branch** pierces the thyrohyoid membrane (sensation **above the cords**); **external branch** runs with the superior thyroid artery to the **cricothyroid**.",
  "**Recurrent laryngeal nerve:** motor to all intrinsic muscles except cricothyroid; sensation **below the cords**. **Right** loops under the subclavian artery; **left** under the aortic arch beside the ligamentum arteriosum, so it is longer.",
  "RLN climbs in the tracheo-oesophageal groove and enters behind the cricothyroid joint, under the inferior constrictor.",
  "**Galen's anastomosis** joins the internal laryngeal and recurrent laryngeal nerves.",
  "**Non-recurrent laryngeal nerve:** about 0.5–1%, right side, with an aberrant right subclavian artery (arteria lusoria)."],
  "Left cord palsy is about twice as common as right because of the long intrathoracic course (lung cancer, aortic aneurysm, cardiac surgery). External laryngeal nerve injury after thyroidectomy loses the high notes."),
 S("Paediatric larynx",[],[
  "Higher in the neck: **C3–C4** at birth versus C6 in adults.",
  "**Narrowest point is the subglottis (cricoid ring)**, not the glottis.",
  "Epiglottis omega-shaped and floppy; arytenoids relatively large; tissues looser.",
  "Normal term subglottis about **4.5–5.5 mm**; under 4 mm in a term baby suggests subglottic stenosis."],
  "1 mm of oedema in a 4 mm subglottis cuts its area by about 75%: why croup and post-intubation stenosis are dangerous in infants."),
 S("Trachea and bronchi",["dl_trachea","s254_37","s258_42"],[
  "**10–12 cm**, from the lower border of the cricoid (C6) to the **carina at T5**.",
  "**16–20 C-shaped hyaline rings**, open behind where the membranous wall with trachealis faces the oesophagus.",
  "**Cervical relations:** in front, skin, fascia, infrahyoid muscles, **thyroid isthmus over rings 2–4**, inferior thyroid veins; behind, oesophagus with the RLN in the grooves; at the sides, thyroid lobes and carotid sheath.",
  "**Right main bronchus** is wider, shorter and more vertical, so foreign bodies usually go right. The right upper lobe bronchus is **eparterial** (above the pulmonary artery).",
  "Right lung has 10 segments; left usually 8–10 (9 in Bansal/ENT Steps)."],
  "Tracheostomy is usually placed through rings 2–4; going through ring 1 risks subglottic stenosis.")
]);

R("neck","Neck: triangles, fascia & nodes","Surface landmarks, the triangles and their contents, deep cervical fascia, the neck spaces, and the lymph node levels you need for neck dissection.",[
 S("Surface landmarks",["s261_46","s263_50","s263_51"],[
  "**Hyoid** (C3): thyroglossal cyst moves up on tongue protrusion.",
  "**Thyroid cartilage** (Adam's apple, C4–C5) and **cricoid** (C6), with the **cricothyroid membrane** between them.",
  "**Thyroid isthmus** is palpable below the cricoid over rings 2–4; normal lobes lie deep to SCM.",
  "**Carotid bifurcation** at the upper border of the thyroid cartilage, where the carotid pulse is best felt.",
  "**Mastoid**: transverse process of the atlas is felt just in front of and below it."],
  "C6 marks many things: cricoid, end of larynx and pharynx, start of trachea and oesophagus, Chassaignac's tubercle, vertebral artery entering the foramen transversarium."),
 S("Sternocleidomastoid and trapezius",["s265_53","s267_57"],[
  "**SCM:** sternal head (manubrium) and clavicular head (medial third) to the mastoid and superior nuchal line. **Accessory nerve** motor; C2–C3 proprioception (C2–C4 in ENT Steps).",
  "One side tilts the head to the same side and turns the face to the opposite side; both sides flex the neck.",
  "The **IJV** lies in the gap between the two heads; the carotid sheath and deep jugular nodes lie under the muscle.",
  "**Erb's point:** junction of upper and middle thirds of the posterior border of SCM, where the **accessory nerve** and the lesser occipital, great auricular and transverse cervical nerves emerge.",
  "**Trapezius** forms the back of the posterior triangle; accessory nerve, elevates the shoulder."],
  "Accessory nerve injury in the posterior triangle causes a dropped shoulder, scapular malrotation and pain (shoulder syndrome) after neck dissection or node biopsy."),
 S("Triangles of the neck",["s271_65","s271_66","s272_68","d116_55"],[
  "SCM divides each side into **anterior and posterior triangles**.",
  "**Anterior triangle** (SCM, lower border of mandible, midline) splits into: **submental** (anterior bellies of digastric and hyoid; nodes), **submandibular** (mandible and both bellies of digastric; submandibular gland, facial vessels, nodes, hypoglossal nerve), **carotid** (posterior belly of digastric, superior belly of omohyoid, SCM; carotid bifurcation, IJV, X, XII, ansa cervicalis, nodes), **muscular** (strap muscles, thyroid, larynx, trachea).",
  "**Posterior triangle** (SCM, trapezius, clavicle) splits by the inferior belly of omohyoid into **occipital** (accessory nerve, cervical plexus branches, nodes) and **supraclavicular** (subclavian vessels, brachial plexus trunks, transverse cervical vessels, nodes)."],""),
 S("Posterior triangle in detail",["s273_69","d117_57","d168_65","s266_55"],[
  "**Roof:** investing layer of deep cervical fascia. **Floor (muscles covered by prevertebral fascia):** splenius capitis, levator scapulae, scalenus medius and posterior, sometimes scalenus anterior.",
  "**Accessory nerve** crosses obliquely from Erb's point to the trapezius about 5 cm above the clavicle, lying in the roof.",
  "Lower part contains the **third part of the subclavian artery**, **trunks of the brachial plexus**, transverse cervical and suprascapular vessels, and the external jugular vein entering the subclavian vein.",
  "Phrenic nerve lies on scalenus anterior deep to the prevertebral fascia."],""),
 S("Deep cervical fascia",["s275_72","s275_73","d115_53","s276_74","d113_50"],[
  "**Superficial (investing) layer:** surrounds the neck and splits round **2 muscles** (SCM, trapezius) and **2 glands** (parotid, submandibular); forms the suprasternal space of Burns. Attached to the hyoid, mandible, mastoid, nuchal line, clavicle and sternum.",
  "**Middle (pretracheal, visceral) layer:** muscular part round the strap muscles; visceral part round the pharynx, larynx, trachea, oesophagus, thyroid and parathyroids; continues as buccopharyngeal fascia above and into the mediastinum below.",
  "**Deep (prevertebral) layer:** splits into **alar** fascia in front and **prevertebral** fascia behind. Prevertebral fascia covers the vertebral and scalene muscles, the phrenic nerve and brachial plexus, and extends as the axillary sheath.",
  "**Carotid sheath:** all three layers contribute; contains the **CCA/ICA, IJV and vagus**. The sympathetic chain lies behind it.",
  "The thyroid moves with swallowing because the pretracheal fascia attaches it to the larynx."],""),
 S("Neck spaces",["s278_76","s274_71"],[
  "**Retropharyngeal space:** between the visceral fascia (buccopharyngeal) and alar fascia, skull base to about **T2**.",
  "**Danger space:** between alar and prevertebral fascia, skull base to the **diaphragm**; infection spreads to the posterior mediastinum.",
  "**Prevertebral space:** behind the prevertebral fascia, the whole length of the spine.",
  "Also: submandibular (Ludwig's angina), parapharyngeal, peritonsillar and pretracheal spaces."],
  "Infection in the danger space can reach the mediastinum quickly; widened prevertebral soft tissue on a lateral neck X-ray is the clue."),
 S("Lymph node groups",["d199_21","d200_22","d201_23","d202_24","s285_78","s286_79"],[
  "**Superficial ring of the head:** occipital, mastoid, parotid (pre-auricular, intra-glandular), facial, submandibular, submental.",
  "**Deep cervical chains:** **internal jugular** (upper with the **jugulodigastric**, middle, lower with the **jugulo-omohyoid**), **spinal accessory**, **transverse cervical (supraclavicular)**.",
  "**Anterior (juxtavisceral):** prelaryngeal (Delphian), pretracheal, paratracheal (along the RLN).",
  "**Retropharyngeal:** lateral group with **Rouvière's node** at the atlas; not palpable.",
  "All lymph ends in the lower deep cervical nodes → jugular trunk → the jugulosubclavian junction (thoracic duct on the left)."],
  "Left supraclavicular (Virchow's) node can be the first sign of abdominal or thoracic cancer via the thoracic duct."),
 S("Lymph node levels",["s286_80"],[
  "**IA submental:** between the anterior bellies of digastric and above the hyoid. **IB submandibular.**",
  "**II upper jugular:** skull base to hyoid; **IIA** in front of (medial to) the accessory nerve, **IIB** behind (lateral to) it.",
  "**III middle jugular:** hyoid to the lower border of the cricoid (AAO-HNS). **IV lower jugular:** cricoid to the clavicle.",
  "**V posterior triangle:** **VA** above the cricoid level (accessory nodes), **VB** below (transverse cervical, supraclavicular).",
  "**VI central compartment:** hyoid to suprasternal notch, between the carotids (Delphian, pretracheal, paratracheal, perithyroid).",
  "**VII:** superior mediastinum below the suprasternal notch to the innominate artery.",
  "Not in levels: parotid, retroauricular, suboccipital, facial and retropharyngeal nodes.",
  "**Ho's triangle:** supraclavicular area between the medial and lateral ends of the clavicle and the neck–shoulder point; nodes here mean advanced nasopharyngeal cancer."],
  "Neck dissections: radical = I–V plus SCM, IJV and accessory nerve. Modified radical keeps one or more of them. Selective: supraomohyoid I–III (oral cavity), lateral II–IV (larynx, pharynx), central VI (thyroid).")
]);

R("vessels","Neck vessels & nerves","Carotid and jugular systems, the subclavian, the last four cranial nerves, cervical plexus, phrenic nerve and sympathetic chain.",[
 S("Carotid sheath and common carotid",["s267_56","d140_14","d128_88"],[
  "Sheath contains the **common/internal carotid medially, IJV laterally, vagus between and behind them**; the ansa cervicalis lies on or in its front; the sympathetic chain is behind it.",
  "**Common carotid:** right from the brachiocephalic trunk, left from the arch. Ascends to the **upper border of the thyroid cartilage (C3–C4)**, where it divides. No branches in the neck.",
  "**Carotid sinus** (baroreceptor) at the ICA origin and **carotid body** (chemoreceptor) in the bifurcation, both supplied by **IX** (nerve of Hering)."],
  "Carotid sinus massage slows the heart; a carotid body tumour splays the ICA and ECA apart (lyre sign)."),
 S("External carotid artery",["s268_61","d146_25","d146_27","s272_67"],[
  "Begins in front of and medial to the ICA; ends in the parotid behind the neck of the mandible by dividing into the **maxillary** and **superficial temporal** arteries.",
  "**Branches (\"Some Anatomists Like Freaking Out Poor Medical Students\"):** Superior thyroid, Ascending pharyngeal, Lingual, Facial, Occipital, Posterior auricular, Maxillary, Superficial temporal.",
  "The ECA has branches in the neck; the ICA does not. This is how you tell them apart before ligation.",
  "**Lingual artery:** loops above the greater horn of the hyoid and runs **deep to hyoglossus**, while the hypoglossal nerve runs **on** the hyoglossus.",
  "**Facial artery:** grooves the submandibular gland, then crosses the mandible at the front of the masseter."],
  "Hypoglossal nerve crosses superficial to both carotids, looping round the occipital artery's SCM branch: protect it when ligating the ECA."),
 S("Internal carotid artery",["d142_20"],[
  "Cervical part runs up in the carotid sheath to the carotid canal, **without branches**. Then petrous, lacerum, cavernous and cerebral parts.",
  "**Behind it:** longus capitis, superior cervical ganglion, superior laryngeal nerve. **Between ICA and ECA:** styloglossus, stylopharyngeus, IX and the pharyngeal branch of X.",
  "Lies about 2.5 cm behind and lateral to the tonsil; aberrant medial loops can lie under the posterior pharyngeal wall."],
  "A pulsatile tonsil or posterior pharyngeal wall can be an aberrant ICA: do not incise it."),
 S("Veins of the neck",["s269_63","d150_36"],[
  "**IJV:** continuation of the **sigmoid sinus** at the jugular foramen; runs in the carotid sheath to join the subclavian vein behind the sternoclavicular joint (forming the brachiocephalic vein).",
  "**Tributaries:** inferior petrosal sinus, pharyngeal, common facial, lingual, superior and middle thyroid veins.",
  "**External jugular vein:** from the posterior division of the retromandibular vein and the posterior auricular vein; crosses SCM to drain into the subclavian vein.",
  "**Anterior jugular veins** join across the suprasternal space (jugular arch)."],""),
 S("Root of the neck: subclavian artery and thoracic duct",["d135_4","s270_64"],[
  "**Subclavian artery:** first part (medial to scalenus anterior) gives the **vertebral**, **internal thoracic** and **thyrocervical trunk** (inferior thyroid, transverse cervical, suprascapular); second part (behind the muscle) gives the costocervical trunk; third part (lateral) usually none.",
  "**Inferior thyroid artery** arches medially behind the carotid sheath to the back of the thyroid, crossing the RLN.",
  "**Thoracic duct** arches on the left at C7 to enter the junction of the IJV and subclavian vein.",
  "**Chassaignac's (scalenovertebral) triangle:** longus colli, scalenus anterior and subclavian artery, apex at the C6 tubercle."],
  "Milky drainage after a left neck dissection means a chyle leak from the thoracic duct."),
 S("Glossopharyngeal nerve (IX)",["d155_47"],[
  "Leaves through the jugular foramen; curves forward between the ICA and ECA on **stylopharyngeus** (its only muscle) to the tongue base.",
  "**Branches:** tympanic (Jacobson's) → lesser petrosal → parotid; carotid sinus nerve; pharyngeal (sensory to the plexus); tonsillar; lingual (taste and sensation, posterior third).",
  "Afferent limb of the **gag reflex**."],
  "Glossopharyngeal neuralgia: lancinating pain in the tonsil and ear on swallowing."),
 S("Vagus nerve (X)",["d157_50","d158_51","d158_52"],[
  "Leaves the jugular foramen with **superior and inferior ganglia**; descends in the carotid sheath behind and between the artery and vein.",
  "**Branches in the neck:** auricular (Arnold's), pharyngeal (motor to the pharyngeal plexus, soft palate except tensor), **superior laryngeal** (internal and external), cardiac branches, **recurrent laryngeal**.",
  "Right RLN hooks under the subclavian artery; left under the arch of the aorta."],
  "A high vagal lesion (above the pharyngeal branch) also paralyses the palate: the uvula deviates to the healthy side."),
 S("Accessory nerve (XI) and hypoglossal nerve (XII)",["d160_54","d161_55","s266_55"],[
  "**XI (spinal part):** from C1–C5 up through the foramen magnum and out of the jugular foramen; runs back across (usually in front of) the IJV, deep to the posterior belly of digastric, into **SCM**, then across the posterior triangle to **trapezius**.",
  "**XII:** leaves the hypoglossal canal, passes between ICA and IJV, loops round the occipital artery, crosses **superficial to the ICA and ECA** above the bifurcation, runs on hyoglossus below the lingual nerve and Wharton's duct.",
  "C1 fibres travel with XII and leave as the **superior root of the ansa cervicalis**, the nerve to thyrohyoid and geniohyoid."],
  "In level IIA dissection the accessory nerve is found where it crosses the IJV, just below the posterior belly of digastric."),
 S("Cervical plexus, ansa cervicalis and phrenic nerve",["d162_56","d128_88","d163_58"],[
  "**Cervical plexus (C1–C4):** cutaneous branches at Erb's point: **lesser occipital (C2), great auricular (C2–3), transverse cervical (C2–3), supraclavicular (C3–4)**.",
  "**Ansa cervicalis:** superior root (C1 via XII) + inferior root (C2–3); supplies the strap muscles except thyrohyoid.",
  "**Phrenic nerve (C3–C5):** runs down on **scalenus anterior** deep to the prevertebral fascia, behind the transverse cervical and suprascapular arteries."],
  "\"C3, 4, 5 keeps the diaphragm alive.\" Staying above the prevertebral fascia protects the phrenic nerve and brachial plexus in neck dissection."),
 S("Cervical sympathetic chain",["d164_59","d163_57"],[
  "Lies behind the carotid sheath on longus colli/capitis. **Superior cervical ganglion** (C2–3, largest), **middle** (C6), **inferior** (often fused with T1 as the **stellate ganglion**).",
  "Postganglionic fibres follow the ICA and ECA to the head: pupil dilator, tarsal muscle, sweat glands, blood vessels, salivary glands.",
  "Cranial parasympathetic ganglia: ciliary (III), **pterygopalatine (VII)**, **submandibular (VII)**, **otic (IX)**."],
  "Horner's syndrome (ptosis, miosis, anhidrosis, enophthalmos) can follow neck surgery or a mass compressing the chain.")
]);

R("thyroid","Thyroid & parathyroid","Lobes, capsules, relations, arteries, veins, the recurrent and external laryngeal nerves, and the parathyroid glands.",[
 S("Gross anatomy",["d128_89","d129_90","s274_71"],[
  "Two **lateral lobes** joined by the **isthmus** over **tracheal rings 2–4**. Lobes reach from the oblique line of the thyroid cartilage to about the 6th tracheal ring.",
  "**Pyramidal lobe** from the isthmus toward the hyoid in many people: a remnant of the thyroglossal duct.",
  "**Two capsules:** a **true capsule** (condensed stroma) and a **false capsule** from the pretracheal fascia. Vessels run between them.",
  "Attached to the cricoid and trachea by the **ligament of Berry**, so the gland moves with swallowing."],
  "Thyroglossal duct cysts rise on swallowing and tongue protrusion; Sistrunk's operation removes the central hyoid with the tract up to the foramen caecum."),
 S("Relations of the lateral lobe",["d130_92","d131_93"],[
  "**Anterolateral:** strap muscles (sternothyroid, sternohyoid, superior belly of omohyoid) and SCM.",
  "**Medial:** larynx, trachea, pharynx, oesophagus, the **external laryngeal nerve** above and the **recurrent laryngeal nerve** below in the tracheo-oesophageal groove.",
  "**Posterolateral:** carotid sheath.",
  "**Posterior border:** parathyroid glands and the anastomosis of superior and inferior thyroid arteries.",
  "**Tubercle of Zuckerkandl:** posterior projection of the lobe; the RLN usually runs medial (deep) to it."],
  "The RLN is most at risk where it passes under the ligament of Berry and near the tubercle of Zuckerkandl."),
 S("Arterial supply",["d129_91","d158_52"],[
  "**Superior thyroid artery** (first branch of ECA) to the upper pole, with the **external laryngeal nerve** nearby.",
  "**Inferior thyroid artery** (thyrocervical trunk) to the lower back of the lobe, **crossing the RLN** (in front, behind or between its branches).",
  "**Thyroid ima artery** in a small minority (about 3–10%), from the brachiocephalic trunk or arch, reaching the isthmus.",
  "**Cernea classification of the external laryngeal nerve:** type 1 crosses the superior thyroid artery more than 1 cm above the upper pole; type 2a less than 1 cm above; type 2b below the upper border of the pole (highest risk)."],
  "Ligate the superior pole vessels close to the gland, branch by branch, to spare the external laryngeal nerve."),
 S("Venous drainage",["d132_94"],[
  "**Superior thyroid vein** → IJV (with the artery).",
  "**Middle thyroid vein** → IJV (no accompanying artery; tie it first when mobilising the lobe).",
  "**Inferior thyroid veins** → brachiocephalic veins, forming a plexus in front of the trachea."],
  "The inferior thyroid veins in front of the trachea bleed at a low tracheostomy."),
 S("Parathyroid glands",[],[
  "Usually four, about 5 × 3 mm, yellow-brown.",
  "**Superior parathyroids** from the **4th pharyngeal pouch**: more constant, at the back of the upper lobe near the cricothyroid junction, **dorsal (posterior) to the RLN**.",
  "**Inferior parathyroids** from the **3rd pouch** (with the thymus): more variable (lower pole, thyrothymic ligament, thymus, even mediastinum), **ventral (anterior) to the RLN**.",
  "Blood supply mainly from the **inferior thyroid artery**."],
  "Because the inferior glands travel with the thymus, an ectopic inferior adenoma is often in the thymus or anterior mediastinum."),
 S("Development",[],[
  "Thyroid begins at the **foramen caecum** and descends through the **thyroglossal duct** in front of the hyoid to the neck.",
  "**C cells** (calcitonin) come from the **ultimobranchial body** of the 4th/5th pouch, so they sit mainly in the upper-middle parts of the lobes.",
  "Failure of descent gives a **lingual thyroid**; it may be the only thyroid tissue present."],
  "Check for other thyroid tissue with a scan before removing a lingual thyroid or thyroglossal cyst.")
]);

/* ===== IN THEATRE / ON IMAGING: X(region, title, figs, points, pearl) ===== */
X("temporal","On imaging",["s25_19"],[
 "**HRCT temporal bone** (axial and coronal, about 0.6 mm slices, bone window) is the standard for bony anatomy; **MRI with gadolinium** (T1, T2/CISS) shows the IAC, cochlear fluid, nerves and soft tissue.",
 "On axial CT, find in order from top: superior canal, then the IAC with the vestibule and lateral canal, then the cochlea and the tympanic facial nerve, then the jugular bulb and carotid canal.",
 "**Look for:** tegmen thickness and dehiscence, sigmoid sinus position, high or dehiscent jugular bulb, carotid canal dehiscence, superior canal dehiscence (Pöschl view)."],
 "A high-riding jugular bulb above the round window level can be injured during cochlear implantation or myringotomy.");
X("temporal","In theatre",[],[
 "Skull base approaches are planned around the **ICA, jugular bulb, facial nerve, labyrinth and dura** seen on CT.",
 "The **arcuate eminence** marks the superior canal only roughly; in the middle fossa approach the greater petrosal nerve and the IAC are safer landmarks.",
 "**Infratemporal fossa approach (Fisch A)** permanently reroutes the facial nerve anteriorly to reach the jugular foramen."],"");
X("extear","In theatre",[],[
 "**Incisions:** endaural through the incisura terminalis (no cartilage), postaural about 1 cm behind the sulcus, or transcanal.",
 "**Tympanomeatal flap** is raised from the bony canal down to the annulus; enter the middle ear posteriorly where the annulus is thickest, avoiding the chorda tympani.",
 "**Canaloplasty** widens the bony canal; protect the TMJ in front and the facial nerve and mastoid behind.",
 "**Graft materials:** temporalis fascia, tragal or conchal cartilage and perichondrium."],
 "In children, the bony canal is short and the TM more horizontal, so instruments reach the middle ear sooner than expected.");
X("extear","On imaging",[],[
 "CT shows canal stenosis, exostoses (broad-based, bilateral, cold water), osteomas (single, pedunculated) and keratosis obturans or canal cholesteatoma (bone erosion).",
 "In **malignant otitis externa**, CT shows bone erosion at the skull base; MRI shows soft tissue spread; technetium and gallium scans show activity and response."],"");
X("midear","In theatre",["s47_12"],[
 "**Cortical mastoidectomy:** drill within Macewen's triangle; the antrum lies about 1.5 cm deep. Define the tegmen above, sigmoid sinus behind, and the **lateral canal prominence** in the antrum, which marks the level of the facial nerve's second genu.",
 "**Facial nerve landmarks in the mastoid:** lateral canal, **short process of incus** (points to the facial recess), digastric ridge (points to the stylomastoid foramen).",
 "**Canal wall up vs canal wall down:** keeping the wall gives a normal canal but higher residual disease; taking it down exteriorises the attic and mastoid, needs meatoplasty and lifelong cleaning.",
 "**Posterior tympanotomy:** open the facial recess between the chorda tympani and vertical facial nerve, below the fossa incudis.",
 "**Stapes surgery:** the facial nerve lies above the oval window and may overhang it; the saccule lies about 1–2 mm below the footplate."],
 "Drill parallel to the facial nerve with a large diamond burr and plenty of irrigation; never drill across its course.");
X("midear","On imaging",["s58_26"],[
 "**HRCT** shows ossicles, scutum erosion (early attic cholesteatoma), Prussak's space, tegmen and lateral canal fistula.",
 "**Non-EPI diffusion-weighted MRI** shows cholesteatoma as a bright spot; used to find residual or recurrent disease instead of second-look surgery.",
 "Opacified middle ear on CT does not distinguish fluid, granulation and cholesteatoma; bone erosion and the DWI signal do."],"");
X("inner","On imaging",["s65_1"],[
 "**CT:** bony labyrinth malformations (Mondini/IP-II, common cavity), enlarged vestibular aqueduct (over 1.5 mm at the midpoint), otosclerosis (lucency in front of the oval window: fissula ante fenestram), cochlear ossification after meningitis.",
 "**MRI (T2/CISS):** fluid signal in the cochlea (patency before implantation), cochlear nerve size in the IAC, vestibular schwannoma (enhancing on T1 with gadolinium).",
 "Cochlear ossification after meningitis can start within weeks, so implant early."],
 "Enlarged vestibular aqueduct is the commonest inner ear anomaly on imaging in children with sensorineural loss; avoid head trauma and contact sports.");
X("inner","In theatre",[],[
 "**Cochlear implantation:** mastoidectomy → posterior tympanotomy → round window or cochleostomy anteroinferior to it → electrode into the scala tympani.",
 "**Translabyrinthine approach:** removes the labyrinth to reach the IAC and CPA; hearing is sacrificed; Bill's bar identifies the facial nerve at the fundus.",
 "**Labyrinthectomy and vestibular neurectomy** for intractable vertigo; the singular nerve supplies the posterior canal (singular neurectomy for BPPV, rarely done)."],"");
X("facial","On imaging",[],[
 "**HRCT:** bony canal, dehiscence, fractures (longitudinal fractures injure the nerve near the geniculate ganglion; transverse fractures more often cause palsy).",
 "**MRI with gadolinium:** enhancement of the labyrinthine segment and geniculate ganglion in Bell's palsy and Ramsay Hunt; schwannomas, haemangiomas and perineural spread of parotid cancer.",
 "Imaging is needed for palsy that is gradual, recurrent, painful, with other cranial nerve signs, or not recovering after 3–6 months."],"");
X("facial","In theatre",[],[
 "**Intraoperative monitoring** with EMG electrodes in orbicularis oculi and oris is routine in otology and parotid surgery; it does not replace anatomical knowledge.",
 "**Decompression** for trauma or Bell's palsy targets the labyrinthine segment and meatal foramen (middle fossa approach) when electroneurography shows over 90% degeneration within 2 weeks.",
 "**Repair:** direct tension-free neurorrhaphy, or a great auricular or sural nerve cable graft; hypoglossal–facial or masseteric–facial transfer when the proximal stump is unavailable."],"");
X("nose","In theatre",["s119_77"],[
 "**Septoplasty:** Killian's incision 1 cm behind the caudal edge, or hemitransfixion for caudal deviations; elevate the mucoperichondrial flap; keep a 1 cm dorsal and caudal L-strut.",
 "**Inferior turbinate reduction:** submucosal, keeping mucosa; avoid the lateral wall where the nasolacrimal duct opens.",
 "**Sphenopalatine artery ligation:** raise a mucosal flap behind the middle turbinate's posterior attachment; the **crista ethmoidalis** marks the foramen; the artery often branches before exiting.",
 "**Anterior ethmoidal artery** ligation is done externally (Lynch incision) or endoscopically at the ethmoid roof."],
 "Septal haematoma must be drained urgently: the cartilage depends on the perichondrium for its blood supply and can necrose into a saddle nose.");
X("nose","On imaging",[],[
 "**CT coronal** shows the septum, turbinates, concha bullosa and the osteomeatal complex. **MRI** separates tumour from retained secretions.",
 "Nasal bone fractures are a clinical diagnosis; X-rays add little."],"");
X("sinus","In theatre",["s139_18","s144_31"],[
 "**FESS steps:** uncinectomy → maxillary antrostomy (enlarge the natural ostium posteriorly and inferiorly) → bulla ethmoidalis → basal lamella → posterior ethmoids → sphenoidotomy → frontal recess.",
 "**Find the skull base** in the posterior ethmoid or sphenoid where it is highest and work from posterior to anterior; at the roof stay lateral (fovea ethmoidalis) and avoid instrumenting medially toward the lateral lamella of the cribriform plate.",
 "**Sphenoid ostium:** medial to the superior turbinate, about 1–1.5 cm above the choana, at about 30° from the nasal floor; enter low and medial.",
 "**Frontal recess:** remove the agger nasi and frontal cells; the anterior ethmoidal artery sits behind the frontal recess at the skull base.",
 "**Dangers:** orbit (lamina papyracea), anterior ethmoidal artery, skull base (lateral lamella, Keros III), optic nerve and ICA (sphenoid lateral wall, Onodi cell)."],
 "Use the CLOSE checklist on the CT before FESS: Cribriform plate (Keros), Lamina papyracea, Onodi cell, Sphenoid (pneumatisation, septum on ICA), Ethmoidal artery.");
X("sinus","On imaging",["s139_19","s140_22","s147_43"],[
 "**Non-contrast CT sinus**, coronal, axial and sagittal, bone window, is the roadmap for surgery; scan after medical treatment.",
 "**Lund–Mackay score:** each sinus 0 (clear), 1 (partial), 2 (complete); OMC 0 or 2; total out of 24.",
 "**MRI** for suspected tumour, fungal disease (signal void on T2), and intracranial or orbital spread.",
 "Fungal ball: dense calcified focus in a single sinus, usually the maxillary. Allergic fungal sinusitis: expanded sinuses with hyperdense, heterogeneous contents."],"");
X("oral","In theatre",[],[
 "**Access:** transoral for small tumours; lip split with mandibulotomy (paramedian, in front of the mental foramen) or a visor flap for larger ones.",
 "**Margins:** aim for about 1 cm clinically (5 mm histologically); depth of invasion drives elective neck dissection (over about 3–4 mm).",
 "**Mandible:** marginal mandibulectomy when tumour abuts but does not invade bone; segmental when the medulla is invaded.",
 "Protect the **lingual nerve** and **Wharton's duct** in the floor of the mouth; the hypoglossal nerve lies deeper on hyoglossus."],"");
X("oral","On imaging",[],[
 "**MRI** shows tongue and floor of mouth tumour depth and spread across the midline; **CT** and **OPG** show mandibular invasion.",
 "**Ranula:** a plunging ranula has a tail through or behind the mylohyoid into the submandibular space."],"");
X("salivary","On imaging",[],[
 "**Ultrasound** is first line: shows stones, cysts, solid lesions and nodes, and guides FNA.",
 "**MRI:** deep lobe extension, perineural spread along VII and V3, and malignancy features (low T2, ill-defined margins). Pleomorphic adenoma is very bright on T2.",
 "**Sialography and sialendoscopy** for ductal stones and strictures. Warthin's tumour is hot on technetium scanning."],"");
X("salivary","In theatre",["s188_56"],[
 "**Superficial parotidectomy:** modified Blair (lazy-S) incision → skin flap above the parotid fascia → separate from the SCM and the cartilage of the EAC → identify the trunk with at least two landmarks → dissect along the nerve to remove the superficial lobe.",
 "**Extracapsular dissection** for small, mobile, superficial benign tumours.",
 "**Great auricular nerve:** keep its posterior branch if possible to reduce ear lobe numbness.",
 "**Submandibular gland excision:** incision two finger-breadths below the mandible, raise subplatysmal flap below the investing fascia over the gland (protecting the marginal mandibular nerve), ligate the facial artery and vein, identify the lingual nerve and divide the ganglion, then the duct; keep the hypoglossal nerve below."],
 "Enucleation of a pleomorphic adenoma leaves pseudopod extensions behind and causes multifocal recurrence.");
X("pharynx","In theatre",["s216_38","s219_42"],[
 "**Tonsillectomy:** grasp the tonsil, incise the anterior pillar mucosa, find the capsule and stay on it; the paratonsillar vein runs in the bed; the lower pole connects to the lingual tonsil.",
 "**Adenoidectomy:** check for a submucous cleft first; avoid the torus tubarius laterally (stenosis of the ET opening).",
 "**Quinsy drainage:** incise at the point of maximal bulge, or where a horizontal line from the base of the uvula meets a vertical line from the anterior pillar; avoid going lateral (ICA).",
 "**Rigid oesophagoscopy:** risk of perforation at Killian's dehiscence; neck extension and a well-lubricated scope.",
 "**Endoscopic stapling of a pharyngeal pouch** divides the party wall (cricopharyngeus)."],
 "A pulsating peritonsillar swelling may be an aberrant ICA or aneurysm; aspirate before incising.");
X("pharynx","On imaging",["s199_5"],[
 "**Lateral neck X-ray:** prevertebral soft tissue at C2 normally under about 7 mm, at C6 under about 22 mm in adults (14 mm in children).",
 "**CT with contrast** for deep neck abscess: rim-enhancing collection; distinguishes abscess from phlegmon.",
 "**Parapharyngeal tumours:** prestyloid lesions push the fat medially and the ICA backward; poststyloid lesions push the ICA forward.",
 "**Barium swallow** shows a pouch at the back of the pharyngo-oesophageal junction and webs (Plummer–Vinson)."],"");
X("larynx","In theatre",[],[
 "**Cricothyroidotomy:** palpate the cricothyroid membrane, transverse stab incision in its lower part (cricothyroid arteries run along the upper border), dilate, insert a 6.0 tube.",
 "**Tracheostomy:** horizontal incision midway between cricoid and sternal notch, divide in the midline between the strap muscles, clamp or divide the isthmus, enter rings 2–4. Avoid ring 1 (subglottic stenosis) and going low (innominate artery).",
 "**Microlaryngoscopy:** stay superficial to the vocal ligament; preserve the anterior commissure mucosa on at least one side to avoid web formation.",
 "**Laryngectomy:** removes the hyoid to the upper tracheal rings; the internal laryngeal and superior laryngeal vessels are ligated at the thyrohyoid membrane; recurrent nerves are sacrificed."],
 "Children's anatomy: the cricothyroid membrane is tiny and the larynx high, so needle cricothyroidotomy is used under about 10–12 years.");
X("larynx","On imaging",["s245_26"],[
 "**CT with contrast** stages laryngeal cancer: look at the pre-epiglottic fat, paraglottic fat, cartilage erosion and extralaryngeal spread.",
 "**MRI** is more sensitive for cartilage invasion but more prone to false positives from inflammation.",
 "**Sclerosis of the arytenoid or cricoid** next to a tumour suggests invasion; ossification is irregular normally, so read with care.",
 "Normal **paraglottic fat** at the level of the false cords disappears at the true cord level, where muscle takes its place."],"");
X("neck","In theatre",["s286_80"],[
 "**Neck dissection landmarks:** marginal mandibular nerve (below the mandible), posterior belly of digastric (the \"resident's friend\": everything important lies deep to it), accessory nerve at the IJV and in the posterior triangle, hypoglossal nerve above the bifurcation, vagus in the sheath, phrenic and brachial plexus under the prevertebral fascia, thoracic duct on the left low neck.",
 "Stay above the **prevertebral fascia** to protect the phrenic nerve and brachial plexus.",
 "**Level IIB** dissection risks the accessory nerve; levels IIB and V are often omitted in node-negative necks.",
 "**Deep neck abscess drainage:** approach along the anterior border of SCM; the carotid sheath lies deep."],
 "Chyle leak: low-fat diet and pressure first; re-explore if over about 500 mL a day or persisting.");
X("neck","On imaging",[],[
 "**Ultrasound** with FNA is first line for neck lumps; normal nodes are oval with a fatty hilum; round, hilum-less, necrotic or calcified nodes are suspicious.",
 "**CT/MRI node criteria:** short axis over about 10 mm (11 mm at jugulodigastric), central necrosis, extranodal extension.",
 "**PET-CT** for unknown primary and recurrence; FDG uptake in Waldeyer's ring is normal."],"");
X("vessels","In theatre",[],[
 "**ECA ligation:** confirm branches before tying; tie above the superior thyroid artery.",
 "**Carotid body tumour:** Shamblin I (small, localised, minimal vessel attachment), II (partly surrounds the vessels), III (encases them); risk to X and XII rises with grade.",
 "**IJV ligation:** one side is safe; bilateral simultaneous ligation risks facial and cerebral oedema, so stage it.",
 "**Accessory nerve** at level II: usually lateral (superficial) to the IJV, occasionally medial or through it."],"");
X("vessels","On imaging",[],[
 "**CT/MR angiography:** carotid body tumours splay the ICA and ECA (lyre sign); glomus vagale pushes both forward without splaying.",
 "**Doppler ultrasound** for carotid disease and IJV thrombosis (Lemierre's syndrome after pharyngitis)."],"");
X("thyroid","In theatre",["d158_52"],[
 "**Order:** collar incision → subplatysmal flaps → split strap muscles in the midline → ligate the middle thyroid vein → superior pole vessels close to the gland (spare the external laryngeal nerve) → find the RLN (inferior thyroid artery crossing, tracheo-oesophageal groove, or Zuckerkandl's tubercle) → preserve parathyroids on their blood supply → divide Berry's ligament carefully.",
 "**RLN identification approaches:** lateral (at the inferior thyroid artery), inferior (in the tracheo-oesophageal groove, at Simon's triangle), superior (at its laryngeal entry).",
 "**Nerve monitoring** confirms function; loss of signal on the first side may justify staging the second side."],
 "Bilateral RLN palsy after total thyroidectomy causes stridor at extubation because both cords lie paramedian.");
X("thyroid","On imaging",[],[
 "**Ultrasound** grades nodules (e.g. TI-RADS): suspicious features are solid hypoechoic, taller-than-wide, irregular margins, microcalcification, extrathyroidal extension.",
 "**Radionuclide scan:** hot nodules are rarely malignant; useful when TSH is low.",
 "**Parathyroid localisation:** sestamibi scan and ultrasound; 4D-CT when they disagree."],"");
X("et","In theatre",[],[
 "**Grommet insertion:** radial incision in the anteroinferior quadrant (away from the ossicles and with the best view).",
 "**Balloon dilation** of the cartilaginous ET for chronic obstructive dysfunction; stay medial in the tube and do not reach the bony part (the ICA canal lies close to it).",
 "**Adenoidectomy** for recurrent otitis media in children over about 2 years removes a bacterial reservoir next to the tube opening."],
 "The ICA lies just medial to the bony ET and may be dehiscent: never force an instrument into the bony isthmus.");
X("et","On imaging",[],[
 "The ET is not routinely imaged; **CT** shows the bony part and a patulous tube (air-filled cartilaginous lumen).",
 "**MRI** of the nasopharynx is the key test when a unilateral middle ear effusion suggests a tumour blocking the tube."],"");
X("orbit","On imaging",[],[
 "**CT with contrast** for orbital complications: subperiosteal abscess is a lentiform collection against the lamina papyracea with displaced medial rectus.",
 "**MRI or CT venography** for cavernous sinus thrombosis: enlarged, non-enhancing sinus and dilated superior ophthalmic vein."],"");
X("orbit","In theatre",[],[
 "**Subperiosteal abscess:** drain endoscopically through the lamina papyracea after ethmoidectomy, or externally via a Lynch incision.",
 "**Lateral canthotomy and cantholysis** for orbital compartment syndrome: cut the lateral canthus, then the inferior crus of the lateral canthal tendon.",
 "**Endoscopic orbital decompression** removes the lamina papyracea and medial orbital floor (thyroid eye disease); keep a strut between the frontal recess and orbit."],"");
X("itf","On imaging",[],[
 "Fat planes in the infratemporal fossa and around the pterygoid muscles are lost early with tumour invasion; **MRI** shows perineural spread along V3 through the foramen ovale (enlarged foramen, enhancement).",
 "**TMJ MRI** shows disc position (anterior displacement with or without reduction)."],"");
X("itf","In theatre",[],[
 "**Approaches:** transmandibular, postauricular infratemporal fossa approach (Fisch types A–C), preauricular subtemporal–infratemporal approach, transmaxillary, and endoscopic transpterygoid through the back wall of the maxillary sinus.",
 "Ligate the **maxillary artery** early when resecting tumours here; the pterygoid plexus bleeds freely."],"");
X("trigeminal","On imaging",[],[

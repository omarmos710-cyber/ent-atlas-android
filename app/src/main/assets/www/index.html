 "**MRI with gadolinium** follows the nerve from the pons through Meckel's cave and the foramina: perineural tumour spread (adenoid cystic carcinoma, cutaneous SCC) enlarges and enhances the nerve and widens the foramen.",
 "**MRI CISS/FIESTA** shows vascular loops at the root entry zone in trigeminal neuralgia."],"");

/* ===== FLASHCARDS: C(region, question, answer) ===== */
C("temporal","Name the five parts of the temporal bone.","Squamous, petrous, mastoid, tympanic and styloid process.");
C("temporal","What is the keel of the temporal bone and what passes through it?","The caroticojugular crest between the carotid canal and jugular fossa; the tympanic canaliculus in it carries Jacobson's nerve (IX).");
C("temporal","Contents of the foramen ovale?","MALE: Mandibular nerve, Accessory meningeal artery, Lesser petrosal nerve, Emissary vein.");
C("temporal","Contents of the jugular foramen?","IX, X, XI, the IJV (from the sigmoid sinus) and the inferior petrosal sinus.");
C("temporal","Triad of Gradenigo's syndrome?","Ear discharge, retro-orbital pain (V) and lateral rectus palsy (VI) from petrous apicitis.");
C("temporal","Which cranial nerves are involved in Vernet, Collet–Sicard and Villaret syndromes?","Vernet IX–XI; Collet–Sicard IX–XII; Villaret IX–XII plus cervical sympathetic (Horner's).");
C("temporal","Three muscles and two ligaments attached to the styloid process?","Stylohyoid, styloglossus, stylopharyngeus; stylohyoid and stylomandibular ligaments.");
C("temporal","Through which fissure does the chorda tympani leave the skull?","Petrotympanic (Glaserian) fissure.");
C("extear","Length of the EAC and the proportion that is cartilaginous?","24 mm; outer third (8 mm) cartilaginous, inner two-thirds (16 mm) bony.");
C("extear","Where are wax glands and hair found in the EAC?","Only in the cartilaginous outer third.");
C("extear","What are the fissures of Santorini and the foramen of Huschke?","Fissures in the cartilaginous canal floor, and a developmental defect in the anteroinferior bony canal; both let infection or tumour pass to the parotid/TMJ region.");
C("extear","What is Hitselberger's sign?","Hypoaesthesia of the posterior meatal wall from pressure on facial nerve sensory fibres, as in acoustic neuroma.");
C("extear","Which nerve causes the cough reflex when cleaning the ear?","Arnold's nerve, the auricular branch of the vagus.");
C("extear","Dimensions and angle of the tympanic membrane?","9–10 mm high, 8–9 mm wide, 0.1 mm thick; 55° to the canal floor.");
C("extear","Boundaries of the pars flaccida?","Above the lateral process of malleus, between the anterior and posterior malleal folds and the notch of Rivinus.");
C("extear","Three layers of the tympanic membrane?","Outer epithelium, middle fibrous layer (radial, circular, parabolic fibres), inner mucosa.");
C("midear","What lies on the medial wall of the middle ear?","Promontory, oval window, round window, horizontal facial canal, lateral SCC prominence, processus cochleariformis.");
C("midear","Boundaries of the facial recess?","Medial: vertical facial nerve. Lateral: chorda tympani and annulus. Superior: fossa incudis.");
C("midear","Why is residual cholesteatoma common in the sinus tympani?","It lies medial to the facial nerve and pyramid and is hidden from both the canal and mastoid views.");
C("midear","Nerve supply and action of tensor tympani and stapedius?","Tensor tympani: V3, tenses the TM. Stapedius: nerve to stapedius (VII), dampens stapes movement.");
C("midear","Route of the chorda tympani in the middle ear?","Enters through the posterior canaliculus, crosses the medial TM between the malleus handle and long process of incus, leaves through the petrotympanic fissure.");
C("midear","Boundaries of Prussak's space?","Lateral: pars flaccida. Medial: neck of malleus. Floor: lateral process of malleus. Roof: lateral malleal ligament.");
C("midear","Boundaries of Macewen's triangle?","Temporal line above, posterosuperior canal margin (spine of Henle) in front, tangent to the posterior canal wall behind. Antrum lies about 1.5 cm deep.");
C("midear","What is Körner's septum?","Persistent petrosquamous plate separating superficial squamous from deep petrous mastoid cells; can hide the antrum.");
C("midear","Main arteries of the middle ear?","Anterior tympanic (maxillary) and stylomastoid (posterior auricular).");
C("midear","Secretomotor pathway to the parotid?","Inferior salivatory nucleus → IX → Jacobson's nerve → tympanic plexus → lesser petrosal → otic ganglion → auriculotemporal → parotid.");
C("inner","How many turns does the cochlea make?","2.5 to 2.75 turns around the modiolus.");
C("inner","How many openings do the semicircular canals have into the vestibule?","Five: three ampullated ends, the non-ampullated lateral canal end and the crus commune.");
C("inner","Ionic composition of endolymph and perilymph?","Endolymph: high K+ (~150), low Na+. Perilymph: high Na+, low K+.");
C("inner","Which structure secretes endolymph?","Stria vascularis (and dark cells of the vestibule).");
C("inner","Inner vs outer hair cells: innervation and number?","IHC ~3,500 in one row, 95% of afferents. OHC ~12,000 in 3–4 rows, mainly efferent; generate OAEs.");
C("inner","Where are high frequencies coded on the basilar membrane?","At the base (narrow, stiff); low frequencies at the apex.");
C("inner","What do the cristae and maculae detect?","Cristae: angular acceleration. Maculae of utricle and saccule: linear acceleration and gravity.");
C("inner","Arrangement of nerves at the IAC fundus?","Facial anterosuperior, superior vestibular posterosuperior, cochlear anteroinferior, inferior vestibular posteroinferior. Bill's bar separates the upper two.");
C("inner","Blood supply of the labyrinth?","Labyrinthine artery, usually from AICA; an end artery.");
C("inner","List the central auditory pathway.","Cochlear nerve → cochlear nuclei → superior olivary complex → lateral lemniscus → inferior colliculus → medial geniculate body → auditory cortex (area 41).");
C("facial","Narrowest segment of the fallopian canal?","Labyrinthine segment (~0.68 mm).");
C("facial","Which segment of the facial nerve is most often dehiscent?","Tympanic (horizontal) segment above the oval window.");
C("facial","Branches of the facial nerve inside the temporal bone?","Greater petrosal, nerve to stapedius, chorda tympani.");
C("facial","Depth of the facial nerve trunk below the tympanomastoid suture?","6–8 mm.");
C("facial","Where does the nerve lie relative to the tragal pointer?","About 1–1.5 cm deep, medial and inferior to its tip.");
C("facial","Which House–Brackmann grade first has incomplete eye closure?","Grade IV.");
C("facial","Five terminal branches of the facial nerve?","Temporal, zygomatic, buccal, marginal mandibular, cervical.");
C("nose","What is the narrowest part of the nasal airway?","The internal nasal valve (bounded by the limen nasi, septum, inferior turbinate head and floor).");
C("nose","Which sinuses drain into the middle meatus?","Frontal, maxillary and anterior ethmoid.");
C("nose","Where does the nasolacrimal duct open?","Anterior part of the inferior meatus, guarded by Hasner's valve.");
C("nose","Four arteries forming Kiesselbach's plexus?","Anterior ethmoidal, sphenopalatine (septal branch), greater palatine and superior labial.");
C("nose","Main components of the bony and cartilaginous septum?","Quadrilateral cartilage, perpendicular plate of ethmoid and vomer.");
C("nose","Three attachments of the middle turbinate basal lamella?","Anterior third to the cribriform plate, middle third to the lamina papyracea, posterior third to the lateral nasal wall.");
C("nose","What forms the vidian nerve?","Greater petrosal (parasympathetic) plus deep petrosal (sympathetic).");
C("nose","What is the hiatus semilunaris?","The 2D gap between the free edge of the uncinate process and the bulla ethmoidalis, leading into the ethmoidal infundibulum.");
C("sinus","Order of sinus development?","Maxillary and ethmoid present at birth; sphenoid appears around 3–6 years; frontal is last.");
C("sinus","Which teeth lie in the floor of the maxillary sinus?","Molars and the second premolar (sometimes the first premolar).");
C("sinus","Keros types by olfactory fossa depth?","I 1–3 mm, II 4–7 mm, III 8–16 mm (highest risk).");
C("sinus","What is an Onodi cell and why does it matter?","A posterior ethmoid cell lateral or above the sphenoid; the optic nerve may run in its wall.");
C("sinus","What is a Haller cell?","An infraorbital ethmoid cell along the orbital floor that can narrow the maxillary infundibulum.");
C("sinus","Structures in the lateral wall of the sphenoid sinus?","Optic nerve, ICA (with the opticocarotid recess), cavernous sinus with III, IV, V1, V2, VI.");
C("sinus","Commonest type of sphenoid pneumatisation?","Sellar (about 80%).");
C("sinus","Risk from cutting the anterior ethmoidal artery?","It retracts into the orbit causing an orbital haematoma; treat with lateral canthotomy.");
C("sinus","Contents of the pterygopalatine fossa?","Third part of the maxillary artery, maxillary nerve and pterygopalatine ganglion.");
C("oral","Boundaries of the oral cavity?","From the lips to the junction of hard and soft palate above and the circumvallate papillae below.");
C("oral","Which extrinsic tongue muscle is not supplied by XII?","Palatoglossus (vagus via the pharyngeal plexus).");
C("oral","Sensation and taste of the anterior two-thirds of the tongue?","Sensation: lingual nerve (V3). Taste: chorda tympani (VII).");
C("oral","Lymphatic drainage of the tongue tip?","Submental nodes (level IA).");
C("oral","Which soft palate muscle is supplied by V3?","Tensor veli palatini.");
C("oral","Attachments of the pterygomandibular raphe?","Pterygoid hamulus to the mylohyoid line; buccinator in front, superior constrictor behind.");
C("salivary","Where does the parotid duct open?","Opposite the upper second molar.");
C("salivary","Order of structures within the parotid, superficial to deep?","Facial nerve, retromandibular vein, external carotid artery.");
C("salivary","Which salivary gland produces most saliva at rest?","Submandibular (about 70%).");
C("salivary","What is Frey syndrome?","Gustatory sweating after parotidectomy from regrowth of parasympathetic fibres into sweat glands.");
C("salivary","Relation of the lingual nerve to Wharton's duct?","It hooks under the duct from lateral to medial.");
C("salivary","Nerve at risk with the incision for submandibular gland excision?","Marginal mandibular branch of the facial nerve.");
C("salivary","Which salivary gland contains lymph nodes?","Parotid (encapsulates late).");
C("pharynx","Which pharyngeal muscle is not supplied by the vagus?","Stylopharyngeus (IX).");
C("pharynx","Where is Killian's dehiscence?","Between thyropharyngeus and cricopharyngeus, posteriorly.");
C("pharynx","Structures passing through the sinus of Morgagni?","Eustachian tube, levator veli palatini, ascending palatine artery.");
C("pharynx","Commonest site of nasopharyngeal carcinoma?","Fossa of Rosenmüller.");
C("pharynx","Main artery of the palatine tonsil?","Tonsillar branch of the facial artery.");
C("pharynx","Usual source of primary bleeding at tonsillectomy?","The paratonsillar (external palatine) vein. Secondary bleeding (days 5–10) is due to infection of the fossa.");
C("pharynx","Three subsites of the hypopharynx?","Piriform sinus, postcricoid region, posterior pharyngeal wall.");
C("pharynx","Constrictions of the oesophagus and distances from the incisors?","Cricopharyngeus 15 cm, aortic arch 22 cm, left main bronchus 25 cm, diaphragm 40 cm.");
C("pharynx","Contents of the poststyloid parapharyngeal space?","ICA, IJV, IX–XII, sympathetic chain and lymph nodes.");
C("larynx","Which intrinsic laryngeal muscle is the only abductor?","Posterior cricoarytenoid (PCA), supplied by the recurrent laryngeal nerve.");
C("larynx","Which intrinsic laryngeal muscle is NOT supplied by the RLN?","Cricothyroid, supplied by the external branch of the superior laryngeal nerve.");
C("larynx","Which intrinsic laryngeal muscle is unpaired and bilaterally innervated?","Transverse arytenoid (part of the interarytenoid; the oblique arytenoids are paired).");
C("larynx","What pierces the thyrohyoid membrane?","Internal branch of the superior laryngeal nerve and the superior laryngeal artery (and vein).");
C("larynx","Narrowest part of the infant airway?","The subglottis at the cricoid ring (in adults it is the glottis).");
C("larynx","Vertebral level of the larynx in infants vs adults?","Infant C3–C4; adult lower border of cricoid at C6.");
C("larynx","Which cartilage forms the only complete ring in the airway?","The cricoid cartilage.");
C("larynx","What is Reinke's space?","The superficial layer of the lamina propria of the vocal fold.");
C("larynx","Three lymphatic groups draining the subglottis?","Prelaryngeal (Delphian), pretracheal and paratracheal nodes (level VI).");
C("larynx","Non-recurrent laryngeal nerve: side and associated anomaly?","Right side; aberrant right subclavian artery (arteria lusoria). Incidence ~0.5–1%.");
C("larynx","Boundaries of the pre-epiglottic space?","Roof: hyoepiglottic ligament. Front: thyrohyoid membrane and thyroid cartilage. Back: epiglottis.");
C("larynx","Which laryngeal cartilages are elastic rather than hyaline?","Epiglottis, corniculate, cuneiform, and the apex and vocal process of the arytenoid.");
C("larynx","Length of the rima glottidis in men and women?","About 24 mm in men and 16 mm in women.");
C("larynx","What is the conus elasticus?","The paired cricovocal membranes; free upper edge is the vocal ligament, anterior thick part the median cricothyroid ligament.");
C("larynx","Where is the carina and how long is the trachea?","Carina at T5; trachea 10–12 cm with 16–20 C-shaped rings.");
C("neck","Contents of the carotid sheath?","Common/internal carotid artery, IJV and vagus nerve.");
C("neck","What is Erb's point?","Junction of upper and middle thirds of the posterior border of SCM, where XI and the cutaneous cervical plexus branches emerge.");
C("neck","Boundaries of the posterior triangle?","SCM in front, trapezius behind, middle third of the clavicle below.");
C("neck","Which structures does the investing layer enclose?","Two muscles (SCM, trapezius) and two glands (parotid, submandibular).");
C("neck","Boundaries of level II and how is it divided?","Skull base to hyoid; IIA in front of the accessory nerve, IIB behind it.");
C("neck","Where is level VI?","Hyoid to suprasternal notch, between the carotid arteries.");
C("neck","What is the danger space?","Between alar and prevertebral fascia, skull base to diaphragm.");
C("neck","Levels removed in a supraomohyoid neck dissection?","I–III.");
C("neck","What is Ho's triangle?","Supraclavicular area; nodes here mean advanced nasopharyngeal carcinoma.");
C("vessels","Level of the carotid bifurcation?","Upper border of the thyroid cartilage (C3–C4).");
C("vessels","Branches of the external carotid artery in order?","Superior thyroid, ascending pharyngeal, lingual, facial, occipital, posterior auricular, maxillary, superficial temporal.");
C("vessels","How do you tell the ICA from the ECA in the neck?","The ICA has no branches in the neck; the ECA does.");
C("vessels","Nerve supply of the carotid sinus and body?","Glossopharyngeal nerve (nerve of Hering).");
C("vessels","Relation of the lingual artery and hypoglossal nerve to hyoglossus?","Artery deep to hyoglossus; nerve on its surface.");
C("vessels","Roots of the ansa cervicalis?","Superior root C1 (travelling with XII), inferior root C2–C3.");
C("vessels","Roots and course of the phrenic nerve in the neck?","C3–C5, on scalenus anterior deep to the prevertebral fascia.");
C("vessels","Where does the thoracic duct end?","Junction of the left IJV and subclavian vein.");
C("thyroid","Which tracheal rings lie behind the thyroid isthmus?","Rings 2–4.");
C("thyroid","Which thyroid vein has no accompanying artery?","Middle thyroid vein, draining to the IJV.");
C("thyroid","Origin of the superior and inferior parathyroids?","Superior from the 4th pouch, inferior from the 3rd pouch with the thymus.");
C("thyroid","Relation of superior and inferior parathyroids to the RLN?","Superior dorsal to the nerve; inferior ventral to it.");
C("thyroid","Cernea type at highest risk of external laryngeal nerve injury?","Type 2b: crosses below the upper border of the superior pole.");
C("thyroid","What is the ligament of Berry?","Posterior suspensory ligament fixing the thyroid to the cricoid and upper trachea; the RLN passes close to it.");
C("thyroid","Main blood supply of the parathyroids?","Inferior thyroid artery.");

/* ===== MORE FLASHCARDS ===== */
// temporal
C("temporal","What lies medially on the anterior surface of the petrous bone?","The arcuate eminence, raised by the superior semicircular canal.");
C("temporal","Where is the trigeminal impression?","At the apex of the anterior petrous surface, for the trigeminal ganglion in Meckel's cave.");
C("temporal","Which petrous surface carries the internal acoustic meatus?","The posterior surface (front of the posterior cranial fossa).");
C("temporal","What is the subarcuate fossa?","Depression superolateral to the IAM, under the arcuate eminence, carrying the subarcuate artery.");
C("temporal","Where does the cochlear aqueduct open externally?","At the upper limit of the jugular foramen on the inferior petrous surface.");
C("temporal","Which part of the temporal bone forms most of the bony EAC?","The tympanic part (the squamous part forms its roof).");
C("temporal","Two sutures in the bony EAC?","Tympanosquamous in front, tympanomastoid behind.");
C("temporal","Where does the posterior belly of digastric arise?","Digastric groove (mastoid notch) on the medial side of the mastoid.");
C("temporal","Contents of the internal acoustic meatus?","Facial nerve, nervus intermedius, vestibulocochlear nerve, labyrinthine artery and vein.");
C("temporal","Boundaries of the pterygopalatine fossa?","Roof: sphenoid body. Front: maxilla. Back: pterygoid plates. Medial: perpendicular plate of palatine.");
C("temporal","What passes through the foramen lacerum in life?","Only small structures pass through its cartilage (meningeal branch of ascending pharyngeal artery, emissary veins); the ICA crosses its upper part and the vidian nerve forms there.");
C("temporal","What separates the middle from the posterior cranial fossa?","The petrous ridge of the temporal bone (with the tentorium attached).");
// extear
C("extear","What is the incisura terminalis?","The cartilage-free gap between the tragus and crus of the helix, used for endaural incisions.");
C("extear","Direction of the cartilaginous and bony EAC?","Cartilaginous: up, back and in. Bony: down, forward and in.");
C("extear","How do you straighten the canal in adults and infants?","Adults: pull the pinna up and back. Infants: down and back.");
C("extear","What is the isthmus of the EAC?","The narrowest part of the bony canal, about 6 mm lateral to the TM.");
C("extear","What is the anterior recess of the EAC?","A dip in the anteroinferior bony canal medial to the isthmus where debris and foreign bodies collect.");
C("extear","Lymph drainage of the tragus and front of auricle?","Preauricular (parotid) nodes.");
C("extear","Lymph drainage of the lobule?","Infra-auricular nodes, then the upper deep cervical chain.");
C("extear","Which part of the TM lacks an annulus?","The pars flaccida (at the notch of Rivinus).");
C("extear","What is the umbo?","The point of maximal inward tenting of the TM at the tip of the malleus handle.");
C("extear","Which middle ear structures can be seen through a normal TM?","Long process of incus, incudostapedial joint, round window niche, ET opening, sometimes the chorda tympani.");
C("extear","Direction of skin migration in the EAC?","From the TM outward (medial to lateral), making the canal self-cleaning.");
C("extear","What is the pH of cerumen?","Slightly acidic, about 6.0–6.5.");
// midear
C("midear","Volume of the tympanic cavity?","About 1–2 cm³ (the whole cleft is larger, depending on mastoid pneumatisation).");
C("midear","Which part of the middle ear lies above the pars tensa?","Epitympanum (attic).");
C("midear","What is the scutum?","The bony lateral wall of the attic, above the TM; eroded early in attic cholesteatoma.");
C("midear","What forms the floor of the middle ear?","A thin plate of bone over the jugular bulb (may be dehiscent).");
C("midear","What lies in the anterior wall of the middle ear?","ET opening, canal for tensor tympani above it, anterior canaliculus for chorda tympani, and the carotid canal behind thin bone.");
C("midear","What is the processus cochleariformis?","Hook of bone in front of the oval window around which the tensor tympani tendon turns; a landmark for the facial nerve.");
C("midear","Size of the malleus and stapes?","Malleus about 8 mm (largest); stapes about 3.5 mm (smallest bone in the body).");
C("midear","Which arch forms the stapes superstructure?","The 2nd arch.");
C("midear","Pressure gain of the middle ear transformer?","About 22 times (area ratio ~17:1 × lever ~1.3:1), roughly 25–30 dB.");
C("midear","Where does the chorda tympani leave the middle ear?","Through the petrotympanic (Glaserian) fissure.");
C("midear","What is the commonest mastoid type?","Cellular (well pneumatised), about 80%.");
C("midear","Which mastoid cells connect to the petrous apex?","Peritubal and hypotympanic cells, and perilabyrinthine cells.");
C("midear","What is the depth of the antrum below Macewen's triangle?","About 1.5 cm in adults.");
C("midear","What does the lateral canal prominence mark during mastoidectomy?","The level of the facial nerve's second genu, just below and in front of it.");
C("midear","Two compartments of the attic?","A small anterior and a large posterior compartment, separated by the superior malleal fold.");
// et
C("et","Length of the adult Eustachian tube and its parts?","About 36 mm: bony third (12 mm) posterolateral, cartilaginous two-thirds (24 mm) anteromedial.");
C("et","Narrowest part of the Eustachian tube?","The isthmus, where the bony and cartilaginous parts meet.");
C("et","Main muscle that opens the Eustachian tube?","Tensor veli palatini (V3).");
C("et","Where does the ET open in the nasopharynx?","About 1.25 cm behind the posterior end of the inferior turbinate.");
C("et","Lining of the Eustachian tube?","Ciliated pseudostratified columnar epithelium with goblet cells and seromucous glands.");
C("et","Three functions of the Eustachian tube?","Ventilation (pressure equalisation), clearance (drainage), protection (from sound and reflux).");
C("et","Why do infants get more otitis media?","The ET is shorter, wider and more horizontal, with less efficient tensor action.");
C("et","Symptoms of a patulous Eustachian tube?","Autophony and hearing one's own breathing, eased by lying down or with a cold.");
C("et","Which state is the cartilaginous ET in at rest?","Closed; it opens on swallowing, yawning and sneezing.");
C("et","Nerve supply of the Eustachian tube?","Tympanic plexus (IX) and the pharyngeal branch of the pterygopalatine ganglion (V2).");
C("et","Which structure lies just medial to the bony ET?","The internal carotid artery in its canal.");
C("et","Where is a grommet usually inserted?","Anteroinferior quadrant of the pars tensa.");
// inner
C("inner","Diameter of each semicircular canal?","About 0.8 mm; each forms about two-thirds of a circle.");
C("inner","Which canal bulges into the aditus and antrum?","The lateral (horizontal) semicircular canal.");
C("inner","What is the crus commune?","The joined non-ampullated ends of the superior and posterior canals (about 4 mm).");
C("inner","What does Rosenthal's canal contain?","The spiral ganglion, running along the osseous spiral lamina.");
C("inner","Three walls of the cochlear duct?","Basilar membrane (floor), Reissner's membrane (roof), stria vascularis (outer wall).");
C("inner","Connection between the saccule and cochlear duct?","The ductus reuniens.");
C("inner","Where is the endolymphatic sac?","Between two layers of dura on the posterior surface of the petrous bone.");
C("inner","Hair cell counts of the utricular and saccular maculae?","Utricle about 33,000; saccule about 18,000.");
C("inner","Orientation of the utricular and saccular maculae?","Utricle horizontal; saccule vertical.");
C("inner","What lies on the otolithic membrane?","Otoconia: calcium carbonate crystals.");
C("inner","Ewald's law for the lateral canal?","Ampullopetal flow (toward the utricle) is excitatory.");
C("inner","Resting discharge of vestibular neurons?","About 90 spikes per second.");
C("inner","Where is the auditory cortex?","Superior temporal gyrus, Brodmann area 41.");
C("inner","Which tract mediates the vestibulo-ocular reflex?","The medial longitudinal fasciculus.");
// facial
C("facial","Where are the cell bodies of taste fibres in VII?","Geniculate ganglion.");
C("facial","Which nucleus gives VII's parasympathetic fibres?","Superior salivatory nucleus.");
C("facial","Where does the greater petrosal nerve leave VII?","At the geniculate ganglion.");
C("facial","Where does the chorda tympani usually leave the facial nerve?","Mastoid segment, about 3–5 mm above the stylomastoid foramen.");
C("facial","What is the pes anserinus?","The division of the facial nerve in the parotid into temporofacial and cervicofacial trunks.");
C("facial","Why is the forehead spared in a UMN facial palsy?","The upper face receives bilateral cortical supply.");
C("facial","What does Schirmer's test assess?","Lacrimation via the greater petrosal nerve.");
C("facial","Electroneurography threshold for decompression?","Over 90% degeneration within 2 weeks of onset.");
C("facial","Facial nerve in the newborn: where is it vulnerable?","At the stylomastoid foramen, which is superficial because there is no mastoid process.");
C("facial","Which branch of VII supplies the posterior belly of digastric?","Digastric branch, given just after the stylomastoid foramen.");
// nose
C("nose","What forms the upper third of the external nose?","The paired nasal bones.");
C("nose","What are the three crura of the alar cartilage?","Lateral, intermediate (dome) and medial.");
C("nose","Normal internal nasal valve angle?","About 10–15°.");
C("nose","What is Cottle's test?","Pulling the cheek laterally; improved breathing suggests valve obstruction.");
C("nose","What forms the floor of the nasal cavity?","Palatine process of the maxilla (front 3/4) and horizontal plate of palatine (back 1/4).");
C("nose","Which turbinate is a separate bone?","The inferior turbinate.");
C("nose","What is the sphenoethmoidal recess?","Space above the superior turbinate into which the sphenoid sinus drains.");
C("nose","Upper end of the uncinate process: three possible insertions?","Lamina papyracea, skull base or middle turbinate.");
C("nose","What is Woodruff's plexus?","Venous plexus at the posterior lateral wall below the inferior turbinate; source of posterior epistaxis.");
C("nose","Landmark for the sphenopalatine foramen?","Crista ethmoidalis, behind the posterior attachment of the middle turbinate.");
C("nose","Lymph drainage of the anterior nose?","Submandibular nodes.");
C("nose","Which nerve supplies the nasal tip skin?","External nasal branch of the anterior ethmoidal nerve (V1).");
// sinus
C("sinus","Capacity of the adult maxillary sinus?","About 15 mL.");
C("sinus","Where is the maxillary sinus floor relative to the nasal floor in adults?","About 1 cm below.");
C("sinus","Frequency of accessory maxillary ostia?","About 30%.");
C("sinus","Thinnest wall of the frontal sinus?","The floor (orbital roof).");
C("sinus","What separates anterior from posterior ethmoid cells?","The basal (ground) lamella of the middle turbinate.");
C("sinus","Most anterior ethmoid cell?","Agger nasi cell.");
C("sinus","Bent–Kuhn frontal cell types?","I single cell above agger nasi; II tier of cells; III single cell into the frontal sinus; IV isolated cell within the sinus.");
C("sinus","Thinnest bone of the anterior skull base?","The lateral lamella of the cribriform plate.");
C("sinus","Where does the sphenoid ostium open?","Into the sphenoethmoidal recess, about 1–1.5 cm above the choana.");
C("sinus","What is the opticocarotid recess?","Depression in the lateral sphenoid wall between the optic nerve above and ICA below.");
C("sinus","What runs in the floor of the sphenoid sinus?","The vidian nerve in the pterygoid canal.");
C("sinus","Lund–Mackay score range?","0–24 (each sinus 0–2, OMC 0 or 2, both sides).");
// orbit
C("orbit","Thinnest wall of the orbit?","Medial wall (lamina papyracea).");
C("orbit","What passes through the inferior orbital fissure?","Maxillary nerve (to infraorbital), zygomatic nerve, branches of the inferior ophthalmic vein to the pterygoid plexus.");
C("orbit","Chandler stages of orbital complications?","I preseptal cellulitis, II orbital cellulitis, III subperiosteal abscess, IV orbital abscess, V cavernous sinus thrombosis.");
C("orbit","Rule of 24-12-6?","Anterior lacrimal crest to anterior ethmoidal foramen 24 mm, to posterior ethmoidal foramen 12 mm, to optic canal 6 mm (approximate).");
C("orbit","Order of nerves in the lateral wall of the cavernous sinus?","III, IV, V1, V2 from top to bottom.");
C("orbit","Which nerve lies inside the cavernous sinus beside the ICA?","Abducens (VI).");
C("orbit","Emergency treatment of retrobulbar haematoma?","Lateral canthotomy and inferior cantholysis.");
C("orbit","Where does the nasolacrimal duct open?","Inferior meatus, under the inferior turbinate, guarded by Hasner's valve.");
C("orbit","Most common sinus source of orbital complications in children?","Ethmoid sinuses.");
C("orbit","Sign of optic nerve compromise in orbital infection?","Reduced acuity, red desaturation and relative afferent pupillary defect.");
// oral
C("oral","Cancer subsites of the oral cavity?","Lip, buccal mucosa, upper and lower alveolus, retromolar trigone, floor of mouth, oral tongue, hard palate.");
C("oral","Lymph drainage of the central lower lip?","Submental nodes (IA), often bilateral.");
C("oral","Where does the floor of mouth drain?","Anterior: IA/IB, crossing the midline. Posterior: levels II–III.");
C("oral","What is the retromolar trigone?","Mucosa over the anterior ramus behind the last molar.");
C("oral","Commonest site of minor salivary gland tumours?","Hard palate.");
C("oral","Number of circumvallate papillae?","About 8–12, in front of the sulcus terminalis.");
C("oral","Which papillae have no taste buds?","Filiform papillae.");
C("oral","Main protruder of the tongue?","Genioglossus.");
C("oral","What marks the boundary of oral and pharyngeal tongue?","The sulcus terminalis with the circumvallate papillae.");
C("oral","Which nerve supplies taste to the palate?","Greater petrosal nerve (VII), via palatine nerves.");
// salivary
C("salivary","Length of Stensen's duct?","About 5 cm.");
C("salivary","Surface marking of the parotid duct?","Middle third of a line from the tragus to the midpoint of the upper lip.");
C("salivary","Structures the parotid duct pierces?","Buccal fat, buccopharyngeal fascia, buccinator, buccal mucosa.");
C("salivary","What separates the parotid from the submandibular gland?","The stylomandibular ligament.");
C("salivary","Why is parotitis painful?","The unyielding parotid fascia stretches, stimulating the great auricular nerve.");
C("salivary","Structures emerging from the parotid apex?","Cervical branch of VII and the divisions of the retromandibular vein.");
C("salivary","Length of Wharton's duct?","About 5 cm.");
C("salivary","Where does the submandibular duct open?","Sublingual papilla beside the lingual frenulum.");
C("salivary","How does the sublingual gland drain?","About 10–20 ducts of Rivinus into the floor of mouth, some through Bartholin's duct into Wharton's duct.");
C("salivary","What is a plunging ranula?","A sublingual mucous extravasation cyst passing through or behind the mylohyoid into the neck.");
C("salivary","Hayes Martin manoeuvre?","Ligate the facial vein low and lift it up to protect the marginal mandibular nerve.");
C("salivary","Which salivary tumour is hot on technetium scan?","Warthin's tumour.");
// pharynx
C("pharynx","Length of the pharynx?","About 12–14 cm, from the skull base to the lower border of the cricoid (C6).");
C("pharynx","Four layers of the pharyngeal wall?","Mucosa, pharyngobasilar fascia, muscle, buccopharyngeal fascia.");
C("pharynx","Two parts of the inferior constrictor?","Thyropharyngeus and cricopharyngeus.");
C("pharynx","What raises Passavant's ridge?","Palatopharyngeus (upper fibres of superior constrictor).");
C("pharynx","What is Rouvière's node?","The highest lateral retropharyngeal node, at the level of the atlas.");
C("pharynx","Extent of the danger space?","Skull base to the diaphragm.");
C("pharynx","What forms the bed of the tonsil?","Superior constrictor, with the glossopharyngeal nerve, styloglossus and facial artery beyond.");
C("pharynx","Lymph drainage of the palatine tonsil?","Jugulodigastric node.");
C("pharynx","What is the crypta magna?","Large intratonsillar cleft near the upper pole, remnant of the 2nd pouch.");
C("pharynx","Boundaries of the piriform sinus?","Lateral: thyrohyoid membrane and thyroid lamina. Medial: aryepiglottic fold, arytenoid, cricoid. Above: pharyngoepiglottic fold.");
C("pharynx","Postcricoid carcinoma association?","Plummer–Vinson syndrome, mainly in women.");
C("pharynx","Length of the upper oesophageal sphincter high-pressure zone?","About 2.5–4.5 cm (cricopharyngeus itself is about 1 cm wide).");
// larynx
C("larynx","Thyroid angle in men and women?","About 90° in men, 120° in women.");
C("larynx","Age at which thyroid cartilage begins to ossify?","About 25 years.");
C("larynx","Type of cricoarytenoid joint and its movements?","Synovial; rotation (abduction/adduction) and gliding.");
C("larynx","Lower free border of the quadrangular membrane?","The vestibular ligament (false cord).");
C("larynx","What is the saccule of the larynx?","A pouch from the front of the ventricle rising between the false cord and thyroid lamina; lubricates the cords.");
C("larynx","Which parts of the larynx have squamous epithelium?","True cords, upper epiglottis and aryepiglottic folds.");
C("larynx","Boundaries of the paraglottic space?","Lateral: thyroid cartilage and cricothyroid membrane. Medial: conus elasticus, ventricle, quadrangular membrane. Back: piriform mucosa.");
C("larynx","What is the body–cover model of the vocal fold?","Cover = epithelium + superficial lamina propria; transition = vocal ligament; body = vocalis.");
C("larynx","What is Galen's anastomosis?","Connection between the internal laryngeal and recurrent laryngeal nerves.");
C("larynx","Why is left RLN palsy more common?","Its longer intrathoracic course round the aortic arch.");
C("larynx","Normal subglottic diameter in a term neonate?","About 4.5–5.5 mm; under 4 mm suggests stenosis.");
C("larynx","Right lung segments vs left?","Right 10; left usually 8–10 (9 in ENT Steps).");
// neck
C("neck","What is the vertebral level of the cricoid?","C6.");
C("neck","Where is the IJV relative to SCM's heads?","In the gap between the sternal and clavicular heads, deep to the muscle.");
C("neck","Nerve supply of SCM?","Accessory nerve (motor), C2–C3 proprioception (C2–C4 in ENT Steps).");
C("neck","Floor of the posterior triangle?","Splenius capitis, levator scapulae, scalenus medius and posterior, covered by prevertebral fascia.");
C("neck","Where does the accessory nerve enter trapezius?","About 5 cm above the clavicle.");
C("neck","Which fascial layer forms the anterior wall of the retropharyngeal space?","The visceral (buccopharyngeal) layer of the pretracheal fascia.");
C("neck","What is the suprasternal space of Burns?","A space formed by the splitting of the investing fascia above the sternum, containing the jugular arch.");
C("neck","Boundaries of level III?","Hyoid to the cricoid, deep to SCM.");
C("neck","Which levels are in a lateral neck dissection?","II–IV.");
C("neck","Normal prevertebral soft tissue at C2 in adults?","Under about 7 mm.");
C("neck","Which node is Virchow's node?","Left supraclavicular node near the thoracic duct.");
C("neck","Which structures are sacrificed in a radical neck dissection?","SCM, IJV and accessory nerve, with levels I–V.");
// vessels
C("vessels","Branches of the first part of the subclavian artery?","Vertebral, internal thoracic, thyrocervical trunk.");
C("vessels","Branches of the thyrocervical trunk?","Inferior thyroid, transverse cervical, suprascapular.");
C("vessels","Where does the ECA end?","In the parotid behind the neck of mandible, dividing into maxillary and superficial temporal arteries.");
C("vessels","Shamblin classification?","I small and localised with minimal vessel attachment, II partly surrounds, III encases the carotids.");
C("vessels","Origin of the IJV?","Continuation of the sigmoid sinus at the jugular foramen.");
C("vessels","Which nerve gives the carotid sinus branch?","Glossopharyngeal (IX).");
C("vessels","What is Lemierre's syndrome?","IJV thrombophlebitis after pharyngitis, usually Fusobacterium necrophorum, with septic emboli.");
C("vessels","Ganglia of the cervical sympathetic chain?","Superior (C2–3), middle (C6), inferior (often fused with T1 as the stellate ganglion).");
C("vessels","Signs of Horner's syndrome?","Ptosis, miosis, anhidrosis, apparent enophthalmos.");
C("vessels","What is Chassaignac's tubercle?","The anterior tubercle of C6, apex of the scalenovertebral triangle.");
// thyroid
C("thyroid","Two capsules of the thyroid?","True capsule (stroma) and false capsule (pretracheal fascia).");
C("thyroid","Why does the thyroid move on swallowing?","It is attached to the larynx by the pretracheal fascia and Berry's ligament.");
C("thyroid","What is the tubercle of Zuckerkandl?","A posterior projection of the lateral lobe; the RLN usually lies medial to it.");
C("thyroid","Frequency of the thyroid ima artery?","About 3–10%.");
C("thyroid","Where do the inferior thyroid veins drain?","Brachiocephalic veins.");
C("thyroid","Where do C cells come from?","Ultimobranchial body (4th/5th pouch).");
C("thyroid","Three ways to find the RLN at thyroidectomy?","Lateral (at the inferior thyroid artery), inferior (tracheo-oesophageal groove), superior (laryngeal entry).");
C("thyroid","Result of bilateral RLN injury?","Both cords paramedian: stridor and airway obstruction, often at extubation.");
// itf
C("itf","Roof of the infratemporal fossa?","Infratemporal surface of the greater wing of sphenoid with foramina ovale and spinosum.");
C("itf","Contents of the infratemporal fossa?","Pterygoid muscles, maxillary artery (1st and 2nd parts), pterygoid plexus, V3 and branches, chorda tympani, otic ganglion, sphenomandibular ligament.");
C("itf","Only muscle that actively opens the mouth?","Lateral pterygoid (with the suprahyoid muscles and gravity).");
C("itf","Which part of temporalis retracts the mandible?","Posterior (horizontal) fibres.");
C("itf","Nerve supply of the muscles of mastication?","Mandibular nerve (V3).");
C("itf","Branches of the first part of the maxillary artery?","Deep auricular, anterior tympanic, middle meningeal, accessory meningeal, inferior alveolar.");
C("itf","Terminal branch of the maxillary artery?","Sphenopalatine artery.");
C("itf","Main ligament of the TMJ?","Lateral (temporomandibular) ligament.");
C("itf","Which TMJ compartment allows hinge movement?","The lower compartment (between disc and condyle).");
C("itf","Nerve supply of the TMJ?","Auriculotemporal and masseteric nerves.");
C("itf","Connections of the pterygoid venous plexus?","Cavernous sinus (emissary veins), inferior ophthalmic vein, facial vein (deep facial), maxillary vein.");
C("itf","Accessory ligaments of the TMJ?","Sphenomandibular, stylomandibular and pterygomandibular.");
// trigeminal
C("trigeminal","Four trigeminal nuclei?","Mesencephalic, main sensory, spinal and motor.");
C("trigeminal","Where is the trigeminal ganglion?","Meckel's cave over the petrous apex.");
C("trigeminal","Foramina of V1, V2 and V3?","Superior orbital fissure, foramen rotundum, foramen ovale.");
C("trigeminal","Which division of V carries motor fibres?","Only V3.");
C("trigeminal","What is Hutchinson's sign?","Zoster on the nasal tip: nasociliary nerve involved, eye at risk.");
C("trigeminal","Which nerve carries lacrimal secretomotor fibres to the lacrimal nerve?","Zygomaticotemporal branch of V2.");
C("trigeminal","Three superior alveolar nerves and their teeth?","Posterior (molars), middle (premolars), anterior (canine and incisors).");
C("trigeminal","Which ganglion is the largest parasympathetic ganglion?","Pterygopalatine (sphenopalatine), 4–5 mm.");
C("trigeminal","Only motor branch of the posterior division of V3?","Nerve to mylohyoid (mylohyoid and anterior belly of digastric).");
C("trigeminal","Afferent and efferent of the corneal reflex?","Afferent V1 (nasociliary), efferent VII.");
C("trigeminal","Course of the lingual nerve near the third molar?","Just under the mucosa on the inner side of the socket, at risk in extraction.");
C("trigeminal","Which muscles does V3 supply besides those of mastication?","Mylohyoid, anterior digastric, tensor tympani, tensor veli palatini.");
// embryo
C("embryo","Nerve of each pharyngeal arch?","1st V3, 2nd VII, 3rd IX, 4th superior laryngeal (X), 6th recurrent laryngeal (X).");
C("embryo","Derivatives of the 1st pharyngeal pouch?","Middle ear cavity and Eustachian tube.");
C("embryo","Derivatives of the 2nd pouch?","Tonsillar fossa (crypta magna).");
C("embryo","Derivative of the 1st cleft?","External auditory canal.");
C("embryo","Origin of the inner ear?","Otic placode → otic pit → otic vesicle.");
C("embryo","Origin of the auricle?","Six hillocks of His, three from the 1st arch and three from the 2nd.");
C("embryo","Which prominences fail to fuse in cleft lip?","Maxillary and medial nasal prominences.");
C("embryo","Landmark separating primary and secondary palate?","Incisive foramen.");
C("embryo","Signs of a submucous cleft palate?","Bifid uvula, notch in the posterior hard palate, translucent midline (zona pellucida).");
C("embryo","Embryological origin of the posterior third of the tongue?","3rd arch (hypobranchial eminence), so supplied by IX.");
C("embryo","Where does the thyroid originate?","Foramen caecum of the tongue.");
C("embryo","Proportion of bony vs membranous choanal atresia?","About 90% bony or mixed, 10% membranous.");
C("embryo","Syndrome associated with choanal atresia?","CHARGE (Coloboma, Heart, Atresia choanae, Retardation, Genital, Ear anomalies).");
C("embryo","Which tract does a 2nd branchial fistula follow?","Between the ICA and ECA, over IX and XII, to the tonsillar fossa.");
C("embryo","Ear structures at birth that are adult-sized?","Ossicles, middle ear cavity, antrum and inner ear.");

/* ===== MCQs: Q(region, stem, [options], correctIndex, explanation) ===== */
Q("temporal","Which structure is transmitted through the foramen spinosum?",["Mandibular nerve","Middle meningeal artery","Lesser petrosal nerve","Greater petrosal nerve"],1,"Foramen spinosum carries the middle meningeal artery and the meningeal branch of V3. The mandibular nerve and lesser petrosal pass through the foramen ovale.");
Q("temporal","A patient with chronic otitis media develops retro-orbital pain and diplopia on lateral gaze. The nerve causing the diplopia is affected at:",["Superior orbital fissure","Dorello's canal","Cavernous sinus","Jugular foramen"],1,"Gradenigo's syndrome: petrous apicitis involves the abducens nerve in Dorello's canal and the trigeminal ganglion at the apex.");
Q("temporal","Hoarseness, dysphagia and a dropped shoulder after a skull base tumour indicate a lesion of:",["Hypoglossal canal","Jugular foramen","Foramen magnum","Internal acoustic meatus"],1,"IX, X and XI together = jugular foramen (Vernet) syndrome.");
Q("temporal","The mastoid antrum lies deep to which surface landmark?",["Spine of Henle","Macewen's triangle","Asterion","Pterion"],1,"Macewen's (suprameatal) triangle marks the antrum about 1.5 cm deep.");
Q("temporal","Which muscle is NOT attached to the styloid process?",["Stylohyoid","Styloglossus","Stylopharyngeus","Posterior belly of digastric"],3,"The posterior belly of digastric arises from the mastoid notch; the styloid gives origin to stylohyoid, styloglossus and stylopharyngeus.");
Q("extear","The bony external canal differs from the cartilaginous canal in that it:",["Contains ceruminous glands","Has hair follicles","Has thin skin firmly attached to periosteum","Is the site of furuncles"],2,"Bony canal skin is thin with no glands or hair; wax and furuncles arise in the cartilaginous outer third.");
Q("extear","Malignant otitis externa reaches the skull base most often through:",["Notch of Rivinus","Fissures of Santorini","Petrotympanic fissure","Mastoid emissary foramen"],1,"The fissures of Santorini in the cartilaginous floor let infection spread to the soft tissue under the skull base.");
Q("extear","An elderly man coughs whenever his ear canal is cleaned. The afferent nerve is:",["Auriculotemporal","Great auricular","Auricular branch of vagus","Lesser occipital"],2,"Arnold's nerve (X) supplies the posteroinferior canal and triggers the cough reflex.");
Q("extear","The cone of light on a normal right tympanic membrane points:",["Anterosuperiorly","Anteroinferiorly","Posterosuperiorly","Posteroinferiorly"],1,"The light reflex lies in the anteroinferior quadrant of either ear.");
Q("extear","Why do retraction pockets usually begin in the pars flaccida?",["It has no epithelium","Its fibrous layer is thin and disorganised","It has no blood supply","It is attached to the annulus"],1,"The pars flaccida lacks the organised middle fibrous layer and the annulus, so it yields to negative pressure.");
Q("midear","During posterior tympanotomy the surgeon opens the facial recess. Its lateral boundary is the:",["Facial nerve","Chorda tympani","Pyramid","Lateral semicircular canal"],1,"Facial recess: facial nerve medially, chorda tympani laterally, fossa incudis above.");

/* ===== WHERE THE SOURCES DIFFER: DF(region, section title, note) ===== */
DF("temporal","Tympanic and mastoid parts, styloid process","**Chorda tympani exit:** ENT Steps says the petrotympanic fissure; Doss says the squamotympanic fissure. Gray's: the anterior canaliculus (canal of Huguier) at the medial end of the petrotympanic fissure.");
DF("temporal","Foramina of the skull base","**Foramen ovale:** Doss adds the motor root of V and puts the middle meningeal vein here (\"3 M + ALE\"); Gray's sends the middle meningeal vein through the foramen spinosum.");
DF("extear","Nerve supply of the auricle and canal","**Auricle:** ENT Steps uses a regional pattern (as here). Doss uses halves: auriculotemporal upper outer half, lesser occipital upper inner half, great auricular lower half of both surfaces.");
DF("extear","Tympanic membrane","**Pars flaccida:** ENT Steps says its fibrous layer is very thin and unorganised; Doss says it is absent. **Size:** ENT Steps 9–10 × 8–9 mm; Doss 10 × 8 mm.");
DF("midear","Middle ear cleft and its parts","**Volume:** ENT Steps gives 1–2 cm³ for the whole cleft; standard texts give that figure for the tympanic cavity alone.");
DF("midear","Intratympanic muscles","**Tensor tympani origin:** ENT Steps: bony canal above the ET. Doss: cartilaginous part of the ET. Gray's lists both plus the greater wing of sphenoid.");
DF("midear","Nerves of the middle ear","**Chorda tympani on the TM:** ENT Steps: between the malleus and long process of incus. Doss: between the handle of malleus and the mucosa. Both are true: lateral to the incus, medial to the malleus handle.");
DF("inner","Blood supply of the labyrinth","**Origin and veins:** ENT Steps: mostly from AICA, veins to the inferior petrosal and sigmoid sinuses. Doss: labyrinthine branch of the basilar plus the stylomastoid artery, veins to the superior petrosal or transverse sinus.");
DF("inner","Bony labyrinth","**Cochlear turns:** Doss 2.5; ENT Steps 2.5–2.75.");
DF("facial","Intratemporal segments","**Mastoid segment length:** not given in either handout; most texts give about 15–20 mm (some 13 mm).");
DF("facial","Finding the trunk at parotidectomy","**Tragal pointer:** ENT Steps says 1–1.5 cm medial and inferior; Conley's classic figure is 1 cm deep, anterior and inferior.");
DF("nose","Turbinates and meatuses","**Sphenoid ostium height:** ENT Steps gives about 1 cm above the choana in the nose chapter and 1.5 cm in the sinus chapter.");
DF("nose","Blood supply","**Woodruff's plexus:** Dhingra and Bansal describe it as venous; endoscopic studies show it is mainly arterial (sphenopalatine branches).");
DF("sinus","Overview and development","**Sphenoid sinus at birth:** ENT Steps says absent, full size at 6 years; Dhingra and Bansal describe a tiny cavity at birth, visible on imaging at 3–4 years.");
DF("salivary","Overview and structure","**Sublingual gland:** ENT Steps calls it the largest minor salivary gland; Doss and Gray's count it as a major gland. **Number of minor glands:** ENT Steps 450; most texts 600–1000.");
DF("salivary","Structures inside and around the parotid","**Anterior border:** ENT Steps lists zygomatic, transverse facial artery, upper buccal, duct, lower buccal, marginal mandibular. Doss lists zygomatic branches, transverse facial artery, duct, buccal branch.");
DF("pharynx","Cervical oesophagus","**Constrictions:** ENT Steps 15 / 22 / 25 / 40 cm (C6 / T4 / T5 / T10). Dhingra 15 / 22.5 / 27.5 / 37.5–40 cm, with the bronchial constriction at about T6.");
DF("itf","Mandibular nerve in the fossa","**Roots of V3:** Doss says they unite in the foramen ovale; Gray's says just below it in the infratemporal fossa.");
DF("itf","Temporomandibular joint","**Pterygomandibular ligament:** Doss lists it as an accessory ligament of the TMJ; Gray's lists only the sphenomandibular and stylomandibular.");
DF("neck","Surface landmarks","**Carotid bifurcation:** ENT Steps: level of the greater cornu of the hyoid. Doss: upper border of the thyroid cartilage (C3/C4 disc). **Hyoid:** Doss C2–C3; most texts C3.");
DF("neck","Sternocleidomastoid and trapezius","**Erb's point:** ENT Steps puts XI and the cutaneous nerves at the junction of the upper and middle thirds; Doss and Gray's put the cutaneous nerves at the midpoint, with XI a little above. **XI into trapezius:** Doss 5 cm above the clavicle; ENT Steps at the junction of its middle and lower thirds.");
DF("neck","Neck spaces","**Lower limit of the retropharyngeal space:** ENT Steps T2 (alar and visceral fascia fuse); Dhingra and Bansal about T4 (tracheal bifurcation); Scott-Brown T1–T2. **Prevertebral fascia:** ENT Steps to the coccyx; Doss to T3.");
DF("neck","Lymph node levels","**III/IV boundary:** ENT Steps uses the upper border of the cricoid; AAO-HNS uses the lower border. **Level VII:** the 2014 consensus (Grégoire) renames upper mediastinal nodes VIb and uses VII for retropharyngeal (VIIa) and retrostyloid (VIIb) nodes.");
DF("vessels","External carotid artery","**First branch:** ENT Steps and Gray's say the superior thyroid; Doss calls the ascending pharyngeal the first branch (from the medial side).");
DF("vessels","Carotid sheath and common carotid","**Order in the sheath:** Doss: CCA anteromedial, IJV posterolateral, vagus between and behind (as here). ENT Steps lists superficial to deep as IJV, vagus, CCA.");
DF("thyroid","Gross anatomy","**Lower extent of the lobes:** Doss says the 5th or 6th tracheal ring.");
DF("thyroid","Parathyroid glands","**Size:** Doss 6 × 3 mm. **Superior gland:** Doss puts it at the middle of the posterior surface of the lobe; surgical texts at the cricothyroid junction.");

  try{await DBREF.set({json:JSON.stringify(ST),t:ST.t});syncState="synced"}catch(e){syncState="error"}

  if(d&&d.json&&(d.t||0)>(ST.t||0)){ST=Object.assign({},S0,JSON.parse(d.json));try{localStorage.setItem(KEY,JSON.stringify(ST))}catch(e){}

function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function dayStr(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function studied(){const d=today();if(!ST.days.includes(d)){ST.days.push(d);ST.days=ST.days.slice(-200)}save()}
function streak(){const set=new Set(ST.days);let d=new Date(),n=0;if(!set.has(dayStr(d)))d.setDate(d.getDate()-1);while(set.has(dayStr(d))){n++;d.setDate(d.getDate()-1)}return n}
const INT=[0,1,3,7,16,35,80];
const isDue=c=>{const s=ST.cards[c.id];return !s||s.d<=Date.now()};
const isNew=c=>!ST.cards[c.id];
function quizStats(r){const q=ST.quiz.filter(x=>!r||x.r===r);if(!q.length)return null;const s=q.reduce((a,x)=>a+x.s,0),n=q.reduce((a,x)=>a+x.n,0);return{pct:Math.round(100*s/n),n:q.length}}
// per-region accuracy including mixed quizzes (stored per question region in x.by)
function regionAcc(id){let s=0,n=0;ST.quiz.forEach(x=>{if(x.by&&x.by[id]){s+=x.by[id][0];n+=x.by[id][1]}else if(x.r===id&&!x.by){s+=x.s;n+=x.n}});return n?{pct:Math.round(100*s/n),n}:null}

  if(mode==="due")q=shuffle(due);else if(mode==="new")q=shuffle(fresh).slice(0,20);else if(mode==="all")q=shuffle(all);

  FC={r,mode,q,i:0,flip:false,seen:0};go("cards")}

const DG={};
function dgWrap(id,w,h,label,body,caption){
  return `<figure class="dg"><div class="diagram"><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(label)}" style="max-width:${w}px">
  <defs><marker id="ar-${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker>
  <marker id="arn-${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--nerve)"/></marker></defs>
  ${body}</svg></div><figcaption>${caption}</figcaption></figure>`}
function bx(x,y,w,h,lines,o){o=o||{};const fill=o.fill||"var(--surface)",st=o.stroke||"var(--line)",fs=o.fs||12;
  const ty=y+h/2-((lines.length-1)*(fs+3))/2+fs*0.35;
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="7" fill="${fill}" stroke="${st}" stroke-width="${o.sw||1.2}"/>`+
   lines.map((t,i)=>`<text x="${x+w/2}" y="${ty+i*(fs+3)}" text-anchor="middle" font-size="${i===0&&o.bold!==false?fs:fs-1}" font-weight="${i===0&&o.bold!==false?600:400}" fill="${i===0?"var(--ink)":"var(--muted)"}">${esc(t)}</text>`).join("")}
function ln(x1,y1,x2,y2,id,o){o=o||{};return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${o.c||"var(--muted)"}" stroke-width="${o.w||1.4}" ${o.dash?'stroke-dasharray="4 3"':""} marker-end="url(#${o.n?"arn":"ar"}-${id})"/>`}
function tx(x,y,t,o){o=o||{};return `<text x="${x}" y="${y}" font-size="${o.fs||11.5}" text-anchor="${o.a||"start"}" fill="${o.c||"var(--muted)"}" font-weight="${o.b?600:400}">${esc(t)}</text>`}

  ${t.note?`<p class="tnote">${esc(t.note)}</p>`:""}<p class="tregions">${t.regions.map(id=>RMAP[id]?`<button class="linkbtn" data-go="region:${id}">${esc(RMAP[id].name)}</button>`:"").join(" · ")}</p></section>`}
function mnemHTML(list){return `<div class="mnems">${list.map(m=>`<div class="mnem"><span class="eyebrow">${esc(m.topic)}</span><b>${esc(m.m)}</b><span>${esc(m.x)}</span></div>`).join("")}</div>`}
function regionTablesHTML(id){const ts=TABLES.filter(t=>t.regions.includes(id)),ms=MNEM.filter(m=>m.r===id);if(!ts.length&&!ms.length)return"";
  return (ts.length?`<div class="h2row"><h2>Tables</h2><span class="eyebrow">${ts.length}</span></div>${ts.map(tableHTML).join("")}`:"")+
   (ms.length?`<div class="h2row"><h2>Mnemonics</h2><span class="eyebrow">${ms.length}</span></div>${mnemHTML(ms)}`:"")}
let TBF="all";
function vTables(arg,opt){
  const ts=TABLES.filter(t=>TBF==="all"||t.regions.includes(TBF)),ms=MNEM.filter(m=>TBF==="all"||m.r===TBF);
  V().innerHTML=`<div class="hero"><span class="eyebrow">Tables &amp; mnemonics</span><h1>Compare and remember</h1><p class="lede">${TABLES.length} comparison tables and ${MNEM.length} mnemonics for the facts examiners love to contrast.</p></div>
  <label class="fieldlabel" for="tbf">Region</label><select id="tbf" class="select"><option value="all">All regions</option>${REGIONS.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join("")}</select>
  <nav class="jump" aria-label="Tables">${ts.map(t=>`<a href="#tb-${t.id}" data-jump="tb-${t.id}">${esc(t.title)}</a>`).join("")}${ms.length?`<a href="#mnemonics" data-jump="mnemonics">Mnemonics</a>`:""}</nav>
  ${ts.map(tableHTML).join("")||`<p class="empty">No tables for this region yet.</p>`}
  ${ms.length?`<div class="h2row" id="mnemonics"><h2>Mnemonics</h2><span class="eyebrow">${ms.length}</span></div>${mnemHTML(ms)}`:""}`;
  $("#tbf").value=TBF;$("#tbf").onchange=e=>{TBF=e.target.value;vTables()};
  if(opt&&opt.sec)setTimeout(()=>{const el=document.getElementById(opt.sec);if(el)el.scrollIntoView({block:"start"})},40)}

/* ---------------- LABEL DRILLS ---------------- */
const DRILLKEYS=Object.keys(OCC).filter(k=>FIG[k]);
const drillCount=id=>DRILLKEYS.filter(k=>FIG[k][3]===id).length;
const drillDue=k=>{const s=ST.drill&&ST.drill[k];return !s||s.d<=Date.now()};
const drillNew=k=>!(ST.drill&&ST.drill[k]);
function studySwitch(on){return `<div class="seg studyseg" role="group" aria-label="Study mode"><button class="chip" data-go="cards" aria-pressed="${on==="cards"}">Flashcards</button><button class="chip" data-go="drill" aria-pressed="${on==="drill"}">Label drills</button></div>`}
let DR=null;
function startDrill(r){const all=DRILLKEYS.filter(k=>r==="all"||FIG[k][3]===r);
  const due=shuffle(all.filter(k=>drillDue(k)&&!drillNew(k))),fresh=shuffle(all.filter(drillNew));
  let q=due.concat(fresh).slice(0,12);if(!q.length)q=shuffle(all).slice(0,12);
  DR={r,q,i:0};loadFig();go("drill")}
function loadFig(){const k=DR.q[DR.i];if(!k)return;const n=OCC[k].length;DR.order=shuffle([...Array(n).keys()]);DR.t=0;DR.shown=new Set();DR.known=0;DR.zoom=DR.zoom||false;DR.revealAll=false}
document.addEventListener("click",e=>{const b=e.target.closest("[data-drill]");if(b){e.preventDefault();startDrill(b.dataset.drill)}});
function vDrill(){
  if(!DR){ST.drill=ST.drill||{};
    const rows=REGIONS.filter(r=>drillCount(r.id)).map(r=>{const ks=DRILLKEYS.filter(k=>FIG[k][3]===r.id),d=ks.filter(k=>drillDue(k)&&!drillNew(k)).length,n=ks.filter(drillNew).length;
      return `<div class="deckrow"><span><strong>${esc(r.name)}</strong><small>${ks.length} figures · ${d} due · ${n} new</small></span><button class="btn" data-drill="${r.id}">Drill</button></div>`}).join("");
    const masks=DRILLKEYS.reduce((a,k)=>a+OCC[k].length,0);
    V().innerHTML=`${studySwitch("drill")}<div class="hero"><span class="eyebrow">Label drills</span><h1>Name the hidden structure</h1><p class="lede">The labels on ${DRILLKEYS.length} handout figures are covered (${masks} labels in all). One label at a time is highlighted: say its name, reveal it, and mark whether you knew it. Figures you know well come back less often.</p></div>
    <div class="actions"><button class="btn primary" data-drill="all">Drill all regions</button></div>
    <div class="h2row"><h2>By region</h2></div><div class="decks">${rows}</div>
    <p class="sync">Labels were detected automatically, so a few may stay visible or a cover may sit slightly off. Use "Reveal all" to see the original figure at any time.</p>`;return}
  const k=DR.q[DR.i];
  if(!k){V().innerHTML=`${studySwitch("drill")}<div class="hero"><span class="eyebrow">Label drills</span><h1>Session complete</h1><p class="lede">${DR.q.length} figures drilled. They'll come back on a spaced schedule.</p></div><div class="actions"><button class="btn primary" data-drill="${DR.r}">Drill more</button><button class="btn" data-drillmenu>All regions</button></div>`;return}
  const ms=OCC[k],tgt=DR.order[DR.t],done=DR.t>=ms.length||DR.revealAll;
  const masks=ms.map((g,i)=>{const shown=DR.revealAll||DR.shown.has(i),isT=i===tgt&&!done;
    return g.map((m,j)=>`<button class="mask ${shown?"open":""} ${isT?"target":""}" data-mask="${i}" style="left:${m[0]*100}%;top:${m[1]*100}%;width:${m[2]*100}%;height:${m[3]*100}%" aria-label="${shown?"Revealed label":isT?"Hidden label to name":"Hidden label"}">${isT&&j===0?"?":""}</button>`).join("")}).join("");
  V().innerHTML=`<div class="hero"><span class="eyebrow">Figure ${DR.i+1} of ${DR.q.length} · ${esc(RMAP[FIG[k][3]].name)}</span><h2 class="dtitle">${esc(FIG[k][0])}</h2></div>
  <div class="dwrap ${DR.zoom?"zoom":""}"><div class="dstage"><img src="${figSrc(k)}" alt="${esc(FIG[k][0])}">${masks}</div></div>
  <div class="dbar"><span class="counter">${done?`${DR.known} of ${ms.length} known`:`Label ${DR.t+1} of ${ms.length} · known so far ${DR.known}`}</span>
   <button class="linkbtn" data-dzoom>${DR.zoom?"Fit to screen":"Zoom in"}</button></div>
  ${done?`<div class="actions"><button class="btn primary" data-dnext>${DR.i+1<DR.q.length?"Next figure":"Finish"}</button><button class="btn" data-dredo>Drill this figure again</button></div>`:
   DR.shown.has(tgt)?`<div class="rate2"><button class="again" data-dmark="0">Missed it</button><button class="easy" data-dmark="1">Knew it</button></div>`:
   `<div class="actions"><button class="btn primary" data-dshow>Reveal the highlighted label</button></div>`}
  <div class="actions"><span class="sp"></span>${done?"":`<button class="linkbtn" data-dall>Reveal all and skip</button>`}<button class="linkbtn" data-fig="${k}">Open full figure</button><button class="linkbtn" data-drillmenu>End drill</button></div>`;
}
function finishFig(){const k=DR.q[DR.i],ms=OCC[k],p=DR.revealAll&&DR.t<ms.length?0:DR.known/ms.length;ST.drill=ST.drill||{};
  const s=ST.drill[k]||{b:0};const b=p>=.9?Math.min(6,s.b+1):p>=.6?Math.max(1,s.b):0;
  ST.drill[k]={b,d:b===0?Date.now()+6e5:Date.now()+INT[b]*864e5};studied()}
document.addEventListener("click",e=>{if(!DR&&!e.target.closest("[data-drillmenu]"))return;
  if(e.target.closest("[data-drillmenu]")){DR=null;vDrill();return}
  if(e.target.closest("[data-dzoom]")){DR.zoom=!DR.zoom;vDrill();return}
  if(e.target.closest("[data-dshow]")){DR.shown.add(DR.order[DR.t]);vDrill();return}
  const mk=e.target.closest("[data-mask]");if(mk){const i=+mk.dataset.mask;if(i===DR.order[DR.t]&&!DR.shown.has(i)){DR.shown.add(i);vDrill()}return}
  const m=e.target.closest("[data-dmark]");if(m){if(m.dataset.dmark==="1")DR.known++;DR.t++;if(DR.t>=OCC[DR.q[DR.i]].length)finishFig();vDrill();return}
  if(e.target.closest("[data-dall]")){DR.revealAll=true;finishFig();vDrill();return}
  if(e.target.closest("[data-dredo]")){loadFig();vDrill();return}
  if(e.target.closest("[data-dnext]")){DR.i++;loadFig();vDrill();window.scrollTo(0,0)}
});

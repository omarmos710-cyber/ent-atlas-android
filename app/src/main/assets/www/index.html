<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#B3202D">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ENT Atlas">
<title>ENT Anatomy Atlas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: app shell — sidebar on desktop, bottom tab bar on phones; atlas colour code (artery red, vein blue, nerve yellow) carried through UI */
:root{
  --bg:#F2F4F5; --surface:#FFFFFF; --soft:#E8EDF0; --line:#D7DEE3;
  --ink:#15202A; --muted:#5A6977; --accent:#B3202D; --accent-soft:#F7E3E5; --on-accent:#FFFFFF;
  --artery:#C8323C; --vein:#3461B5; --nerve:#C49A00; --ok:#2C7A4B; --stage:#E4EAEE;
  --stage-hi:#F7F9FA; --plate:#FFFFFF; --scrim:rgba(10,15,19,.97);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1317; --surface:#151D23; --soft:#1C262D; --line:#28343D;
  --ink:#E6ECEF; --muted:#94A3AF; --accent:#F0646E; --accent-soft:#3A1E22; --on-accent:#1A0A0C;
  --artery:#EF6670; --vein:#7AA2EC; --nerve:#E8C449; --ok:#5FBF86; --stage:#0C1216; --stage-hi:#1F2A31; --plate:#F1F3F4; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1317; --surface:#151D23; --soft:#1C262D; --line:#28343D;
  --ink:#E6ECEF; --muted:#94A3AF; --accent:#F0646E; --accent-soft:#3A1E22; --on-accent:#1A0A0C;
  --artery:#EF6670; --vein:#7AA2EC; --nerve:#E8C449; --ok:#5FBF86; --stage:#0C1216; --stage-hi:#1F2A31; --plate:#F1F3F4; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body)}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
.app{display:grid;grid-template-columns:1fr;min-height:100%}
.side{display:none}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:-.01em}
.mark{width:28px;height:28px;border-radius:8px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:13px;font-family:var(--f-mono)}
.top .sp{flex:1}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;height:36px;padding:0 12px;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500}
main{padding-block:20px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:920px;width:100%;margin:0 auto;min-width:0}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tab{border:0;background:none;padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:500;color:var(--muted)}
.tab svg{width:22px;height:22px}
.tab[aria-current="true"]{color:var(--accent)}
@media (min-width:960px){
  .app{grid-template-columns:232px 1fr}
  .tabs{display:none}
  .side{display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;padding:20px 14px;border-right:1px solid var(--line);background:var(--surface)}
  .side .brand{padding:4px 8px 18px}
  .side .tab{flex-direction:row;justify-content:flex-start;gap:12px;font-size:14px;padding:10px 12px;border-radius:10px}
  .side .tab[aria-current="true"]{background:var(--accent-soft)}
  .top .brand{display:none}
  main{padding-bottom:40px}
}
.eyebrow{font:500 11px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lede{color:var(--muted);max-width:62ch;margin:6px 0 0}
.hero{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.hero h1{font-size:clamp(26px,5vw,36px);letter-spacing:-.02em}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:18px 0 26px}
@media (min-width:640px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat b{display:block;font:700 26px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.h2row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:26px 0 12px}
.h2row h2{font-size:20px}
.regions{display:grid;grid-template-columns:1fr;gap:8px}
@media (min-width:640px){.regions{grid-template-columns:1fr 1fr}}
.region{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:12px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%}
.region[disabled]{opacity:.55;cursor:default}
.region .num{font:500 12px var(--f-mono);color:var(--muted)}
.region strong{display:block;font-weight:600}
.region small{color:var(--muted);font-size:12px}
.bar{height:4px;border-radius:4px;background:var(--soft);overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;background:var(--accent)}
.pill{font:500 11px/1 var(--f-mono);padding:5px 8px;border-radius:99px;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill.live{background:var(--accent-soft);color:var(--accent)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:500;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn:disabled{opacity:.45;cursor:default}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:12px 0;scroll-margin-top:80px}
.sec header{display:flex;align-items:flex-start;gap:10px}
.sec h3{font-size:17px;flex:1;padding-top:2px}
.sec ul{margin:10px 0 0;padding-left:18px;max-width:68ch}
.sec li{margin:5px 0}
.sec li b{font-weight:600}
.star{border:0;background:none;padding:4px;color:var(--muted);line-height:0}
.star[aria-pressed="true"]{color:var(--nerve)}
.star svg{width:20px;height:20px}
.pearl{margin:12px 0 0;padding:10px 12px;border-radius:10px;background:var(--accent-soft);font-size:14px;max-width:68ch}
.pearl span{font:500 10px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);display:block;margin-bottom:3px}
.secfoot{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);font-size:13px;color:var(--muted)}
.secfoot label{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.secfoot input{accent-color:var(--accent);width:16px;height:16px}
.notes{width:100%;min-height:70px;margin-top:8px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body);padding:8px 10px;resize:vertical}
details.mynotes{width:100%}
details.mynotes summary{cursor:pointer}
.diagram{overflow-x:auto;margin-top:12px}
.diagram svg{display:block;max-width:100%;height:auto}
/* 3D */
.stagewrap{position:relative;background:var(--stage);border:1px solid var(--line);border-radius:16px;overflow:hidden;height:min(58vh,520px);min-height:320px}
#cv{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.stagewrap{background:radial-gradient(ellipse at 50% 38%,var(--stage-hi),var(--stage) 70%)}
.views{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap}
.views .chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.layers{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pin{position:absolute;left:0;top:0;transform:translate(-50%,calc(-100% - 10px));background:var(--ink);color:var(--bg);font-size:12px;font-weight:600;padding:5px 9px;border-radius:8px;white-space:nowrap;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.pin::after{content:"";position:absolute;left:50%;bottom:-5px;width:10px;height:10px;background:var(--ink);transform:translateX(-50%) rotate(45deg)}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 11px;font-size:12px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.chip .dot{width:9px;height:9px;border-radius:50%}
.chip[aria-pressed="false"]{opacity:.5}
.hint{position:absolute;bottom:10px;left:12px;font-size:12px;color:var(--muted);pointer-events:none}
.info{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:12px;min-height:84px}
.info h3{font-size:17px;display:flex;align-items:center;gap:8px}
.info p{margin:6px 0 0;max-width:68ch}
.partlist{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.partlist .chip[aria-current="true"]{border-color:var(--accent);color:var(--accent)}
/* cards */
.deck{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:10px}
.fcard{width:100%;max-width:560px;min-height:240px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:12px;text-align:left}
.fcard .q{font:600 19px/1.35 var(--f-display)}
.fcard .a{border-top:1px dashed var(--line);padding-top:12px;font-size:15px}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;max-width:560px}
.rate button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 4px;font-size:13px;font-weight:600}
.rate button small{display:block;font:500 10px var(--f-mono);color:var(--muted)}
.rate .again{color:var(--artery)} .rate .easy{color:var(--ok)}
.counter{font:500 12px var(--f-mono);color:var(--muted)}
/* quiz */
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;max-width:640px}
.qcard .q{font:600 18px/1.4 var(--f-display);margin:8px 0 14px}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 13px;margin:7px 0;font-size:15px}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--surface))}
.opt.wrong{border-color:var(--artery);background:color-mix(in srgb,var(--artery) 12%,var(--surface))}
.explain{margin-top:12px;padding:10px 12px;border-left:3px solid var(--accent);background:var(--soft);border-radius:0 8px 8px 0;font-size:14px}
.score{font:700 54px/1 var(--f-display);font-variant-numeric:tabular-nums}
.empty{color:var(--muted);padding:18px;border:1px dashed var(--line);border-radius:12px;background:var(--surface)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:13px;z-index:20}
.sample{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--nerve);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--muted);margin-bottom:16px}
input[type=search]{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:12px 14px;font:15px var(--f-body)}
mark{background:color-mix(in srgb,var(--nerve) 35%,transparent);color:inherit;border-radius:3px}
.res{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0}
.res small{color:var(--muted)}
/* figures: handout plates stay white in both themes, like paper */
.figs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
@media (min-width:640px){.figs{grid-template-columns:repeat(3,minmax(0,1fr))}}
.fig{display:flex;flex-direction:column;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:0;overflow:hidden;text-align:left}
.fig.wide{grid-column:span 2}
.fig img{display:block;width:100%;aspect-ratio:4/3;object-fit:contain;background:var(--plate);padding:6px}
.fig.wide img{aspect-ratio:16/9}
.fig .cap{padding:8px 10px;font-size:12.5px;line-height:1.35;font-weight:500}
.fig .cap small{display:block;font:500 10.5px var(--f-mono);color:var(--muted);margin-top:3px}
.fig:hover{border-color:var(--accent)}
.strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;scroll-snap-type:x proximity}
.thumb{flex:0 0 auto;width:96px;height:80px;border:1px solid var(--line);border-radius:10px;background:var(--plate);padding:4px;scroll-snap-align:start}
.thumb img{width:100%;height:100%;object-fit:contain}
.infogrid{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:560px){.infogrid{grid-template-columns:1fr 170px}}
.fig.mini img{aspect-ratio:4/3}
.lb{position:fixed;inset:0;z-index:30;background:var(--scrim);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.lbbar{display:flex;align-items:center;gap:8px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));color:#E6ECEF}
.lbbar .sp{flex:1}.lbbar .counter{color:#C4CDD4}
.lbimg{flex:1;min-height:0;overflow:auto;display:flex;align-items:center;justify-content:center;padding:0 12px;cursor:zoom-in}
.lbimg img{max-width:100%;max-height:100%;background:#fff;border-radius:8px;padding:8px}
.lbimg.zoom{display:block;cursor:zoom-out}
.lbimg.zoom img{max-width:none;max-height:none;width:200%;margin:0 auto}
@media (min-width:900px){.lbimg.zoom img{width:150%}}
.lbcap{padding:12px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));color:#E6ECEF;display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px}
.lbcap small{display:block;color:#AAB6BF;font-size:12px;width:100%}
.lbcap b{width:100%}
.lbnav{display:flex;gap:8px}

/* v2 additions */
.lb .iconbtn,.lb .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.28);color:#E6ECEF}
.lb .btn:disabled{opacity:.35}
.lb .iconbtn[aria-pressed="true"]{background:#E6ECEF;color:#10161A}
.group{margin:18px 0 6px}.group>h3{margin:0 0 8px}
.rmain{display:block;min-width:0}.rmain .bar{display:block}
.note{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;padding:10px 12px;margin:14px 0;font-size:14px}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;padding:2px 0;text-decoration:underline;text-underline-offset:3px;font-size:inherit}
.jump{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;margin:6px 0}
.jump a{flex:0 0 auto;font-size:12.5px;font-weight:500;color:var(--ink);text-decoration:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 11px;white-space:nowrap}
.jump a.done{border-color:var(--ok);color:var(--ok)}
.pager{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:22px 0 4px}
.fieldlabel{display:block;font:500 11px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.select{width:100%;max-width:460px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 12px;font:15px var(--f-body)}
.seg{display:flex;gap:6px}.seg .chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.decks{display:grid;gap:8px}
.deckrow{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.deckrow span{min-width:0}.deckrow strong{display:block;font-weight:600}.deckrow small{color:var(--muted);font-size:12px}
.deckfoot{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:center}
.sync{color:var(--muted);font-size:12px;margin-top:22px}
.gallery{margin-top:16px}
@media (min-width:640px){.gallery{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:960px){.gallery{grid-template-columns:repeat(4,minmax(0,1fr))}}
.gallery .fig img{aspect-ratio:1/1}
.qsetup .actions{margin-top:16px}

/* v3: tables, drills, diagrams */
.tabs{grid-template-columns:repeat(6,1fr)}
.tbl{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0;scroll-margin-top:80px}
.tbl header{display:flex;align-items:flex-start;gap:10px}.tbl h3{font-size:16px;flex:1;padding-top:2px}
.tscroll{overflow-x:auto;margin-top:8px}
.tbl table{border-collapse:collapse;width:100%;min-width:520px;font-size:13.5px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.tbl thead th{font:500 11px/1.2 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--soft)}
.tbl tbody th{font-weight:600;white-space:nowrap}
.tbl tbody tr:nth-child(even) td,.tbl tbody tr:nth-child(even) th{background:color-mix(in srgb,var(--soft) 45%,transparent)}
.tnote{font-size:13px;color:var(--muted);margin:8px 0 0;max-width:72ch}
.tregions{font-size:12.5px;margin:8px 0 0;color:var(--muted)}
.mnems{display:grid;grid-template-columns:1fr;gap:8px}
@media (min-width:640px){.mnems{grid-template-columns:1fr 1fr}}
.mnem{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;gap:3px}
.mnem b{font:700 16px/1.3 var(--f-display);color:var(--accent)}.mnem span:last-child{font-size:13.5px}
.dg{margin:14px 0 0}.dg svg{display:block;width:100%;height:auto;margin:0 auto;font-family:var(--f-body)}
.dg figcaption{font-size:12.5px;color:var(--muted);margin-top:6px;max-width:68ch}
.studyseg{margin-bottom:14px}.studyseg .chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dtitle{font-size:19px;margin-top:2px}
.dwrap{background:var(--plate);border:1px solid var(--line);border-radius:14px;padding:8px;overflow:auto;max-height:70vh}
.dstage{position:relative;width:100%;margin:0 auto}
.dwrap.zoom .dstage{width:200%}
@media (min-width:900px){.dwrap.zoom .dstage{width:150%}}
.dstage img{display:block;width:100%;height:auto}
.mask{position:absolute;border:0;border-radius:2px;background:#3B4A57;padding:0;color:#fff;font:700 11px/1 var(--f-mono);display:flex;align-items:center;justify-content:center;overflow:hidden}
.mask.target{background:var(--accent);outline:2px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:1px;animation:pulse 1.4s ease-in-out infinite}
.mask.open{background:transparent;outline:1.5px solid var(--ok);outline-offset:0;animation:none}
@keyframes pulse{50%{outline-color:transparent}}
.dbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:10px 0 0}
.rate2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 0;max-width:420px}
.rate2 button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px;font-weight:600}
.rate2 .again{color:var(--artery)}.rate2 .easy{color:var(--ok)}
.actions .sp{flex:1}

/* v4: surgical / imaging / discrepancy */
.sec header{flex-wrap:wrap}
.kind{width:100%;font:500 10.5px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--vein);margin-bottom:-2px}
.sec.theatre{border-left:3px solid var(--artery)}.sec.theatre .kind{color:var(--artery)}
.sec.imaging{border-left:3px solid var(--vein)}
.disc{margin:10px 0 0;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--nerve) 14%,var(--surface));font-size:14px;max-width:68ch}
.disc span{font:500 10px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:color-mix(in srgb,var(--nerve) 70%,var(--ink));display:block;margin-bottom:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.figfilters{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:520px){.figfilters{grid-template-columns:1fr}}

/* ===== EAR & TEMPORAL BONE ===== */
R("temporal","Temporal bone & skull base","The bony house of the ear: five parts, three petrous surfaces, the foramina of the skull base and the landmarks you drill by.",[
 S("Overview and contents",["s19_10","d14_18"],[
  "Forms part of the **base and lateral wall** of the skull; its petrous part is pyramid-shaped. Articulates with 5 bones: occipital, parietal, sphenoid, zygomatic and the mandible (TMJ).",
  "The **petrous part separates the middle from the posterior cranial fossa**.",
  "**Houses:** bony EAC, middle ear with the ossicles, inner ear, the fallopian canal (facial nerve), the carotid canal (ICA), and bony cover of the sigmoid sinus and jugular bulb.",
  "**Five parts:** squamous, petrous, mastoid, tympanic and the styloid process.",
  "**Squamous part:** lateral wall of the middle cranial fossa and the **roof of the bony EAC**; its zygomatic process roofs the mandibular fossa."],
  "The ear sits next to the middle and posterior fossae, the jugular bulb, sigmoid sinus, ICA and cranial nerves V–XII. This is why otitis media can produce intracranial complications."),
 S("Petrous part: three surfaces",["s22_14","s24_17","s25_18","s25_19","s20_11"],[
  "**Anterior surface** (floor of the middle cranial fossa): **arcuate eminence** of the superior canal medially, **tegmen tympani and tegmen antri** laterally, canal for tensor tympani and the ET in front, **trigeminal impression** at the apex, and hiatuses for the greater and lesser petrosal nerves.",
  "**Posterior surface** (front of the posterior fossa): **internal acoustic meatus** (VII, VIII, labyrinthine vessels), **subarcuate fossa** superolateral to the IAM, the **operculum** for the vestibular aqueduct inferolateral to it, and grooves for the sigmoid, superior and inferior petrosal sinuses.",
  "**Inferior surface:** jugular fossa (jugular bulb), lower opening of the **carotid canal** in front of it, separated by a wedge of bone called the **keel (caroticojugular crest)**.",
  "The **tympanic canaliculus** in the keel transmits **Jacobson's nerve** (tympanic branch of IX). The **cochlear aqueduct** opens at the top of the jugular foramen.",
  "The **jugular foramen** forms where the petrous and occipital bones meet."],
  "Petrous apicitis (Gradenigo's syndrome): ear discharge, retro-orbital pain (V at the apex) and lateral rectus palsy (VI in Dorello's canal)."),
 S("Tympanic and mastoid parts, styloid process",["s26_21","s27_24","s28_26"],[
  "**Tympanic part:** forms the anterior wall, floor and posterior wall of the bony EAC, the anterior wall and floor of the middle ear, and the back of the mandibular fossa.",
  "**Sutures:** in the bony EAC, **tympanosquamous** in front and **tympanomastoid** behind; in the middle ear, the **petrotympanic (Glaserian) fissure**, through which the chorda tympani leaves.",
  "**Mastoid part:** the tip receives **SCM**; the **digastric groove** gives origin to the posterior belly of digastric and ends in front at the **stylomastoid foramen**; an emissary vein to the sigmoid sinus passes through the mastoid foramen.",
  "The **mastoid antrum lies deep to Macewen's (suprameatal) triangle**.",
  "**Styloid process:** in front of the stylomastoid foramen. **Three muscles** (stylohyoid, styloglossus, stylopharyngeus) and **two ligaments** (stylohyoid, stylomandibular)."],
  "Stylomandibular ligament separates the parotid from the submandibular gland; an elongated styloid (over 3 cm) causes Eagle's syndrome."),
 S("Foramina of the skull base",["d20_30","s153_58","d28_46","d29_47","d32_49"],[
  "**Cribriform plate:** olfactory nerves (anterior fossa).",
  "**Optic canal:** optic nerve and ophthalmic artery.",
  "**Superior orbital fissure:** III, IV, VI, the three branches of V1 (lacrimal, frontal, nasociliary) and the superior ophthalmic vein.",
  "**Foramen rotundum:** V2. **Foramen ovale (MALE):** Mandibular nerve, Accessory meningeal artery, Lesser petrosal nerve, Emissary vein. **Foramen spinosum:** middle meningeal artery and the meningeal branch of V3.",
  "**Foramen lacerum:** filled with cartilage; the ICA crosses its upper part, and the greater petrosal joins the deep petrosal to form the vidian nerve.",
  "**Internal acoustic meatus:** VII, nervus intermedius, VIII and labyrinthine vessels.",
  "**Jugular foramen:** IX, X, XI, the IJV (from the sigmoid sinus) and the inferior petrosal sinus. **Hypoglossal canal:** XII. **Stylomastoid foramen:** VII and the stylomastoid artery."],
  "Jugular foramen syndromes: Vernet = IX, X, XI. Collet–Sicard = IX–XII. Villaret = IX–XII plus the cervical sympathetic chain (Horner's)."),
 S("Pterygopalatine fossa",["d15_19","s161_72","s162_74"],[
  "Small inverted pyramidal space behind the maxilla. **Roof:** body of sphenoid. **Front:** maxilla. **Back:** pterygoid plates. **Medial:** perpendicular plate of the palatine bone.",
  "**Contents:** third part of the maxillary artery, the maxillary nerve (V2) and the **pterygopalatine (sphenopalatine) ganglion**.",
  "**Communications:** orbit (inferior orbital fissure), middle cranial fossa (foramen rotundum), foramen lacerum (vidian canal), nasopharynx (palatovaginal canal), nasal cavity (**sphenopalatine foramen**), infratemporal fossa (**pterygomaxillary fissure**), oral cavity (greater and lesser palatine canals)."],
  "Juvenile angiofibroma starts at the sphenopalatine foramen and spreads through these communications. Widening of the pterygopalatine fossa pushes the back wall of the maxilla forward (Holman–Miller sign).")
]);

R("extear","External ear & tympanic membrane","Auricle, external canal and the drum: cartilage, skin, nerves, lymphatics and the otoscopic landmarks you check every day.",[
 S("Auricle",["s29_27","s30_28","s30_29"],[
  "Single piece of **yellow elastic cartilage** covered with skin. The **lobule has no cartilage** (fat and fibrous tissue only).",
  "Skin is **tightly adherent on the lateral surface**, looser on the medial surface. Keratinising squamous epithelium with sebaceous glands and hair follicles.",
  "**Incisura terminalis:** the gap between the tragus and crus of the helix; it has no cartilage, so an endaural incision here avoids cutting cartilage."],
  "Because lateral skin is stuck to the perichondrium, a haematoma lifts the perichondrium off the cartilage and cuts its blood supply. Drain early to avoid cauliflower ear."),
 S("Nerve supply of the auricle and canal",["s31_30","s36_39","d187_9"],[
  "**Auriculotemporal (V3):** front of the lateral surface (tragus, crus of helix) and the anterosuperior canal wall; anterior half of the lateral TM.",
  "**Great auricular (C2, C3):** most of the medial surface and the back of the lateral surface, lobule.",
  "**Lesser occipital (C2):** upper part of the medial surface.",
  "**Arnold's nerve (auricular branch of X):** concha, posteroinferior canal wall and posterior half of the lateral TM.",
  "**Facial nerve (VII):** sensory twigs to the concha and posterior canal wall.",
  "**Jacobson's nerve (IX)** supplies the medial (mucosal) surface of the TM."],
  "Hitselberger's sign: numbness of the posterior canal wall in acoustic neuroma (VII sensory fibres affected early). Cleaning the canal can trigger the vagal cough or fainting reflex through Arnold's nerve."),
 S("External auditory canal",["s32_33","s33_35","s33_36","d188_10"],[
  "**24 mm long, S-shaped.** The anterior wall is about 6 mm longer than the posterior because the TM is oblique.",
  "**Cartilaginous outer third (8 mm):** runs up, back and in. Thick skin with **hair, ceruminous and pilosebaceous glands** (wax and furuncles occur only here).",
  "**Bony inner two-thirds (16 mm):** runs down, forward and in. Thin skin, no hair or glands, continuous with the TM.",
  "Straighten the adult canal by pulling the pinna **up and back**; in infants, **down and back**.",
  "**Isthmus:** narrowest part of the bony canal, about 6 mm lateral to the TM. The **anterior recess** lies medial to it and traps debris.",
  "**Fissures of Santorini** in the cartilage and the **foramen of Huschke** (anteroinferior bony defect, mainly in children) allow spread between the canal and the parotid/TMJ.",
  "**Relations:** above, middle cranial fossa; below, parotid; front, TMJ; behind, mastoid air cells and facial nerve.",
  "Skin migrates **from medial to lateral**, which makes the canal self-cleaning."],
  "Malignant otitis externa spreads through the fissures of Santorini to the skull base, and the first cranial nerve affected is usually VII at the stylomastoid foramen."),
 S("Lymphatics of the external ear",[],[
  "Tragus, front of the auricle and anterior canal → **preauricular (parotid)** nodes.",
  "Back of the auricle → **postauricular (mastoid)** nodes.",
  "Lobule and floor of the canal → **infra-auricular** nodes, then upper deep cervical nodes.",
  "Middle ear and ET drain to the **retropharyngeal** nodes. The **inner ear has no lymphatics**."],""),
 S("Tympanic membrane",["s37_41","s37_43","s37_42","d188_11"],[
  "**9–10 mm high, 8–9 mm wide, 0.1 mm thick.** Set obliquely at **55°** to the canal floor; the posterosuperior part is more lateral.",
  "**Pars tensa:** most of the drum, with a thickened rim, the **annulus**, sitting in the tympanic sulcus. The **umbo** is the tip of the malleus handle; the **cone of light** points anteroinferiorly.",
  "**Pars flaccida (Shrapnell's):** above the lateral process of the malleus, between the anterior and posterior malleal folds and the **notch of Rivinus** (no annulus here). Slightly pink.",
  "**Three layers:** outer epithelium (from canal skin), middle fibrous layer (radial, circular and parabolic fibres; poorly organised in the pars flaccida), inner mucosa (from the middle ear).",
  "Seen through a normal drum: long process of incus, incudostapedial joint, round window niche and the ET orifice.",
  "**Mobility** is tested with Siegel's pneumatic speculum."],
  "Pars flaccida lacks an organised fibrous layer, so attic retraction pockets and cholesteatoma begin here.")
]);

R("midear","Middle ear & mastoid","The middle ear cleft as a six-walled box: what lies on each wall, the ossicles, muscles, nerves, folds and the mastoid you open in surgery.",[
 S("Middle ear cleft and its parts",["s41_0","s42_1","s50_17"],[
  "**Middle ear cleft:** ET, middle ear, aditus, mastoid antrum and mastoid air cells. Lined by mucosa. The tympanic cavity is about 1–2 cm³; the whole cleft is larger and depends on mastoid pneumatisation.",
  "**Contents:** 3 ossicles, 2 muscles (tensor tympani, stapedius), 2 nerves (chorda tympani, tympanic plexus).",
  "**Mesotympanum:** at the level of the pars tensa. **Epitympanum (attic):** above it, medial to Shrapnell's membrane and the scutum. **Hypotympanum:** below the pars tensa. **Protympanum:** around the ET opening."],
  "Neighbours that make complications possible: tegmen above (temporal lobe), jugular bulb below, ICA in front, sigmoid sinus behind, labyrinth medially."),
 S("The six walls",["s44_5","s49_16","d189_13"],[
  "**Roof (tegmental):** tegmen tympani, continuous back as the tegmen antri; separates from the middle cranial fossa.",
  "**Floor (jugular):** thin bone over the **jugular bulb**; may be dehiscent.",
  "**Anterior (carotid):** thin bone over the **ICA**, the **ET** opening, the **canal for tensor tympani** above it, the canal for chorda tympani (anterior canaliculus) and the anterior malleal ligament.",
  "**Posterior (mastoid):** **aditus ad antrum** above, **pyramid** (stapedius tendon) below it, vertical facial nerve behind, **facial recess** lateral and **sinus tympani** medial to the pyramid.",
  "**Medial (labyrinthine):** **promontory** (basal turn of cochlea), **oval window** (stapes footplate), **round window** (secondary TM), horizontal **facial canal** above the oval window, **lateral SCC** above the facial canal, **processus cochleariformis** in front of the oval window.",
  "**Lateral (membranous):** TM below, bony **scutum** (lateral attic wall) above."],
  "A dehiscent jugular bulb can bulge into the middle ear and be injured at myringotomy or cochlear implant surgery. The tympanic facial nerve is dehiscent in many people, which is why acute otitis media can cause facial palsy."),
 S("Facial recess and sinus tympani",["s47_9","s47_12"],[
  "**Facial (suprapyramidal) recess:** lateral to the pyramid. Medial: vertical facial nerve. Lateral: **chorda tympani** and annulus. Above: **fossa incudis** (short process of incus).",
  "**Sinus tympani (infrapyramidal recess):** medial to the pyramid and the facial nerve, between the ponticulus above and subiculum below.",
  "**Posterior tympanotomy** opens the middle ear through the facial recess without taking down the canal wall: used in combined-approach tympanoplasty and cochlear implantation."],
  "The sinus tympani is hidden from both the canal and the mastoid view, so residual cholesteatoma most often hides here."),
 S("Ossicles",["s51_18","s52_19","d191_14"],[
  "**Malleus** (8 mm, largest): head and neck in the attic; **handle embedded in the TM**; lateral process seen as a knob on the drum; anterior process.",
  "**Incus:** body and short process in the attic (short process in the fossa incudis); **long process** hangs down to form the **incudostapedial joint**.",
  "**Stapes** (3.5 mm, smallest bone in the body): head, neck, anterior and posterior crura, **footplate** held in the oval window by the annular ligament.",
  "**Impedance matching:** the TM is about 17 times larger than the footplate and the ossicular lever adds about 1.3×, so pressure rises about 22 times (roughly 25–30 dB). Without it most sound would reflect off the fluid-filled cochlea.",
  "Origin: malleus head and incus body from the 1st arch; handle of malleus, long process of incus and stapes superstructure from the 2nd arch; footplate partly from the otic capsule."],
  "The long process of incus has the poorest blood supply, so it is the part most often eroded in chronic otitis media."),
 S("Intratympanic muscles",["s52_19"],[
  "**Tensor tympani** (1st arch, **V3**): from its canal above the ET; tendon turns round the **processus cochleariformis** to the neck of the malleus. Tenses the TM.",
  "**Stapedius** (2nd arch, **nerve to stapedius from VII**): from the pyramid to the neck of the stapes. Dampens loud sound.",
  "**Acoustic (stapedial) reflex:** sound over about 80 dB contracts stapedius; protects the cochlea, works as gain control, and reduces self-generated noise during chewing and speech."],
  "Hyperacusis in Bell's palsy means the lesion is above the nerve to stapedius."),
 S("Nerves of the middle ear",["s54_20"],[
  "**Tympanic plexus** on the promontory: Jacobson's nerve (IX) plus caroticotympanic sympathetic fibres. Supplies the medial TM, cavity, mastoid cells and bony ET.",
  "**Parotid secretomotor pathway:** inferior salivatory nucleus → IX → Jacobson's nerve → tympanic plexus → **lesser petrosal nerve** → **otic ganglion** → auriculotemporal nerve → parotid.",
  "**Chorda tympani (VII):** enters through the posterior canaliculus, runs on the medial surface of the TM **between the malleus handle and the long process of incus**, leaves through the petrotympanic fissure. Carries **taste from the anterior two-thirds of the tongue** and secretomotor fibres to the submandibular and sublingual glands."],
  "Referred otalgia: pain from the tonsil or tongue base reaches the ear through IX (Jacobson's nerve) and from the larynx and hypopharynx through X (Arnold's nerve)."),
 S("Mucosal folds and compartments",["s55_21","s55_22"],[
  "Middle ear mucosa wraps the ossicles and ligaments like peritoneum; the folds divide the cleft into compartments that steer cholesteatoma.",
  "**Prussak's space:** lateral = pars flaccida; medial = neck of malleus; floor = lateral process of malleus; roof = lateral malleal ligament.",
  "Attic is divided by the superior malleal fold into a small anterior and a large posterior compartment.",
  "**Pouches of von Troeltsch:** anterior and posterior, between the malleal folds and the TM in front of and behind the malleus handle.",
  "Mucosa: anterior and inferior parts have ciliated cells and goblet cells (clearance); posterior and attic parts are flat cells (gas exchange). ET is lined by ciliated pseudostratified columnar epithelium."],
  "Pars flaccida cholesteatoma fills Prussak's space first, then spreads to the posterior attic and down the posterior pouch."),
 S("Mastoid antrum and air cells",["s57_23","s57_24","s58_26","s60_30","s61_31","s62_32"],[
  "**Antrum:** about 9 × 14 × 7 mm; present in all mastoids (most constant cell). Connected to the attic by the **aditus**.",
  "**Macewen's triangle** marks the antrum, about **1.5 cm** deep: above, the **temporal line**; front, posterosuperior canal margin with the **spine of Henle**; behind, a tangent to the back of the canal.",
  "**Relations:** roof = tegmen antri (middle fossa); medial = posterior SCC, endolymphatic sac, posterior fossa dura; behind = sigmoid sinus.",
  "**Mastoid types:** cellular (~80%), diploic, sclerotic (acellular). In a sclerotic mastoid the antrum is small and the sigmoid sinus may lie far forward.",
  "**Cell groups:** perilabyrinthine, perisinus, peritubal, tegmen, tip, zygomatic, retrofacial, squamous; peritubal and hypotympanic cells reach the petrous apex.",
  "**Körner's septum:** persistent petrosquamous plate that separates superficial squamous cells from deep petrous cells and can be mistaken for the medial wall of the antrum, so the antrum and deep cells are missed."],
  "Opening only the superficial cells above Körner's septum and missing the antrum is a classic cause of persistent mastoiditis after surgery."),
 S("Blood supply and lymphatics",[],[
  "Mainly from the ECA: **anterior tympanic** (maxillary artery) and **stylomastoid** (posterior auricular) are the major contributors; also superior tympanic and petrosal branches (middle meningeal), tympanic branch of ascending pharyngeal, artery of the pterygoid canal.",
  "ICA contributes caroticotympanic branches.",
  "Veins drain to the pterygoid plexus, superior petrosal sinus and sigmoid sinus.",
  "Lymph: middle ear → **retropharyngeal** and parotid nodes, then upper deep cervical; ET → retropharyngeal."],"")
]);

R("inner","Inner ear & IAC","Bony and membranous labyrinth, the fluids, organ of Corti, vestibular receptors, blood supply and the fundus of the IAC.",[
 S("Bony labyrinth",["s65_1","s67_3","d212_48"],[
  "**Vestibule** (central chamber, 5 mm): **oval window** in the lateral wall; medial wall has the **spherical recess** (saccule, in front) and **elliptical recess** (utricle, behind), separated by the vestibular crest; opening of the **vestibular aqueduct** below the elliptical recess.",
  "**Semicircular canals:** each two-thirds of a circle, 0.8 mm diameter, at right angles to each other. They open into the vestibule by **5 openings**: three ampullated ends, the non-ampullated end of the lateral canal, and the **crus commune** of the superior and posterior canals.",
  "**Lateral canal** tilts 30° from the horizontal and bulges into the aditus and antrum. **Superior canal** lies across the petrous axis (arcuate eminence). **Posterior canal** parallels the posterior surface of the petrous bone.",
  "**Cochlea:** **2.5–2.75 turns** around the **modiolus**; about 30–35 mm long, 5 mm base to apex. The **osseous spiral lamina** winds round the modiolus and carries the basilar membrane; **Rosenthal's canal** holds the spiral ganglion."],
  "The modiolus base faces the IAC; a wide IAC with an absent or deficient modiolus (IP-III, X-linked; also IP-I) predisposes to CSF gusher at cochlear implantation; IP-II (Mondini) usually gives only an ooze."),
 S("Scalae and windows",["s70_5","s73_7","s76_12","d214_51"],[
  "**Scala vestibuli** (top): continuous with the vestibule, closed by the stapes footplate at the oval window.",
  "**Scala tympani** (bottom): closed by the **secondary TM at the round window**.",
  "**Scala media (cochlear duct):** triangular; floor = **basilar membrane**, roof = **Reissner's membrane**, outer wall = **stria vascularis**.",
  "**Helicotrema** joins scala vestibuli and tympani at the apex.",
  "**Cochlear aqueduct** connects scala tympani to the subarachnoid space."],
  "Cochlear implant electrodes go into the scala tympani, through the round window or a cochleostomy just anteroinferior to it."),
 S("Membranous labyrinth",["s73_8","s75_10","d213_50"],[
  "Cochlear duct, utricle, saccule, three semicircular ducts, endolymphatic duct and sac.",
  "**Basilar membrane widens from base to apex:** high frequencies at the base, low at the apex (tonotopy).",
  "**Utricle** (posterior vestibule) receives the 5 openings of the semicircular ducts; **saccule** lies in front, opposite the stapes footplate, and joins the cochlear duct by the **ductus reuniens**.",
  "The **endolymphatic duct** runs in the vestibular aqueduct to the **endolymphatic sac**, between two layers of dura on the posterior petrous surface. It absorbs and regulates endolymph."],
  "The saccule sits right under the footplate, so it is the structure at risk from an overly deep stapedotomy piston."),
 S("Inner ear fluids",["s76_11"],[
  "**Perilymph** (between bony and membranous labyrinth): like extracellular fluid, **high Na+**, low K+. From blood filtrate in the spiral ligament and from CSF via the cochlear aqueduct.",
  "**Endolymph** (inside the membranous labyrinth): like intracellular fluid, **high K+ (~150 mEq/L)**, very low Na+. Secreted by the **stria vascularis** and dark cells of the vestibule.",
  "Absorption: **longitudinal flow** to the endolymphatic sac, and **radial flow** with secretion and absorption at the stria."],
  "Ménière's disease = endolymphatic hydrops; the sac is the target of endolymphatic sac surgery."),
 S("Organ of Corti",["s78_13"],[
  "Sits on the basilar membrane along its whole length. Tunnel of Corti between inner and outer rods contains cortilymph.",
  "**Inner hair cells:** about 3,500, one row, flask-shaped, receive **95% of afferent** spiral ganglion fibres; they transmit sound.",
  "**Outer hair cells:** about 12,000, 3–4 rows, cylindrical, mainly **efferent** from the superior olivary complex; they amplify and tune (cochlear amplifier) and generate **otoacoustic emissions**.",
  "OHCs are **more sensitive to ototoxic drugs and noise** than IHCs.",
  "Supporting cells: Deiters' (between OHCs), Hensen's. The **tectorial membrane** lies over the hair cells; shearing between them bends the stereocilia."],
  "Absent OAEs with present ABR waves points to outer hair cell loss; present OAEs with abnormal ABR points to auditory neuropathy."),
 S("Vestibular receptors",["s79_14","s80_17","s81_18"],[
  "**Cristae** in the ampullae detect **angular acceleration**. Hair cells project into the gelatinous **cupula**, which spans the ampulla like a swinging door.",
  "**Maculae** of the utricle (horizontal, larger, ~33,000 hair cells) and saccule (vertical, ~18,000) detect **linear acceleration and gravity**. They carry an otolithic membrane with **otoconia** (calcium carbonate).",
  "Each hair cell has many stereocilia and **one kinocilium**. Type I cells are flask-shaped with a calyx ending; type II are cylindrical with bouton endings.",
  "The **striola** divides each macula; polarity reverses across it.",
  "In the **lateral canal**, endolymph flow **toward the utricle (ampullopetal) excites**; in the superior and posterior canals, flow **away from the utricle excites** (Ewald)."],
  "Otoconia displaced from the utricle into the posterior canal cause posterior canal BPPV, the commonest peripheral vertigo."),
 S("Blood supply of the labyrinth",["s83_20"],[
  "**Labyrinthine (internal auditory) artery**, usually from **AICA**, sometimes the basilar artery. It is an **end artery**.",
  "Divides into the anterior vestibular artery and the common cochlear artery (main cochlear and vestibulocochlear branches).",
  "Veins: internal auditory vein and veins of the cochlear and vestibular aqueducts, to the inferior petrosal and sigmoid sinuses."],
  "End-artery supply explains sudden sensorineural hearing loss and vertigo from AICA territory strokes."),
 S("Internal auditory canal",["s84_21","s84_22"],[
  "About **1 cm long**, lined by dura, running laterally into the petrous bone. The **fundus** is closed by a cribriform plate.",
  "The **transverse (falciform) crest** splits the fundus into upper and lower parts; **Bill's bar** (vertical crest) splits the upper part.",
  "**Quadrants:** facial nerve **anterosuperior**; superior vestibular **posterosuperior**; cochlear **anteroinferior**; inferior vestibular **posteroinferior** (with the singular nerve to the posterior canal).",
  "**Superior vestibular nerve:** superior and lateral canals, utricle, part of the saccule. **Inferior vestibular nerve:** posterior canal and most of the saccule.",
  "An AICA loop can run between VII and VIII and is a landmark in vestibular schwannoma surgery."],
  "Mnemonic: \"Seven-Up, Coke Down\" (facial above, cochlear below, both in front). Bill's bar separates the facial from the superior vestibular nerve in translabyrinthine surgery."),
 S("Central auditory and vestibular pathways",["s85_23","s87_25"],[
  "**Auditory pathway (E-COLI-MA):** Eighth nerve → Cochlear nuclei → superior Olivary complex → Lateral lemniscus → Inferior colliculus → Medial geniculate body → Auditory cortex (superior temporal gyrus, area 41).",
  "Each ear projects to **both** hemispheres, so a unilateral cortical lesion does not cause unilateral deafness.",
  "Four vestibular nuclei: superior, inferior, medial, lateral. Outputs: **medial longitudinal fasciculus** (vestibulo-ocular reflex, nystagmus), vestibulospinal tract (posture), vestibulocerebellar tract, autonomic centres (nausea, sweating) and the temporal cortex (awareness of motion).",
  "Vestibular neurons fire at rest at about 90 spikes per second; asymmetry between the two sides produces vertigo."],"")
]);

R("facial","Facial nerve","The nerve you protect in every ear and parotid operation: nuclei and fibres, the segments, branches in order, and the surgical landmarks.",[
 S("Components and nuclei",["d153_45"],[
  "**Motor (special visceral efferent):** muscles of facial expression, stapedius, posterior belly of digastric, stylohyoid (2nd arch).",
  "**Secretomotor (parasympathetic) from the superior salivatory nucleus:** lacrimal gland and nasal glands (via the greater petrosal nerve and pterygopalatine ganglion); submandibular and sublingual glands (via chorda tympani and submandibular ganglion).",
  "**Taste:** anterior two-thirds of the tongue (chorda tympani) and the palate (greater petrosal); cell bodies in the **geniculate ganglion**, ending in the nucleus of the tractus solitarius.",
  "**General sensation:** small area of the concha and posterior canal wall.",
  "The sensory and parasympathetic fibres travel in the **nervus intermedius**."],
  "Upper motor neurone lesions spare the forehead because the upper face receives bilateral cortical supply."),
 S("Intratemporal segments",["d153_43","s49_16","s54_20","s84_22"],[
  "**Cerebellopontine angle** → **meatal segment** (8–10 mm) in the anterosuperior IAC above the crista falciformis, in front of Bill's bar.",
  "**Labyrinthine segment** (3–5 mm): the **narrowest part of the fallopian canal** (about 0.68 mm), from the fundus to the **geniculate ganglion** (first genu), where the **greater petrosal nerve** leaves.",
  "**Tympanic (horizontal) segment** (8–11 mm): along the medial wall, **above the oval window and below the lateral SCC**, ending near the pyramid at the **second genu**. Most common site of **dehiscence**.",
  "**Mastoid (vertical) segment** (about 15–20 mm): down behind the posterior wall to the **stylomastoid foramen**; gives the **nerve to stapedius** and **chorda tympani** (usually 3–5 mm above the foramen)."],
  "The labyrinthine segment is narrow and its blood supply is watershed, which is why swelling here is blamed for Bell's palsy."),
 S("Branches in order",["d153_45","d153_44","s184_47"],[
  "Inside the temporal bone: **greater petrosal** (geniculate ganglion), **nerve to stapedius**, **chorda tympani**.",
  "At the stylomastoid foramen: **posterior auricular**, **digastric** (posterior belly) and **stylohyoid** branches.",
  "In the parotid: divides at the **pes anserinus** into **temporofacial** and **cervicofacial** divisions, giving **temporal, zygomatic, buccal, marginal mandibular and cervical** branches.",
  "Topognostic tests: Schirmer's (greater petrosal), stapedial reflex (nerve to stapedius), taste and salivary flow (chorda tympani)."],
  "Mnemonic for the facial branches: \"To Zanzibar By Motor Car\"."),
 S("Finding the trunk at parotidectomy",["s186_50","s187_52","s188_56","s187_54"],[
  "**Tragal pointer:** the nerve lies about **1–1.5 cm deep, medial and inferior** to the tip of the tragal cartilage.",
  "**Tympanomastoid suture:** the nerve lies **6–8 mm deep** to its outer end (the most reliable bony landmark).",
  "**Posterior belly of digastric:** the nerve runs just above its upper border near the mastoid attachment, at about the same depth.",
  "**Styloid process:** the nerve crosses its posterolateral base; it is deeper than the nerve, so it is not a safe landmark to dissect toward.",
  "**Retrograde approach** from peripheral branches: buccal branch runs about 1 cm above and parallel to Stensen's duct; marginal mandibular branch runs superficial to the facial vessels about 1–2 cm below the mandible."],
  "Identify at least two landmarks before dividing tissue deep to the tragal pointer."),
 S("Grading facial palsy",[],[
  "**House–Brackmann:** I normal; II mild (slight weakness, normal at rest); III moderate (obvious but not disfiguring, eye closes with effort); IV moderately severe (incomplete eye closure); V severe (barely perceptible movement); VI total paralysis.",
  "Grade IV and above is defined by incomplete eye closure, which needs eye protection."],"")
]);

R("et","Eustachian tube","The tube that ventilates, drains and protects the middle ear: parts, dimensions, muscles, lining, and why children get more otitis media.",[
 S("Parts and dimensions",["ns205_3","s57_23"],[
  "Connects the **anterior wall of the middle ear** (protympanum) with the **lateral wall of the nasopharynx**.",
  "Adult length about **36 mm**: **bony part (posterolateral third, about 12 mm)** in the petrous bone and **cartilaginous part (anteromedial two-thirds, about 24 mm)**.",
  "Runs **downward, forward and medially**, at about **45° to the sagittal plane** and about 30–40° to the horizontal in adults (often quoted simply as 45°).",
  "The **isthmus**, where the two parts meet, is the narrowest point (about 1 × 2 mm).",
  "The bony part is always open; the **cartilaginous part is closed at rest** and opens on swallowing, yawning and sneezing.",
  "The cartilage is hook-shaped in section: a **medial lamina** and a short **lateral lamina**, completed below and laterally by membrane."],
  "The tympanic opening is about 4 mm above the floor of the middle ear, so the middle ear drains uphill and relies on mucociliary clearance."),
 S("Pharyngeal opening and relations",["s204_14","ns205_5","d171_72"],[
  "Opens on the lateral wall of the nasopharynx about **1.25 cm behind the posterior end of the inferior turbinate**, at the level of the inferior meatus.",
  "Bounded above and behind by the **torus tubarius** (cartilage), with the **salpingopharyngeal fold** running down from it and the **fossa of Rosenmüller** behind.",
  "Enters the pharynx through the **sinus of Morgagni**, above the superior constrictor, with levator veli palatini.",
  "**Relations:** above, the skull base; below, superior constrictor; medially, origin of levator veli palatini; laterally, tensor veli palatini, the otic ganglion and the mandibular nerve.",
  "The **tensor tympani** lies in its own canal directly above the bony part."],""),
 S("Muscles that open the tube",["d185_5"],[
  "**Tensor veli palatini (V3):** the main dilator. It arises from the lateral lamina and scaphoid fossa, hooks round the pterygoid hamulus and pulls the lateral wall away.",
  "**Levator veli palatini (X):** runs under the floor of the cartilaginous tube; its belly lifts the floor and rotates the medial lamina.",
  "**Salpingopharyngeus (X):** from the lower cartilage to the pharyngeal wall; minor role.",
  "**Ostmann's fat pad** lies laterally and helps keep the tube closed at rest."],
  "In cleft palate the tensor loses its anchor, so the tube does not open: most children with cleft palate have otitis media with effusion."),
 S("Lining, nerve and blood supply",[],[
  "**Respiratory epithelium** (ciliated pseudostratified columnar) with goblet cells and seromucous glands, more glands toward the pharynx. Cilia beat toward the nasopharynx.",
  "**Lymphoid tissue (Gerlach's tubal tonsil)** at the pharyngeal end.",
  "**Nerves:** tympanic plexus (IX) for the bony part; pharyngeal branch of the pterygopalatine ganglion (V2) for the pharyngeal end.",
  "**Arteries:** ascending pharyngeal, middle meningeal (accessory meningeal), artery of the pterygoid canal. **Lymph:** retropharyngeal nodes."],""),
 S("Functions",[],[
  "**Ventilation:** equalises middle ear pressure with the atmosphere and replaces absorbed gas.",
  "**Clearance:** mucociliary and muscular drainage of middle ear secretions to the nasopharynx.",
  "**Protection:** the closed tube blocks nasopharyngeal sound and secretions (reflux); a cushion of air in the middle ear resists reflux.",
  "Normal tube opening needs an intact palate, working muscles and a non-inflamed lining."],
  "Patulous ET: the tube stays open (weight loss, pregnancy), causing autophony and hearing one's own breathing; symptoms ease when lying down."),
 S("Infant vs adult tube",[],[
  "**Infant:** shorter (about 18 mm), **wider**, **more horizontal (about 10°)**, cartilage more floppy, opening at the level of the hard palate, and the tensor works less efficiently.",
  "**Adult:** about 36 mm, narrower, inclined about 30–45°, opening about 1 cm above the hard palate.",
  "The infant pattern lets nasopharyngeal secretions reflux into the middle ear and makes drainage poor, so **acute otitis media and OME peak in early childhood**.",
  "Adenoid hypertrophy adds obstruction and acts as a bacterial reservoir."],"")
]);

R("orbit","Orbit & sinus relations","The orbit as a neighbour of every sinus: walls, apertures, vessels, the lacrimal pathway and the routes by which sinus disease reaches the eye.",[
 S("Bony orbit",["nd94_0"],[
  "Pyramid with the apex at the **optic canal** and base at the orbital margin. Volume about 30 mL.",
  "**Roof:** orbital plate of frontal bone (frontal sinus and anterior cranial fossa above) and lesser wing of sphenoid.",
  "**Medial wall:** frontal process of maxilla, lacrimal bone, **lamina papyracea** (ethmoid) and body of sphenoid. Thinnest wall.",
  "**Floor:** orbital surface of maxilla, zygomatic and palatine bones; the **infraorbital groove and canal** cross it. **Maxillary sinus** below.",
  "**Lateral wall:** zygomatic bone and greater wing of sphenoid. Thickest wall.",
  "**Openings:** optic canal (II, ophthalmic artery), superior orbital fissure, inferior orbital fissure (V2, zygomatic nerve, inferior ophthalmic vein branch to pterygoid plexus), anterior and posterior ethmoidal foramina."],
  "Blow-out fractures break the floor posteromedial to the infraorbital canal or the lamina papyracea; entrapment of inferior rectus causes diplopia on upward gaze."),
 S("Orbital septum and periosteum",["nd105_18"],[
  "**Periosteum (periorbita)** lines the orbit; loosely attached except at the sutures, fissures and margin.",
  "**Orbital septum** runs from the orbital margin to the tarsal plates and divides **preseptal** (eyelid) from **postseptal** (orbit proper) compartments.",
  "Sinus infection usually reaches the orbit across the **lamina papyracea** or through **valveless ethmoidal veins**, and collects first between the bone and periorbita (subperiosteal abscess)."],""),
 S("Chandler classification of orbital complications",[],[
  "**I. Preseptal cellulitis:** lid swelling, normal vision and eye movement.",
  "**II. Orbital cellulitis:** diffuse orbital oedema; proptosis, chemosis, painful or reduced movement.",
  "**III. Subperiosteal abscess:** pus between the lamina papyracea and periorbita; displaces the globe down and out.",
  "**IV. Orbital abscess:** pus within the orbital fat; severe proptosis, ophthalmoplegia, visual loss.",
  "**V. Cavernous sinus thrombosis:** bilateral signs, III, IV, V1, V2, VI palsies, sepsis.",
  "Red flags for urgent CT and drainage: reduced acuity, loss of colour vision (red desaturation), afferent pupillary defect, ophthalmoplegia."],
  "Most orbital complications in children come from the ethmoid sinuses."),
 S("Vessels and nerves at risk in sinus surgery",["nd104_14","nd99_10","nd105_16"],[
  "**Anterior ethmoidal artery** leaves the orbit through the anterior ethmoidal foramen, crosses the ethmoid roof (often in a mesentery) behind the frontal recess, and enters the anterior cranial fossa.",
  "**Posterior ethmoidal foramen** lies about 6 mm (range 4–7 mm) in front of the optic canal.",
  "**Rule of 24-12-6 (approximate):** anterior lacrimal crest → anterior ethmoidal foramen 24 mm → posterior ethmoidal foramen 12 mm → optic canal 6 mm.",
  "**Optic nerve** can bulge into the posterior ethmoid (Onodi cell) or sphenoid sinus and may be dehiscent.",
  "**Ophthalmic veins** drain back to the cavernous sinus and down to the pterygoid plexus; they are valveless."],
  "A retrobulbar haematoma during FESS needs immediate lateral canthotomy and cantholysis; vision can be lost within about 90 minutes of ischaemia."),
 S("Cavernous sinus",["nd89_0","nd92_2","s156_63"],[
  "Venous space on each side of the sphenoid body, from the superior orbital fissure to the apex of the petrous bone.",
  "**Lateral wall (top to bottom):** **III, IV, V1, V2**.",
  "**Inside the sinus:** the **ICA** with its sympathetic plexus and the **abducens nerve (VI)** lateral to it.",
  "**Tributaries:** superior and inferior ophthalmic veins, sphenoparietal sinus, superficial middle cerebral vein. **Drains** to the superior and inferior petrosal sinuses; connects to the pterygoid plexus through emissary veins."],
  "VI is the nerve most often affected first in cavernous sinus thrombosis because it floats free inside the sinus."),
 S("Lacrimal drainage",["nd96_4","s101_33"],[
  "Tears drain through the **puncta** → **canaliculi** (vertical 2 mm, horizontal 8 mm) → **common canaliculus** → **lacrimal sac** (in its fossa between the anterior and posterior lacrimal crests) → **nasolacrimal duct** (about 12–18 mm) → **inferior meatus**.",
  "**Valve of Hasner** guards the lower end; **valve of Rosenmüller** guards the common canaliculus entry.",
  "The sac lies just in front of the uncinate process attachment and the anterior end of the middle turbinate (the axilla)."],
  "Endoscopic DCR opens the sac into the nose just in front of the middle turbinate axilla, removing the frontal process of maxilla and lacrimal bone.")
]);

R("itf","Infratemporal fossa & TMJ","The space behind the maxilla and under the skull base: boundaries, muscles of mastication, maxillary artery, pterygoid plexus, mandibular nerve and the TMJ.",[
 S("Boundaries and contents",["nd12_1","nd13_3","nd58_29"],[
  "**Roof:** infratemporal surface of the greater wing of sphenoid (with **foramen ovale** and **foramen spinosum**).",
  "**Lateral:** ramus of the mandible. **Medial:** lateral pterygoid plate. **Anterior:** back of the maxilla. **Posterior:** styloid process and carotid sheath. Open below.",
  "**Communicates** with the temporal fossa (deep to the zygomatic arch), the **pterygopalatine fossa** (pterygomaxillary fissure), the orbit (inferior orbital fissure) and the middle cranial fossa (foramina ovale and spinosum).",
  "**Contents:** lateral and medial pterygoid muscles, sphenomandibular ligament, **1st and 2nd parts of the maxillary artery**, **pterygoid venous plexus**, **mandibular nerve** and branches, **chorda tympani**, **otic ganglion**."],
  "Tumours of the parapharyngeal space, nasopharynx and maxilla reach the infratemporal fossa; trismus means the pterygoid muscles are involved."),
 S("Muscles of mastication",["nd55_25","nd56_26","nd57_27","nd57_28"],[
  "All from the **1st arch** and supplied by **V3**.",
  "**Masseter:** zygomatic arch → lateral ramus. Elevates; superficial fibres protrude.",
  "**Temporalis:** temporal fossa → coronoid process. Elevates; **posterior fibres retract**.",
  "**Medial pterygoid:** deep head from the medial surface of the lateral pterygoid plate, superficial head from the maxillary tuberosity → medial angle of mandible. Elevates, protrudes, side to side.",
  "**Lateral pterygoid:** upper head (infratemporal surface of greater wing) → disc and capsule; lower head (lateral surface of lateral pterygoid plate) → pterygoid fovea of the neck. **The only muscle that opens the mouth** (with gravity and the suprahyoids); protrudes and moves the jaw to the opposite side."],
  "Masseter, temporalis and medial pterygoid close the jaw; lateral pterygoid opens it. Trismus usually reflects spasm or invasion of the medial pterygoid."),
 S("Maxillary artery",["nd68_45","nd69_46"],[
  "Larger terminal branch of the ECA, from behind the neck of the mandible in the parotid.",
  "**1st (mandibular) part**, behind the neck of mandible: deep auricular, **anterior tympanic**, **middle meningeal** (through foramen spinosum), accessory meningeal, **inferior alveolar**.",
  "**2nd (pterygoid) part**, on or deep to the lateral pterygoid: deep temporal, pterygoid, masseteric, buccal branches (muscular).",
  "**3rd (pterygopalatine) part**, in the pterygopalatine fossa: posterior superior alveolar, infraorbital, descending (greater and lesser) palatine, artery of the pterygoid canal, pharyngeal, **sphenopalatine** (terminal, to the nose)."],
  "The sphenopalatine artery leaves the fossa through the sphenopalatine foramen behind the middle turbinate: the target in endoscopic ligation for posterior epistaxis."),
 S("Pterygoid venous plexus",["nd72_48"],[
  "Around the lateral pterygoid; drains to the **maxillary vein** and then the retromandibular vein.",
  "**Connections:** cavernous sinus (emissary veins through foramen ovale and lacerum), inferior ophthalmic vein (inferior orbital fissure), facial vein (deep facial vein)."],
  "A route for spread of infection from the face, teeth and nose to the cavernous sinus."),
 S("Mandibular nerve in the fossa",["nd59_31","nd59_32","nd58_30"],[
  "Sensory and motor roots join in the **foramen ovale**; the trunk lies between the lateral pterygoid (lateral) and tensor veli palatini (medial), with the **otic ganglion** on its medial side.",
  "**Trunk:** nervus spinosus (meninges), nerve to medial pterygoid (also to tensor tympani and tensor veli palatini through the otic ganglion).",
  "**Anterior division (mainly motor):** masseteric, deep temporal, nerve to lateral pterygoid, and the **buccal nerve** (sensory, cheek).",
  "**Posterior division (mainly sensory):** **auriculotemporal** (encircles the middle meningeal artery), **lingual**, **inferior alveolar** (with nerve to mylohyoid, its only motor branch).",
  "**Chorda tympani** joins the lingual nerve deep to the lateral pterygoid."],""),
 S("Temporomandibular joint",["nd203_0","nd203_2","nd203_1","nd203_3"],[
  "**Synovial, condylar** joint between the **mandibular fossa and articular eminence** above and the **head of mandible** below.",
  "A fibrocartilaginous **articular disc** divides it into **upper (gliding)** and **lower (hinge)** compartments; the lateral pterygoid inserts into the disc.",
  "**Ligaments:** lateral (temporomandibular) ligament is the main one; accessory ligaments are sphenomandibular, stylomandibular and pterygomandibular.",
  "**Nerves:** auriculotemporal and masseteric.",
  "**Opening:** first hinge in the lower compartment, then the condyle and disc glide forward onto the eminence in the upper compartment.",
  "The articular surfaces are covered with fibrocartilage, not hyaline cartilage (developed from membrane bone)."],
  "TMJ pain is a common cause of referred otalgia (auriculotemporal nerve). Anterior dislocation traps the condyle in front of the eminence; reduce by pressing down and back on the molars.")
]);

R("trigeminal","Trigeminal nerve","The great sensory nerve of the face, mouth, nose and sinuses: nuclei, the three divisions, their branches, ganglia and the referred pain it explains.",[
 S("Nuclei and ganglion",["nd152_0"],[
  "Largest cranial nerve. Leaves the **lateral pons** as a large sensory root and a small motor root.",
  "**Nuclei:** mesencephalic (proprioception from muscles of mastication), **main (principal) sensory** (touch), **spinal** (pain and temperature, down to C2), **motor** (pons).",
  "**Trigeminal (Gasserian) ganglion** sits in **Meckel's cave** over the petrous apex (trigeminal impression).",
  "Divides into **V1 (ophthalmic)**, **V2 (maxillary)** and **V3 (mandibular)**; only V3 carries motor fibres."],
  "The spinal nucleus reaches C2, which explains why pain from the upper neck can be felt in the face and why Wallenberg syndrome causes facial pain-and-temperature loss."),
 S("Ophthalmic nerve (V1)",["nd51_18"],[
  "Runs in the lateral wall of the cavernous sinus and enters the orbit through the **superior orbital fissure**.",
  "**Lacrimal** (lacrimal gland, lateral upper lid), **frontal** → supraorbital and supratrochlear (forehead, scalp, frontal sinus), **nasociliary** → anterior and posterior ethmoidal, long ciliary (cornea), infratrochlear.",
  "**Anterior ethmoidal nerve** ends as the **external nasal nerve**, supplying the skin of the nasal tip."],
  "Hutchinson's sign: herpes zoster vesicles on the nasal tip mean the nasociliary nerve is involved, so the eye is at risk."),
 S("Maxillary nerve (V2)",["nd65_42","nd66_43","nd67_44"],[
  "Purely sensory. Lateral wall of the cavernous sinus → **foramen rotundum** → **pterygopalatine fossa** → inferior orbital fissure → **infraorbital nerve** in the orbital floor → infraorbital foramen.",
  "**Branches:** meningeal; ganglionic (to the pterygopalatine ganglion); **zygomatic** (zygomaticofacial, zygomaticotemporal; carries lacrimal secretomotor fibres to the lacrimal nerve); **posterior, middle and anterior superior alveolar** (upper teeth, maxillary sinus); infraorbital (lower lid, cheek, side of nose, upper lip).",
  "**Through the pterygopalatine ganglion (sensory, no relay):** greater and lesser palatine (palate, tonsil), nasopalatine/long sphenopalatine (septum, front of palate), short sphenopalatine (lateral nasal wall), pharyngeal (nasopharynx, ET), orbital branches."],
  "Numbness of the cheek after a zygomatic or orbital floor fracture, or with a maxillary sinus tumour, means the infraorbital nerve is involved."),
 S("Mandibular nerve (V3)",["nd59_31","nd61_35","nd62_37"],[
  "Mixed. Leaves through the **foramen ovale** into the infratemporal fossa.",
  "**Motor:** muscles of mastication, mylohyoid, anterior belly of digastric, tensor tympani, tensor veli palatini.",
  "**Sensory:** lower face, chin, lower lip (mental), lower teeth (inferior alveolar), anterior two-thirds of tongue and floor of mouth (lingual), cheek mucosa (buccal), temple, auricle, EAC, TM and TMJ (auriculotemporal).",
  "**Lingual nerve** lies just under the mucosa against the inner surface of the **third molar** socket; it then crosses the submandibular duct (lateral → below → medial)."],
  "Third molar extraction can injure the lingual nerve; an inferior alveolar block numbs the lower lip and chin on that side."),
 S("Ganglia attached to the trigeminal",["nd63_38","nd64_41","nd67_44"],[
  "Four parasympathetic ganglia hang from the trigeminal divisions but get their secretomotor fibres from other nerves.",
  "**Ciliary** (V1): oculomotor parasympathetic → sphincter pupillae and ciliary muscle.",
  "**Pterygopalatine** (V2): greater petrosal (VII) → lacrimal, nasal, palatal glands. Largest of the four.",
  "**Otic** (V3): lesser petrosal (IX) → parotid via the auriculotemporal nerve.",
  "**Submandibular** (V3, hangs from the lingual): chorda tympani (VII) → submandibular and sublingual glands.",
  "Sympathetic and sensory fibres pass through each ganglion without relay."],""),
 S("Referred pain and clinical tests",["nd51_20"],[
  "**Referred otalgia via V3:** teeth (especially lower molars), TMJ, tongue, floor of mouth, retromolar trigone.",
  "**Referred pain via V2:** maxillary sinus and upper teeth to the cheek; sphenoid disease to the vertex.",
  "**Corneal reflex:** afferent V1 (nasociliary), efferent VII. Lost early with acoustic neuroma (V compression).",
  "**Jaw jerk:** afferent and efferent V3; brisk in upper motor neurone lesions.",
  "**Trigeminal neuralgia:** brief electric pains, usually V2 or V3, often from vascular compression at the root entry zone."],
  "Unexplained earache in an adult smoker: examine the oral cavity, oropharynx, hypopharynx and larynx before blaming the ear.")
]);

R("embryo","Embryology of head & neck","Pharyngeal arches, pouches and clefts; development of the ear, face, palate, tongue and thyroid, and the congenital anomalies each one explains.",[
 S("Pharyngeal apparatus",["ns203_0"],[
  "From the 4th week: **arches** (mesoderm and neural crest, each with a nerve, artery, cartilage and muscle), **pouches** (endoderm, inside) and **clefts** (ectoderm, outside), separated by membranes.",
  "Five arches develop: **1st, 2nd, 3rd, 4th and 6th** (the 5th regresses).",
  "**Nerves:** 1st V3, 2nd VII, 3rd IX, 4th superior laryngeal (X), 6th recurrent laryngeal (X).",
  "**Clefts:** the 1st becomes the **EAC**; the 2nd–4th are buried by the overgrowing 2nd arch as the **cervical sinus**, which normally disappears.",
  "**Rathke's pouch** (from the stomodeum roof) forms the anterior pituitary."],
  "A persistent cervical sinus or tract gives a branchial cyst, sinus or fistula; its relation to nerves and arteries tells you which arch it came from."),
 S("Development of the ear",["nd41_69"],[
  "**Inner ear:** from the **otic placode** (ectoderm) → otic pit → **otic vesicle** (week 4). The membranous labyrinth is adult size by about week 20–25; the otic capsule ossifies from 14 centres.",
  "**Middle ear and ET:** from the **1st pharyngeal pouch** (tubotympanic recess).",
  "**Ossicles:** **1st arch** gives the malleus head and incus body (and short process); **2nd arch** gives the handle of malleus, long process of incus and stapes superstructure; the footplate is partly from the otic capsule.",
  "**EAC:** from the **1st cleft**; a meatal plug canalises from about week 21–28.",
  "**Auricle:** from six **hillocks of His** (three on the 1st arch, three on the 2nd).",
  "**TM:** ectoderm (1st cleft), mesoderm and endoderm (1st pouch).",
  "**At birth:** tympanic ring incomplete, no mastoid process (facial nerve exits superficially), antrum present and adult-sized."],
  "Inner ear develops separately from the outer and middle ear, so microtia with canal atresia often has a normal cochlea. In infants the facial nerve is superficial at the stylomastoid foramen, so a postaural incision must stay high."),
 S("Development of the face",[],[
  "Five prominences around the stomodeum by week 4–5: one **frontonasal** and paired **maxillary** and **mandibular** prominences.",
  "Nasal placodes sink to form **medial and lateral nasal prominences**.",
  "**Medial nasal prominences** fuse to form the **intermaxillary segment**: philtrum, premaxilla with four incisors, primary palate.",
  "The **maxillary prominence** fuses with the medial nasal prominence to form the upper lip; the **nasolacrimal groove** between the maxillary and lateral nasal prominences forms the nasolacrimal duct.",
  "**Mandibular prominences** fuse to form the lower lip and jaw."],
  "Cleft lip results from failure of the maxillary and medial nasal prominences to fuse, so it lies lateral to the philtrum."),
 S("Development of the palate",[],[
  "**Primary palate** (premaxilla) from the intermaxillary segment, in front of the **incisive foramen**.",
  "**Secondary palate** from the two **palatal shelves** of the maxillary prominences, which grow down beside the tongue, rise above it and fuse in the midline (weeks 7–10), front to back.",
  "The nasal septum grows down and fuses with the palate.",
  "**Cleft lip and palate** classification: anterior to the incisive foramen (lip, alveolus), posterior to it (secondary palate), or both. **Submucous cleft:** bifid uvula, notch in the hard palate, translucent midline (zona pellucida)."],
  "Submucous cleft is a contraindication to adenoidectomy: removing the adenoid pad can cause velopharyngeal insufficiency and hypernasal speech."),
 S("Development of the tongue",[],[
  "**Anterior two-thirds:** from the 1st arch (two **lateral lingual swellings** and the median **tuberculum impar**) → general sensation by **V3** (lingual).",
  "**Posterior third:** from the **hypobranchial eminence** (mainly 3rd arch), which overgrows the 2nd-arch copula → **IX**.",
  "**Most posterior part and epiglottis:** 4th arch → **X**.",
  "**Muscles:** from occipital myotomes → **XII** (except palatoglossus, X).",
  "The **sulcus terminalis** marks the junction; the **foramen caecum** at its apex is where the thyroid began."],
  "Taste in the anterior two-thirds is VII (chorda tympani) because the 2nd-arch nerve invades early, even though the mucosa is 1st-arch."),
 S("Development of the thyroid and parathyroids",["s199_7"],[
  "Thyroid starts at the **foramen caecum** (week 3–4) as an endodermal diverticulum, descends in front of the pharynx and the **hyoid**, attached by the **thyroglossal duct**, reaching the front of the trachea by week 7.",
  "The duct normally disappears by week 10; its lower end may persist as the **pyramidal lobe**.",
  "**C cells** come from the **ultimobranchial body** (4th/5th pouch).",
  "**Inferior parathyroids and thymus:** 3rd pouch. **Superior parathyroids:** 4th pouch.",
  "**Anomalies:** thyroglossal duct cyst (midline, moves with swallowing and tongue protrusion), **lingual thyroid** (failure to descend; may be the only thyroid tissue), ectopic thyroid anywhere along the tract."],
  "Before excising a lingual thyroid or thyroglossal cyst, confirm normal thyroid tissue in the neck with ultrasound or a scan."),
 S("Development of the nose and sinuses",[],[
  "Nasal placodes → nasal pits → the oronasal membrane ruptures to form the **primitive choanae** (week 6–7). Failure gives **choanal atresia**.",
  "Lateral nasal wall develops ridges (ethmoturbinals) that become the turbinates; the furrows between them form the meatuses and sinus outgrowths.",
  "Sinuses arise as outpouchings of the nasal mucosa: maxillary (3rd month in utero), ethmoid (4th–5th month), sphenoid and frontal after birth.",
  "**Choanal atresia:** about 90% bony or mixed and 10% membranous; unilateral is more common. Bilateral atresia causes cyclical cyanosis relieved by crying in newborns (obligate nasal breathers). Associated with **CHARGE**."],
  "Failure to pass a size 6 catheter through the nose in a newborn with breathing difficulty suggests choanal atresia; confirm with CT.")
]);

/* ===== NOSE & SINUSES ===== */
R("nose","Nose & nasal cavity","External framework, the four walls of each cavity, septum, osteomeatal complex, mucosa, vessels and nerves.",[
 S("External nose",["s93_7","s94_11","s96_16","s97_18"],[
  "Pyramid of an **osteocartilaginous framework**: upper third bony (paired **nasal bones** on the frontal bone, between the frontal processes of the maxillae); lower two-thirds cartilaginous.",
  "**Upper lateral cartilages:** under the nasal bones above; their lower free edge forms the **internal nasal valve**. They fuse with the upper border of the septal cartilage.",
  "**Lower lateral (alar) cartilages:** U-shaped with a **lateral crus** (ala), **medial crus** (columella) and intermediate crus (**dome**, tip). The free alar rim is fibrofatty, not cartilage.",
  "Muscles: procerus, nasalis (transverse and alar parts), levator labii superioris alaeque nasi, depressor septi; all **facial nerve**.",
  "Skin is **thin and mobile over the dorsum**, **thick, adherent and sebaceous over the tip** (rhinophyma)."],
  "Saddle (supratip) deformity follows loss of septal cartilage support: septal abscess, over-resection at SMR, trauma or granulomatous disease."),
 S("Danger area of the face",["s97_22"],[
  "Triangle from the root of the nose to the corners of the mouth.",
  "Facial veins here are **valveless** and connect to the **cavernous sinus** through the ophthalmic veins and the pterygoid plexus (deep facial vein)."],
  "Squeezing a furuncle of the nasal vestibule or upper lip can cause cavernous sinus thrombosis."),
 S("Nasal cavity: walls and regions",["s98_25","s100_28","d106_37","s99_27"],[
  "Each cavity runs from the **nostril** to the **choana**. The skin-lined **vestibule** lies in front; the mucosa-lined cavity proper behind.",
  "**Roof:** sloping nasal bones in front, **cribriform plate** in the middle (olfactory nerves), body of sphenoid behind.",
  "**Floor:** palatine process of the maxilla (front three-quarters) and horizontal plate of the palatine bone (back quarter).",
  "**Medial wall:** the septum.",
  "**Lateral wall bones:** nasal, frontal process and medial surface of maxilla, lacrimal, ethmoid labyrinth, inferior turbinate, perpendicular plate of palatine, medial pterygoid plate.",
  "**Internal nasal valve:** the narrowest part of the nasal airway, bounded by the caudal edge of the upper lateral cartilage (limen nasi), the septum, the head of the inferior turbinate and the floor. Normal angle 10–15°."],
  "Cottle's test: pulling the cheek laterally improves breathing when the valve is the cause of obstruction."),
 S("Turbinates and meatuses",["s100_28","s102_35","d107_39","s101_33"],[
  "**Inferior turbinate:** largest, a **separate bone**. **Middle, superior and supreme:** parts of the ethmoid.",
  "**Inferior meatus:** **nasolacrimal duct** opens in its anterior part, about 1 cm behind the front of the turbinate, guarded by **Hasner's valve**.",
  "**Middle meatus:** the **osteomeatal complex**: frontal, maxillary and anterior ethmoid sinuses drain here.",
  "**Superior meatus:** posterior ethmoid cells.",

plugins { id 'com.android.application' }

android {
    namespace 'com.omar.entatlas'
    compileSdk 34

    defaultConfig {
        applicationId "com.omar.entatlas"
        minSdk 24
        targetSdk 34
        versionCode (System.getenv("GITHUB_RUN_NUMBER") ? System.getenv("GITHUB_RUN_NUMBER").toInteger() : 1)
        versionName "1.0." + (System.getenv("GITHUB_RUN_NUMBER") ?: "0")
    }

    signingConfigs {
        release {
            storeFile file("../signing/ent-atlas.jks")
            storePassword "entatlas2026"
            keyAlias "entatlas"
            keyPassword "entatlas2026"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources { noCompress += ["pdf", "jpg"] }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.13.1'
}

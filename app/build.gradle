plugins { id 'com.android.application' }

android {
    namespace 'com.omar.entatlas'
    compileSdk 34

    defaultConfig {
        applicationId "com.omar.entatlas"
        minSdk 24
        targetSdk 34
        versionCode (System.getenv("GITHUB_RUN_NUMBER") ? System.getenv("GITHUB_RUN_NUMBER").toInteger() : 1)
        versionName "1.0." + (System.getenv("GITHUB_RUN_NUMBER") ?: "0")
    }

    signingConfigs {
        release {
            // The password comes from the GitHub secret SIGNING_PASSWORD (passed in by .github/workflows/build.yml),
            // never from this file.
            storeFile file("../signing/ent-atlas.jks")
            storePassword System.getenv("SIGNING_PASSWORD")
            keyAlias "entatlas"
            keyPassword System.getenv("SIGNING_PASSWORD")
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // unsigned when there is no password (test builds of pull requests)
            signingConfig System.getenv("SIGNING_PASSWORD") ? signingConfigs.release : null
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources { noCompress += ["pdf", "jpg"] }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.13.1'
}
